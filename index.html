// Modal com a lista de itens ainda não contados nesta janela, agrupada por
// unidade — usado pelo botão "Ver lista" do aviso na aba Envios do Dia.
// items: [{ unit, name }]
function openNaoContadosModal(items) {
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
  const overlay = el('div', {cls:'modal-overlay'});
  const box = el('div', {cls:'modal-box', style:'max-width:480px'});

  const header = el('div', {cls:'modal-header'});
  header.appendChild(el('div', {cls:'modal-title'}, 'Itens não contados (' + items.length + ')'));
  header.appendChild(el('button', {cls:'modal-close', onclick:()=>overlay.remove()}, '×'));
  box.appendChild(header);

  const body = el('div', {cls:'modal-body', style:'max-height:70vh'});
  body.appendChild(el('p', {style:'padding:2px 20px 12px;color:var(--text-3);font-size:13px'},
    'Esses itens não entram no cálculo de A Enviar até a unidade confirmar a contagem (mesmo que a contagem real seja zero).'));

  const byUnit = {};
  items.forEach(({unit, name}) => {
    if (!byUnit[unit]) byUnit[unit] = [];
    byUnit[unit].push(name);
  });
  UNIT_NAMES.forEach(u => {
    const list = byUnit[u];
    if (!list || !list.length) return;
    body.appendChild(el('div', {cls:'dash-section-head'}, u + ' (' + list.length + ')'));
    list.forEach(name => {
      const row = el('div', {cls:'dash-detail-row'});
      row.appendChild(el('span', {cls:'dash-detail-name'}, name));
      body.appendChild(row);
    });
  });
  box.appendChild(body);

  const footer = el('div', {cls:'modal-footer'});
  footer.appendChild(el('button', {cls:'btn btn-outline', onclick:()=>overlay.remove()}, 'Fechar'));
  box.appendChild(footer);

  overlay.appendChild(box);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// ═══ ENVIOS DO DIA ═══════════════════════════════════════════════════════════
function viewEnviosDia() {
  const frag = document.createDocumentFragment();
  const day     = nextEnviarDay();
  const dayFull = {SEG:'Segunda-feira', QUA:'Quarta-feira', SEX:'Sexta-feira'}[day] || day;
  const _norm   = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

  // ── Seletor de dias a somar (SEG/QUA/SEX) ───────────────────────────────────
  // Por padrão, só o dia automático de hoje (comportamento de sempre). O
  // usuário pode marcar mais de um dia pra ver a soma dos mínimos — útil pra
  // ter uma ideia geral da semana ou programar uma compra que cubra vários
  // dias de uma vez. window._enviosDiaDias persiste entre renders (igual a
  // openCats), então a seleção não se perde ao digitar na busca etc.
  const DIA_LABEL_CURTO = {SEG:'Segunda', QUA:'Quarta', SEX:'Sexta'};
  const DIA_LABEL_FULL  = {SEG:'Segunda-feira', QUA:'Quarta-feira', SEX:'Sexta-feira'};
  const DIAS_ORDEM = ['SEG','QUA','SEX'];
  if (!window._enviosDiaDias || window._enviosDiaDias.length === 0) {
    window._enviosDiaDias = [day];
  }
  const diasSel = DIAS_ORDEM.filter(d => window._enviosDiaDias.includes(d));
  const ehSelecaoPadrao = diasSel.length === 1 && diasSel[0] === day;
  const diasSelFullTexto = diasSel.map(d => DIA_LABEL_FULL[d]).join(' + ');
  // Título mais curto pro cabeçalho do PDF quando tem mais de um dia somado
  // (evita estourar a largura da página com "Segunda-feira + Quarta-feira + Sexta-feira").
  const diasSelTituloPdf = diasSel.length === 1
    ? DIA_LABEL_FULL[diasSel[0]]
    : diasSel.join(' + ') + ' (soma)';

  // ── Cabeçalho ──────────────────────────────────────────────────────────────
  const hdrWrap = el('div', {style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px'});
  hdrWrap.appendChild(el('h2', {cls:'table-title'}, 'Envios do Dia'));
  const dayBadge = el('span', {cls:'envios-dia-day-badge'}, '\uD83D\uDE9A ' + dayFull);
  hdrWrap.appendChild(dayBadge);
  // Botões PDF
  const pdfWrap = el('div', {style:'display:flex;gap:6px;margin-left:auto;flex-wrap:wrap'});
  const btnProd = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:12px;display:flex;align-items:center;gap:5px'});
  btnProd.innerHTML = '\uD83D\uDCC4 PDF Produ\u00E7\u00E3o';
  btnProd.title = 'Lista de itens produzidos que faltam no CPD';
  btnProd.addEventListener('click', () => gerarPdfEnvios('produzido'));
  const btnComp = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:12px;display:flex;align-items:center;gap:5px'});
  btnComp.innerHTML = '\uD83D\uDCC4 PDF Compras';
  btnComp.title = 'Lista de itens comprados que faltam no CPD';
  btnComp.addEventListener('click', () => gerarPdfEnvios('comprado'));
  const btnTabela = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:12px;display:flex;align-items:center;gap:5px'});
  btnTabela.innerHTML = '📄 PDF Tabela';
  btnTabela.title = 'Imprime a tabela de envios (item + estoque e quantidade a enviar de cada unidade), sem Est. CPD e sem Situação';
  btnTabela.addEventListener('click', () => gerarPdfEnviosTabela(currentFilteredRows, diasSelTituloPdf, staleEntries));
  pdfWrap.appendChild(btnProd);
  pdfWrap.appendChild(btnComp);
  pdfWrap.appendChild(btnTabela);
  hdrWrap.appendChild(pdfWrap);
  frag.appendChild(hdrWrap);

  // ── Chips de seleção de dias ─────────────────────────────────────────────
  const diasWrap = el('div', {style:'display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px'});
  diasWrap.appendChild(el('span', {style:'font-size:11px;color:var(--text-3);font-weight:600'}, 'Somar dias:'));
  DIAS_ORDEM.forEach(d => {
    const ativo = diasSel.includes(d);
    const chip = el('button', {
      cls: 'btn btn-sm' + (ativo ? '' : ' btn-outline'),
      style: 'font-size:11px;padding:4px 12px;' + (ativo ? 'background:var(--accent,#1A5229);color:#fff;border-color:var(--accent,#1A5229);' : '')
    }, DIA_LABEL_CURTO[d]);
    chip.title = ativo ? 'Clique para remover ' + DIA_LABEL_CURTO[d] + ' da soma' : 'Clique para somar ' + DIA_LABEL_CURTO[d];
    chip.addEventListener('click', () => {
      const idx = window._enviosDiaDias.indexOf(d);
      if (idx >= 0) {
        if (window._enviosDiaDias.length > 1) window._enviosDiaDias.splice(idx, 1); // nunca deixar vazio
      } else {
        window._enviosDiaDias.push(d);
      }
      render();
    });
    diasWrap.appendChild(chip);
  });
  const btnTodos = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:11px;padding:4px 12px'}, 'Semana (3 dias)');
  btnTodos.title = 'Somar segunda + quarta + sexta — visão geral pra compra semanal';
  btnTodos.addEventListener('click', () => { window._enviosDiaDias = DIAS_ORDEM.slice(); render(); });
  diasWrap.appendChild(btnTodos);
  if (!ehSelecaoPadrao) {
    const btnReset = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:11px;padding:4px 12px'}, '\u21BB Voltar pra hoje');
    btnReset.title = 'Voltar a mostrar só o envio automático de hoje (' + dayFull + ')';
    btnReset.addEventListener('click', () => { window._enviosDiaDias = [day]; render(); });
    diasWrap.appendChild(btnReset);
  }
  frag.appendChild(diasWrap);

  // ── Aviso: visualização de planejamento, não é o envio operacional ──────────
  if (!ehSelecaoPadrao) {
    const vizBanner = el('div', {cls:'alert-banner', style:'margin-bottom:14px;align-items:center;background:var(--accent-bg,#EAF6EF);border:1.5px solid var(--accent,#1A5229)'});
    const vizIcon = el('span', {cls:'alert-banner-icon'}, '\uD83D\uDCCA');
    const vizBody = el('div', {cls:'alert-banner-body'});
    vizBody.appendChild(el('div', {cls:'alert-banner-title'}, 'Visualizando: ' + diasSelFullTexto));
    vizBody.appendChild(el('div', {cls:'alert-banner-items'},
      'Isso é uma projeção pra planejamento (compra semanal, visão geral) — não substitui o envio operacional de hoje (' + dayFull + ').'));
    vizBanner.appendChild(vizIcon);
    vizBanner.appendChild(vizBody);
    frag.appendChild(vizBanner);
  }

  // ── Coletar todos os itens que precisam de envio ───────────────────────────
  // 28/07: corrigido a pedido do Eduardo — antes, se uma unidade não tivesse
  // mínimo cadastrado pra ESSA unidade no(s) dia(s) selecionado(s), o
  // estoque real dela (Est.) simplesmente desaparecia da tabela (virava "-"),
  // mesmo a unidade tendo o item contado normalmente. Isso é perigoso: quem
  // olha "Est." pra decidir se precisa mandar algo pode achar que a unidade
  // não tem o produto quando na verdade tem, só não tinha mínimo pro dia
  // exibido. Agora: o item aparece na tabela se PELO MENOS UMA unidade
  // precisar de envio nesse(s) dia(s) (mesmo critério de sempre), mas TODAS
  // as unidades que têm o item no catálogo mostram o estoque real — só o "A
  // Enviar" fica "-"/0 nas unidades sem mínimo pro dia, o "Est." nunca some.
  const itemMap = new Map(); // itemKey → { name, category, unit, cpdId, perUnit: {unitName: {est, aEnv}} }
  // Unidade+categoria cujo estoque atual (potencialmente desatualizado) entrou
  // no cálculo de A Enviar de hoje — usado para o aviso de dado desatualizado
  const relevantPairs = new Set();

  // Passo 1: para cada unidade, somar estoque por item.key (cobre o caso de
  // um mesmo produto cadastrado em categorias diferentes) e calcular, sem
  // decidir ainda se o item "entra" na tabela — isso é feito só no Passo 2,
  // olhando as 4 unidades juntas.
  const porUnidade = {}; // unitName → { itemKey → { name, estSoma, item, minDia, contado, aEnviar } }
  UNIT_NAMES.forEach(unitName => {
    const ucat   = getUnitCatalog(unitName).catalog;
    const ustock = unitStock[unitName] || {};
    const minMap = getMinPerDay(unitName);

    // Itens com mesmo produto em categorias diferentes (ex: Morango em Refrig + Bar):
    // → SOMAR estoques de todos os IDs (agrupados por item.key, fixo mesmo se renomeado)
    // → calcAEnviarDias já usa MIN_PER_DAY consolidado (soma de todas as categorias)
    const _seenInUnit = {}; // item.key → { name, estSoma, item }
    ucat.forEach(item => {
      const key = item.key;
      const est = ustock[item.id] || 0;
      if (!_seenInUnit[key]) {
        _seenInUnit[key] = { name: item.name, estSoma: est, item };
      } else {
        _seenInUnit[key].estSoma += est;
      }
    });

    const resultado = {};
    Object.values(_seenInUnit).forEach(({ name, estSoma, item }) => {
      const minEntry = minMap[item.key];
      // 28/07: soma os mínimos de TODOS os dias selecionados no seletor (por
      // padrão só o dia de hoje, mesmo comportamento de sempre) — ver
      // window._enviosDiaDias / somaMinDias / calcAEnviarDias.
      const minDia = somaMinDias(minEntry, diasSel);
      const contado = itemFoiContado(unitName, item.id, estSoma);
      const aEnviar = (contado && minDia > 0) ? calcAEnviarDias(unitName, item.key, estSoma, diasSel) : 0;
      resultado[item.key] = { name, estSoma, item, minDia, contado, aEnviar };
    });
    porUnidade[unitName] = resultado;
  });

  // Passo 2: um item vira LINHA na tabela se pelo menos uma unidade precisa
  // dele nesse(s) dia(s) (mesmo critério de sempre — não lista o catálogo
  // inteiro). Mas ao virar linha, TODAS as unidades que têm o item no
  // catálogo entram no perUnit com o estoque real, mesmo as que não tinham
  // mínimo pro dia selecionado.
  const todasAsKeys = new Set();
  UNIT_NAMES.forEach(u => Object.keys(porUnidade[u]).forEach(k => todasAsKeys.add(k)));

  todasAsKeys.forEach(itemKey => {
    const algumaUnidadePrecisa = UNIT_NAMES.some(u => porUnidade[u][itemKey] && porUnidade[u][itemKey].minDia > 0);
    if (!algumaUnidadePrecisa) return; // nenhuma unidade tem mínimo pra esse item nesse(s) dia(s) — não é relevante

    UNIT_NAMES.forEach(unitName => {
      const dados = porUnidade[unitName][itemKey];
      if (!dados) return; // essa unidade nem tem esse item no catálogo — fica "-" mesmo (correto)
      const { name, estSoma, item, aEnviar, contado, minDia } = dados;
      if (aEnviar > 0) relevantPairs.add(unitName + '|' + item.category);

      if (!itemMap.has(item.key)) {
        const cpdItem = catalog.find(c => c.key === item.key);
        itemMap.set(item.key, {
          name, key: item.key, unit: item.unit, category: categoriaCanonica(item.key, item.category),
          estCPD: cpdItem ? (cpd[cpdItem.id] || 0) : 0,
          perUnit: {}
        });
      }
      // Sempre registrar: estoque, aEnviar (pode ser 0 se unidade já tem suficiente
      // ou se ainda não contado) e a flag "contado" para diferenciar os dois casos.
      // minDia também vai junto — precisa pra "pendente" (linha 8348-ish) não
      // acusar falta de contagem numa unidade que nem tem mínimo pra esse
      // item nesse dia (não contar não muda o total de qualquer forma).
      itemMap.get(item.key).perUnit[unitName] = { est: estSoma, aEnviar, contado, minDia };
    });
  });

  // ── Aviso de itens ainda não contados nesta janela ──────────────────────────
  // Esses itens não entram no cálculo de A Enviar (não sabemos se é zero de
  // verdade) — aparecem como "NC" em cada célula da tabela. O aviso fica só
  // com a contagem e um botão "Ver lista" (abre modal agrupado por unidade) —
  // listar tudo direto no banner virava uma parede de texto ilegível quando
  // havia muitos itens pendentes.
  const naoContadosDia = [];
  itemMap.forEach(row => {
    UNIT_NAMES.forEach(u => {
      const pu = row.perUnit[u];
      // 28/07: só entra no aviso se a unidade tiver mínimo relevante pra
      // esse dia — não contar um item que a unidade nem precisa enviar
      // hoje não é motivo de alerta.
      if (pu && pu.contado === false && pu.minDia > 0) naoContadosDia.push({ unit: u, name: row.name });
    });
  });
  if (naoContadosDia.length > 0) {
    const ncBanner = el('div', {cls:'alert-banner warn', style:'margin-bottom:14px;align-items:center'});
    const ncIcon = el('span', {cls:'alert-banner-icon'}, '❓');
    const ncBody = el('div', {cls:'alert-banner-body', style:'display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%'});
    const ncText = el('div', {});
    ncText.appendChild(el('div', {cls:'alert-banner-title'}, naoContadosDia.length + ' item(ns) ainda não contado(s) nesta janela'));
    ncText.appendChild(el('div', {cls:'alert-banner-items'}, 'Não entram no cálculo de A Enviar até a unidade confirmar a contagem.'));
    ncBody.appendChild(ncText);
    const ncBtn = el('button', {cls:'btn btn-outline btn-sm', style:'flex-shrink:0'}, 'Ver lista');
    ncBtn.addEventListener('click', () => openNaoContadosModal(naoContadosDia));
    ncBody.appendChild(ncBtn);
    ncBanner.appendChild(ncIcon);
    ncBanner.appendChild(ncBody);
    // 28/07: acima de toda a estrutura da tabela (cabeçalho, botões de PDF,
    // seletor de dias) a pedido do Eduardo — mesmo tratamento dado ao aviso
    // de contagem em aberto/desatualizada.
    frag.insertBefore(ncBanner, frag.firstChild);
  }

  // ── Aviso de contagem desatualizada usada neste cálculo ────────────────────
  // 28/07: a versão anterior listava unidade+categoria+"há quantos dias" pra
  // cada par desatualizado — virava uma parede de texto somada ao banner
  // global "Contagem em aberto" já visível no topo da tela. A pedido do
  // Eduardo, isso vira UM aviso só, curto, sem lista detalhada — colocado
  // acima de toda a estrutura da tabela (antes do cabeçalho "Envios do
  // Dia"). O banner global (renderOpenCountBanner) fica escondido nesta
  // tela pra não duplicar a mesma informação.
  const staleEntries = [];
  relevantPairs.forEach(pair => {
    const [unitName, cat] = pair.split('|');
    const st = getCategoryStaleness(unitName, cat);
    if (st) {
      staleEntries.push(unitName + ' \u2014 ' + cat + (st.never
        ? ' (nunca confirmada)'
        : ' (' + st.days + (st.days === 1 ? ' dia' : ' dias') + ' atr\u00E1s)'));
    }
  });
  if (staleEntries.length > 0) {
    const staleBanner = el('div', {cls:'alert-banner warn', style:'margin-bottom:14px'});
    const icon = el('span', {cls:'alert-banner-icon'}, '\u26A0\uFE0F');
    const body = el('div', {cls:'alert-banner-body'});
    body.appendChild(el('div', {cls:'alert-banner-title'}, 'Contagem em aberto \u2014 c\u00E1lculo desatualizado'));
    body.appendChild(el('div', {cls:'alert-banner-items'},
      'Uma ou mais unidades ainda n\u00E3o confirmaram a contagem de hoje. O valor de A Enviar usa o \u00FAltimo estoque registrado, n\u00E3o uma contagem atual.'));
    staleBanner.appendChild(icon);
    staleBanner.appendChild(body);
    frag.insertBefore(staleBanner, frag.firstChild);
  }

  // Enriquecer com totais e situação
  const rows = [];
  itemMap.forEach(row => {
    const totalAEnviar = UNIT_NAMES.reduce((s, u) => s + (row.perUnit[u] ? row.perUnit[u].aEnviar : 0), 0);
    const falta   = Math.max(0, totalAEnviar - row.estCPD);
    // Se alguma unidade ainda não contou este item, totalAEnviar pode estar
    // subestimado (a contribuição dela entrou como 0). Marcamos "pendente"
    // pra não deixar a badge "✓ OK" passar confiança que os dados não têm —
    // ver o resumo no topo, mas cada linha também precisa avisar sozinha,
    // já que a pessoa pode filtrar/rolar e não ver o resumo.
    // 28/07: só marca "pendente" se a unidade que não contou TAMBÉM tem
    // mínimo relevante pra esse dia (minDia > 0) — uma unidade sem mínimo
    // pro dia selecionado nunca entra no total de qualquer forma, então não
    // contar não deixa o total mais incerto.
    const pendente = UNIT_NAMES.some(u => row.perUnit[u] && row.perUnit[u].contado === false && row.perUnit[u].minDia > 0);
    row.totalAEnviar = totalAEnviar;
    row.falta    = falta;
    row.pendente = pendente;
    row.situacao = falta > 0 ? 'falta' : 'ok';
    rows.push(row);
  });

  // Ordenar pela posição exata no catálogo das unidades (ordem de produção)
  // A CATEGORIA usada aqui é sempre a do catálogo da Asa Sul (categoriaCanonica)
  // — formato de referência para as telas agregadas do CPD, corrigido em 27/07
  // a pedido do Eduardo (uma correção anterior usava o catálogo do CPD como
  // referência, o que não é o formato correto para estas telas). A posição
  // (pos, só usada pra ordenar dentro da categoria) usa a primeira unidade
  // encontrada — isso é só estética, não afeta o agrupamento.
  const _getUnitCatalogPos = (itemKey) => {
    const cat = categoriaCanonica(itemKey, '');
    for (const u of UNIT_NAMES) {
      const uc = getUnitCatalog(u).catalog;
      const idx = uc.findIndex(c => c.key === itemKey);
      if (idx > -1) return { cat: cat || uc[idx].category, pos: idx };
    }
    return { cat, pos: 99999 };
  };
  rows.forEach(r => {
    const pos = _getUnitCatalogPos(r.key);
    r._catOrder = pos.cat;
    r._pos = pos.pos;
  });
  rows.sort((a, b) => {
    // Primeiro ordenar por categoria, pela ordem do catálogo da Asa Sul
    const catA = a._catOrder, catB = b._catOrder;
    if (catA !== catB) {
      const _refCatsRow = getUnitCatalog('Asa Sul').categories;
      const ia = _refCatsRow.indexOf(catA);
      const ib = _refCatsRow.indexOf(catB);
      if (ia > -1 && ib > -1) return ia - ib;
      if (ia > -1) return -1;
      if (ib > -1) return 1;
    }
    // Dentro da mesma categoria, pela posição no catálogo
    return a._pos - b._pos;
  });

  // ── Sumário ────────────────────────────────────────────────────────────────
  const totalItems  = rows.length;
  const totalFaltas = rows.filter(r => r.situacao === 'falta').length;
  const totalOk     = rows.filter(r => r.situacao === 'ok').length;

  const summaryRow = el('div', {cls:'envios-summary-row'});
  [['Total a enviar', totalItems, ''],
   ['CPD tem estoque', totalOk, 'ok'],
   ['Faltam no CPD',  totalFaltas, 'falta']].forEach(([lbl, val, cls]) => {
    const card = el('div', {cls:'envios-summary-card' + (cls ? ' ' + cls : '')});
    card.appendChild(el('div', {cls:'e-lbl'}, lbl));
    card.appendChild(el('div', {cls:'e-val'}, String(val)));
    summaryRow.appendChild(card);
  });
  frag.appendChild(summaryRow);

  if (rows.length === 0) {
    const empty = el('div', {cls:'table-wrap', style:'padding:32px;text-align:center;color:var(--success);font-weight:600'});
    empty.textContent = '\u2705 Nenhum item a enviar para ' + diasSelFullTexto + '. Todas as unidades t\u00EAm estoque suficiente.';
    frag.appendChild(empty);
    return frag;
  }

  // ── Filtros ────────────────────────────────────────────────────────────────
  let activeFilter = 'todos';
  let searchQuery = '';
  const searchWrap = el('div', {cls:'search-wrap', style:'margin-bottom:12px'});
  const searchIcon = el('span', {cls:'search-icon', html:'<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'});
  const searchInp  = el('input', {type:'text', placeholder:'Buscar item...', id:'envios-search'});
  searchWrap.appendChild(searchIcon);
  searchWrap.appendChild(searchInp);
  const filterTabs = el('div', {cls:'envios-filter-tabs'});
  const tableWrap  = el('div', {});
  frag.appendChild(searchWrap);
  frag.appendChild(filterTabs);
  frag.appendChild(tableWrap);

  // Guarda a lista atualmente filtrada/buscada (mesma que está na tela) para
  // que o PDF "Tabela de Envios" imprima exatamente o que está sendo exibido.
  let currentFilteredRows = rows;

  function buildMatrix() {
    tableWrap.innerHTML = '';
    tableWrap.classList.toggle('envios-searching', !!searchQuery);
    let filtered = activeFilter === 'todos' ? rows :
                     rows.filter(r => r.situacao === activeFilter);
    if (searchQuery) {
      const q = _norm(searchQuery);
      filtered = filtered.filter(r => _norm(r.name).includes(q));
    }
    currentFilteredRows = filtered;

    if (filtered.length === 0) {
      const empty = el('div', {style:'padding:24px;text-align:center;color:var(--success);font-weight:600;font-size:13px'});
      empty.textContent = searchQuery
        ? '\u2705 Nenhum item encontrado para "' + searchQuery + '".'
        : '\u2705 Nenhum item neste filtro.';
      tableWrap.appendChild(empty);
      return;
    }

    const wrap  = el('div', {cls:'envios-wrap'});
    const table = el('table', {cls:'envios-matrix'});

    // ── Thead linha 1: ITEM | EST CPD | ASA SUL(2) | SIG(2) | VP(2) | DLV(2) | SITUAÇÃO
    const thead = el('thead');
    const tr1   = el('tr');
    const thItem = el('th', {}, 'Item');
    thItem.setAttribute('rowspan', '2');
    tr1.appendChild(thItem);
    const thCpd = el('th', {}, 'Est. CPD');
    thCpd.setAttribute('rowspan', '2');
    tr1.appendChild(thCpd);
    UNIT_NAMES.forEach(u => {
      const th = el('th', {cls:'unit-hdr'}, u);
      th.setAttribute('colspan', '2');
      tr1.appendChild(th);
    });
    const thSit = el('th', {cls:'u-sep'}, 'Situa\u00E7\u00E3o');
    thSit.setAttribute('rowspan', '2');
    tr1.appendChild(thSit);
    thead.appendChild(tr1);

    // ── Thead linha 2: Est. | A Env. × 4 unidades
    const tr2 = el('tr');
    UNIT_NAMES.forEach((u, i) => {
      const thEst = el('th', {cls: i === 0 ? 'sub-first' : 'sub-first'}, 'Est.');
      const thEnv = el('th', {}, 'A env.');
      tr2.appendChild(thEst);
      tr2.appendChild(thEnv);
    });
    thead.appendChild(tr2);
    table.appendChild(thead);

    // ── Tbody — agrupado por categoria
    const tbody = el('tbody');
    let lastCat = null;
    filtered.forEach(row => {
      // Inserir linha de categoria quando mudar
      const rowCat = row._catOrder || row.category;
      if (rowCat !== lastCat) {
        lastCat = rowCat;
        const catTr = el('tr');
        const catTd = el('td');
        catTd.setAttribute('colspan', String(2 + UNIT_NAMES.length * 2 + 1));
        catTd.style.cssText = 'background:#F5EDD8;color:var(--accent-dark,#1A5229);font-family:Lato,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:7px 10px;border-bottom:1px solid var(--border);border-top:1px solid var(--border)';
        catTd.textContent = rowCat;
        catTr.appendChild(catTd);
        tbody.appendChild(catTr);
      }
      const tr = el('tr');
      // Nome
      const tdName = el('td', {}, row.name);
      tr.appendChild(tdName);
      // Est. CPD
      const tdCpd = el('td');
      tdCpd.textContent = String(row.estCPD);
      if (row.estCPD < row.totalAEnviar) tdCpd.className = 'val-cpd-low';
      tr.appendChild(tdCpd);
      // Por unidade
      UNIT_NAMES.forEach(u => {
        const pu = row.perUnit[u];
        const tdEst = el('td', {cls:'u-sep'});
        const tdEnv = el('td');
        if (pu) {
          // Mostrar estoque sempre; A Enviar: valor se > 0, '—' se 0 (unidade já tem
          // suficiente), 'NC' se ainda não contado nesta janela (não sabemos se é zero
          // de verdade — não mostramos como se a unidade já tivesse o suficiente)
          tdEst.textContent = String(pu.est);
          // 28/07: só mostra "NC" se a unidade também tem mínimo relevante
          // pra esse dia — se ela não precisa enviar nada hoje de qualquer
          // forma (minDia 0), não contar não é motivo de alerta.
          if (pu.contado === false && pu.minDia > 0) {
            tdEnv.textContent = 'NC';
            tdEnv.className = 'val-dash';
            tdEnv.style.color = '#E8A020';
            tdEnv.title = 'Item ainda não contado nesta janela';
          } else if (pu.aEnviar > 0) {
            tdEnv.textContent = String(pu.aEnviar);
            tdEnv.className = 'val-env';
          } else {
            tdEnv.textContent = '\u2014';
            tdEnv.className = 'val-dash';
          }
        } else {
          // Unidade não tem este item no catálogo ou sem mínimo para o dia
          tdEst.textContent = '\u2014';
          tdEst.className = 'val-dash u-sep';
          tdEnv.textContent = '\u2014';
          tdEnv.className = 'val-dash';
        }
        tr.appendChild(tdEst);
        tr.appendChild(tdEnv);
      });
      // Situação
      const tdSit = el('td', {cls:'u-sep'});
      const badgeCls = row.pendente ? 'pendente' : row.situacao;
      const badge = el('span', {cls:'envios-badge ' + badgeCls});
      badge.textContent = row.pendente ? '❓ Pendente' : (row.situacao === 'ok' ? '\u2705 OK' : '\u26A0\uFE0F Falta ' + row.falta);
      if (row.pendente) badge.title = 'Alguma unidade ainda não contou este item — o cálculo pode estar incompleto.';
      tdSit.appendChild(badge);
      tr.appendChild(tdSit);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    tableWrap.appendChild(wrap);

    // ── Versão em cards (mesmos dados de `filtered`, um card por item) ──────
    const cardsWrap = el('div', {cls:'envios-cards'});
    let lastCatCard = null;
    filtered.forEach(row => {
      const rowCat = row._catOrder || row.category;
      if (rowCat !== lastCatCard) {
        lastCatCard = rowCat;
        cardsWrap.appendChild(el('div', {cls:'envios-card-cat-header'}, rowCat));
      }

      const isOpen = row.situacao === 'falta' || row.pendente;
      const card = el('div', {cls:'envios-card' + (row.situacao === 'falta' ? ' falta' : '') + (isOpen ? ' open' : '')});

      const summary = el('div', {cls:'envios-card-summary envios-card-header'});
      summary.appendChild(el('div', {cls:'envios-card-name'}, row.name));
      const rightWrap = el('div', {style:'display:flex;align-items:center;gap:10px'});
      rightWrap.appendChild(el('span', {style:'font-size:11px;color:var(--text-3)'}, 'CPD: ' + row.estCPD));
      const badgeCls = row.pendente ? 'pendente' : row.situacao;
      const badge = el('span', {cls:'envios-badge ' + badgeCls});
      badge.textContent = row.pendente ? '❓ Pendente' : (row.situacao === 'ok' ? '\u2705 OK' : '\u26A0\uFE0F Falta ' + row.falta);
      if (row.pendente) badge.title = 'Alguma unidade ainda não contou este item — o cálculo pode estar incompleto.';
      rightWrap.appendChild(badge);
      rightWrap.appendChild(el('span', {cls:'envios-card-chevron'}, '\u25BE'));
      summary.appendChild(rightWrap);
      summary.addEventListener('click', () => card.classList.toggle('open'));
      card.appendChild(summary);

      const detail = el('div', {cls:'envios-card-detail'});
      const cpdLine = el('div', {cls:'envios-card-cpd' + (row.estCPD < row.totalAEnviar ? ' low' : ''), style:'margin-top:2px'},
        'Est. CPD: ' + row.estCPD + ' \u00B7 Total a enviar: ' + row.totalAEnviar);
      detail.appendChild(cpdLine);

      const unitsWrap = el('div', {cls:'envios-card-units', style:'margin-top:8px'});
      UNIT_NAMES.forEach(u => {
        const pu = row.perUnit[u];
        const uRow = el('div', {cls:'envios-card-unit-row'});
        uRow.appendChild(el('span', {cls:'envios-card-unit-name'}, u));
        const vals = el('div', {cls:'envios-card-unit-vals'});
        if (pu) {
          vals.appendChild(el('span', {cls:'est'}, 'Est. ' + pu.est));
          if (pu.contado === false && pu.minDia > 0) {
            const ncSpan = el('span', {cls:'env dash', style:'color:#E8A020', title:'Item ainda n\u00e3o contado nesta janela'}, 'NC');
            vals.appendChild(ncSpan);
          } else {
            vals.appendChild(el('span', {cls:'env' + (pu.aEnviar > 0 ? '' : ' dash')},
              pu.aEnviar > 0 ? String(pu.aEnviar) : '\u2014'));
          }
        } else {
          vals.appendChild(el('span', {cls:'est'}, '\u2014'));
          vals.appendChild(el('span', {cls:'env dash'}, '\u2014'));
        }
        uRow.appendChild(vals);
        unitsWrap.appendChild(uRow);
      });
      detail.appendChild(unitsWrap);
      card.appendChild(detail);
      cardsWrap.appendChild(card);
    });
    tableWrap.appendChild(cardsWrap);
  }

  // Montar botões de filtro
  [['todos', 'Todos (' + totalItems + ')'],
   ['falta', '\u26A0\uFE0F Falta no CPD (' + totalFaltas + ')'],
   ['ok',    '\u2705 CPD tem estoque (' + totalOk + ')']].forEach(([key, lbl]) => {
    const btn = el('button', {cls:'envios-filter-tab' + (key === activeFilter ? ' active' : '')});
    btn.textContent = lbl;
    btn.addEventListener('click', () => {
      activeFilter = key;
      filterTabs.querySelectorAll('.envios-filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildMatrix();
    });
    filterTabs.appendChild(btn);
  });

  buildMatrix();
  searchInp.addEventListener('input', () => {
    searchQuery = searchInp.value;
    buildMatrix();
  });
  return frag;
}

// ═══ CONTROLE DE VALIDADES ════════════════════════════════════════════════════
function viewValidadeControl() {
  const frag = document.createDocumentFragment();
  const isCP = isCPD();

  // Unidade ativa: CPD usa selector, unidades usam a própria
  let activeValidUnit = isCP ? UNIT_NAMES[0] : (session ? session.unit : UNIT_NAMES[0]);

  // ── Header ────────────────────────────────────────────────────────────────
  const hdrWrap = el('div', {style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px'});
  hdrWrap.appendChild(el('h2', {cls:'table-title'}, 'Controle de Validades'));
  const regBtn = el('button', {cls:'btn btn-sm valid-register-btn', style:'background:var(--accent,#1A5229);color:#fff;margin-left:auto'});
  regBtn.textContent = '+ Registrar Lote';
  hdrWrap.appendChild(regBtn);
  frag.appendChild(hdrWrap);

  // ── Tabs (CPD vê todas as unidades) ───────────────────────────────────────
  const tabsEl = el('div', {cls:'valid-unit-tabs', style: isCP ? '' : 'display:none'});
  const bodyEl = el('div', {});
  frag.appendChild(tabsEl);
  frag.appendChild(bodyEl);

  if (isCP) {
    UNIT_NAMES.forEach(u => {
      const tab = el('button', {cls:'valid-unit-tab' + (u === activeValidUnit ? ' active' : '')});
      tab.textContent = u;
      tab.addEventListener('click', () => {
        activeValidUnit = u;
        tabsEl.querySelectorAll('.valid-unit-tab').forEach(b => b.classList.toggle('active', b.textContent === u));
        renderValidBody();
      });
      tabsEl.appendChild(tab);
    });
  }

  // ── Modal Registrar Lote ──────────────────────────────────────────────────
  regBtn.addEventListener('click', () => {
    const unitForReg = activeValidUnit;
    const ucat = getUnitCatalog(unitForReg).catalog;

    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    const overlay = el('div', {cls:'modal-overlay'});
    const box = el('div', {cls:'modal-box', style:'max-width:420px'});

    const hdr = el('div', {cls:'modal-header'});
    hdr.appendChild(el('div', {cls:'modal-title'}, '+ Registrar Lote — ' + unitForReg));
    const closeX = el('button', {cls:'modal-close'}, '\u00D7');
    closeX.addEventListener('click', () => overlay.remove());
    hdr.appendChild(closeX);
    box.appendChild(hdr);

    const body2 = el('div', {cls:'modal-body', style:'padding:16px 18px;display:flex;flex-direction:column;gap:12px'});

    // Item (autocomplete)
    const itemLabel = el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2)'}, 'Item');
    const itemWrap  = el('div', {style:'position:relative'});
    const itemInp   = el('input', {type:'text', cls:'confirm-name-input', placeholder:'Buscar item...'});
    const itemDrop  = el('div', {style:'position:absolute;top:100%;left:0;right:0;z-index:100;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);max-height:180px;overflow-y:auto;display:none;box-shadow:0 4px 16px rgba(0,0,0,.15)'});
    let selectedItem = null;

    itemInp.addEventListener('input', () => {
      const q = itemInp.value.toLowerCase();
      itemDrop.innerHTML = '';
      if (q.length < 1) { itemDrop.style.display = 'none'; return; }
      const matches = ucat.filter(i => i.name.toLowerCase().includes(q)).slice(0, 20);
      if (!matches.length) { itemDrop.style.display = 'none'; return; }
      matches.forEach(i => {
        const opt = el('div', {style:'padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)'}, i.name);
        opt.addEventListener('mousedown', () => {
          selectedItem = i;
          itemInp.value = i.name;
          unitInp.value = i.unit;
          itemDrop.style.display = 'none';
        });
        opt.addEventListener('mouseover', () => opt.style.background = 'var(--surface-2)');
        opt.addEventListener('mouseout', () => opt.style.background = '');
        itemDrop.appendChild(opt);
      });
      itemDrop.style.display = 'block';
    });
    itemInp.addEventListener('blur', () => setTimeout(() => { itemDrop.style.display = 'none'; }, 150));
    itemWrap.appendChild(itemInp);
    itemWrap.appendChild(itemDrop);
    body2.appendChild(itemLabel);
    body2.appendChild(itemWrap);

    // Quantidade + Unidade
    const qtyRow = el('div', {style:'display:flex;gap:8px'});
    const qtyWrap = el('div', {style:'flex:1'});
    qtyWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Quantidade'));
    const qtyInp = el('input', {type:'number', cls:'confirm-name-input', placeholder:'0', min:'0.01', step:'0.01', style:'width:100%'});
    qtyWrap.appendChild(qtyInp);
    const unitWrap = el('div', {style:'flex:1'});
    unitWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Unidade'));
    const unitInp = el('input', {type:'text', cls:'confirm-name-input', placeholder:'Un', style:'width:100%'});
    unitWrap.appendChild(unitInp);
    qtyRow.appendChild(qtyWrap);
    qtyRow.appendChild(unitWrap);
    body2.appendChild(qtyRow);

    // Data de validade (sem retroativo)
    const dateWrap = el('div');
    dateWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Data de Validade'));
    const dateInp = el('input', {type:'date', cls:'confirm-name-input', style:'width:100%'});
    const today = new Date().toISOString().slice(0,10);
    dateInp.min = today; // trava: não permite data retroativa
    dateWrap.appendChild(dateInp);
    body2.appendChild(dateWrap);

    box.appendChild(body2);

    const errEl = el('div', {style:'padding:0 18px 8px;font-size:12px;color:var(--danger,#A03A3A);display:none'});
    box.appendChild(errEl);

    const ftr = el('div', {cls:'modal-footer'});
    const cancelBtn2 = el('button', {cls:'btn btn-outline btn-sm'}, 'Cancelar');
    cancelBtn2.addEventListener('click', () => overlay.remove());
    const saveBtn2 = el('button', {cls:'btn btn-sm', style:'background:var(--accent,#1A5229);color:#fff'}, 'Salvar Lote');
    saveBtn2.addEventListener('click', () => {
      errEl.style.display = 'none';
      if (!selectedItem) { errEl.textContent = 'Selecione um item do catálogo.'; errEl.style.display = 'block'; return; }
      const qty = parseFloat(qtyInp.value);
      if (!qty || qty <= 0) { errEl.textContent = 'Informe uma quantidade válida.'; errEl.style.display = 'block'; return; }
      if (!dateInp.value) { errEl.textContent = 'Informe a data de validade.'; errEl.style.display = 'block'; return; }
      const slug2 = unitSlug(unitForReg);
      const ts = Date.now();
      const lote = {
        item_id: selectedItem.id,
        item_name: selectedItem.name,
        quantidade: qty,
        unidade_medida: unitInp.value || selectedItem.unit,
        data_validade: dateInp.value,
        data_cadastro: today,
        status_alerta: 'pendente'
      };
      db.ref('dados/validity_control/' + slug2 + '/' + ts).set(lote)
        .then(() => {
          overlay.remove();
          toast('\u2705 Lote registrado!');
          renderValidBody();
        })
        .catch(e => { errEl.textContent = 'Erro: ' + e.message; errEl.style.display = 'block'; });
    });
    ftr.appendChild(cancelBtn2);
    ftr.appendChild(saveBtn2);
    box.appendChild(ftr);
    overlay.appendChild(box);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    setTimeout(() => itemInp.focus(), 100);
  });

  // ── Renderizar lotes ───────────────────────────────────────────────────────
  function renderValidBody() {
    bodyEl.innerHTML = '';
    const slug3 = unitSlug(activeValidUnit);
    bodyEl.appendChild(el('div', {cls:'valid-empty'}, '\u23F3 Carregando...'));

    db.ref('dados/validity_control/' + slug3).once('value').then(snap => {
      bodyEl.innerHTML = '';
      const val    = snap.val() || {};
      const lotes  = Object.entries(val).map(([id, d]) => ({ _id: id, ...d }));
      const today2 = new Date(); today2.setHours(0,0,0,0);

      lotes.forEach(l => {
        const dt = new Date(l.data_validade + 'T00:00:00');
        l._diffDays = Math.round((dt - today2) / 86400000);
        l._status   = l._diffDays <= 0 ? 'expired' : l._diffDays <= 7 ? 'alert' : 'ok';
      });

      const _norm2 = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
      const lotesByItem = {};
      lotes.forEach(l => {
        const k = _norm2(l.item_name);
        if (!lotesByItem[k]) lotesByItem[k] = [];
        lotesByItem[k].push(l);
      });

      const ucat  = getUnitCatalog(activeValidUnit).catalog;
      const ucats = getUnitCatalog(activeValidUnit).categories;

      // Resumo de alertas
      const nExp   = lotes.filter(l => l._status === 'expired').length;
      const nAlert = lotes.filter(l => l._status === 'alert').length;
      if (nExp > 0 || nAlert > 0) {
        const resumo = el('div', {style:'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px'});
        if (nExp > 0) {
          const c = el('div', {style:'padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(160,58,58,.1);border:1.5px solid rgba(160,58,58,.3);color:#A03A3A'});
          c.textContent = '\uD83D\uDD34 ' + nExp + ' vencido' + (nExp > 1 ? 's' : '');
          resumo.appendChild(c);
        }
        if (nAlert > 0) {
          const c = el('div', {style:'padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(214,158,46,.1);border:1.5px solid rgba(214,158,46,.3);color:#C07A00'});
          c.textContent = '\uD83D\uDFE1 ' + nAlert + ' alerta' + (nAlert > 1 ? 's' : '');
          resumo.appendChild(c);
        }
        bodyEl.appendChild(resumo);
      }

      // Tabela com TODOS os itens do catálogo
      const tableWrap = el('div', {cls:'table-wrap', style:'padding:0'});
      const table = el('table', {cls:'valid-table', style:'table-layout:fixed'});

      // Larguras das colunas
      const colgroup = document.createElement('colgroup');
      [null, '60px', null, '36px'].forEach((w, i) => {
        const col = document.createElement('col');
        if (w) col.style.width = w;
        colgroup.appendChild(col);
      });
      table.appendChild(colgroup);

      const thead = el('thead');
      const thrHead = el('tr');
      [['Item','left'],['UN','left'],['Lotes cadastrados','right'],['+','center']].forEach(([h, align]) => {
        const th = el('th', {style:'text-align:'+align});
        th.textContent = h;
        thrHead.appendChild(th);
      });
      thead.appendChild(thrHead);
      table.appendChild(thead);

      const tbody = el('tbody');

      // Estado de abertura por categoria — categorias com vencido/alerta já abrem
      // automaticamente (urgência primeiro), as demais começam fechadas
      const openCatsValid = {};

      function toggleValidCat(cat, catTr) {
        openCatsValid[cat] = !openCatsValid[cat];
        const chevron = catTr.querySelector('.vcat-chevron');
        if (chevron) chevron.style.transform = openCatsValid[cat] ? 'rotate(180deg)' : '';
        tbody.querySelectorAll('tr[data-vcat="' + CSS.escape(cat) + '"]').forEach(tr => {
          tr.style.display = openCatsValid[cat] ? '' : 'none';
        });
      }

      ucats.forEach(cat => {
        const catItems = ucat.filter(i => i.category === cat);
        if (!catItems.length) return;

        // Contar alertas nesta categoria
        const catLotesAll = catItems.flatMap(i => lotesByItem[_norm2(i.name)] || []);
        const nExpCat   = catLotesAll.filter(l => l._status === 'expired').length;
        const nAlertCat = catLotesAll.filter(l => l._status === 'alert').length;
        const nLotesCat = catLotesAll.length;
        if (nExpCat > 0 || nAlertCat > 0) openCatsValid[cat] = true;

        const catTr = el('tr', {cls:'valid-cat-row', style:'cursor:pointer;user-select:none'});
        const catTd = el('td');
        catTd.setAttribute('colspan', '4');
        catTd.style.cssText = 'padding:7px 10px';

        const catLeft = el('span', {style:'display:inline-flex;align-items:center;gap:8px'});
        const chevron = el('span', {cls:'vcat-chevron', style:'font-size:10px;transition:transform .2s;display:inline-block' + (openCatsValid[cat] ? ';transform:rotate(180deg)' : '')}, '▼');
        catLeft.appendChild(chevron);
        catLeft.appendChild(el('span', {}, cat));

        // Badges de alerta inline no cabeçalho
        const catRight = el('span', {style:'display:inline-flex;align-items:center;gap:6px;float:right'});
        if (nExpCat > 0) {
          const b = el('span', {style:'font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:rgba(160,58,58,.18);color:#A03A3A'});
          b.textContent = nExpCat + ' vencido' + (nExpCat > 1 ? 's' : '');
          catRight.appendChild(b);
        } else if (nAlertCat > 0) {
          const b = el('span', {style:'font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:rgba(214,158,46,.18);color:#C07A00'});
          b.textContent = nAlertCat + ' alerta' + (nAlertCat > 1 ? 's' : '');
          catRight.appendChild(b);
        }
        const countBadge = el('span', {style:'font-size:10px;color:var(--text-3)'});
        countBadge.textContent = catItems.length + ' itens' + (nLotesCat > 0 ? ' · ' + nLotesCat + ' lote' + (nLotesCat > 1 ? 's' : '') : '');
        catRight.appendChild(countBadge);

        catTd.appendChild(catLeft);
        catTd.appendChild(catRight);
        catTr.appendChild(catTd);
        catTr.addEventListener('click', () => toggleValidCat(cat, catTr));
        tbody.appendChild(catTr);

        const _sevRank = { expired: 0, alert: 1, '': 2 };
        const catItemsWithLotes = catItems.map(item => {
          const itemLotes = (lotesByItem[_norm2(item.name)] || [])
            .slice().sort((a,b) => a.data_validade.localeCompare(b.data_validade));
          const worstStatus = itemLotes.some(l => l._status === 'expired') ? 'expired'
            : itemLotes.some(l => l._status === 'alert') ? 'alert' : '';
          return { item, itemLotes, worstStatus };
        }).sort((a, b) => _sevRank[a.worstStatus] - _sevRank[b.worstStatus]);

        catItemsWithLotes.forEach(({ item, itemLotes, worstStatus }) => {
          const rowBg = worstStatus === 'expired' ? 'var(--danger-bg)' : worstStatus === 'alert' ? 'var(--warning-bg)' : '';
          const tr = el('tr', {style: rowBg ? `background:${rowBg}` : ''});
          tr.setAttribute('data-vcat', cat);
          tr.style.display = openCatsValid[cat] ? '' : 'none';

          // Nome
          const tdName = el('td', {style:'padding-top:10px;padding-bottom:10px'});
          const nameSpan = el('span', {
            style: worstStatus === 'expired' ? 'color:#A03A3A;font-weight:600'
                 : worstStatus === 'alert'   ? 'color:#C07A00;font-weight:600' : ''
          }, item.name);
          tdName.appendChild(nameSpan);
          tr.appendChild(tdName);

          // Unidade
          tr.appendChild(el('td', {style:'color:var(--text-3);font-size:12px'}, item.unit));

          // Lotes inline
          const tdLotes = el('td', {cls:'right'});
          if (!itemLotes.length) {
            tdLotes.appendChild(el('span', {style:'color:var(--text-3);font-size:12px'}, '\u2014'));
          } else {
            const lotesWrap = el('div', {style:'display:flex;flex-direction:column;gap:4px;align-items:flex-end'});
            itemLotes.forEach(l => {
              const loteRow = el('div', {style:'display:flex;align-items:center;gap:6px'});
              const dot = el('span', {cls:'valid-dot ' + l._status});
              const dateStr = new Date(l.data_validade + 'T00:00:00').toLocaleDateString('pt-BR');
              const daysStr = l._diffDays <= 0 ? 'Vencido' : l._diffDays === 1 ? '1 dia' : l._diffDays + 'd';
              const info = el('span', {cls:'valid-date-text ' + l._status, style:'font-size:12px;white-space:nowrap'});
              info.textContent = String(l.quantidade) + ' ' + l.unidade_medida + ' \u00B7 ' + dateStr + ' (' + daysStr + ')';
              const cBtn = el('button', {cls:'valid-lote-consume', style:'width:22px;height:22px;font-size:11px', title:'Marcar consumido'}, '\u2714');
              cBtn.addEventListener('click', e => {
                e.stopPropagation();
                if (!confirm('Remover lote de "' + item.name + '"?')) return;
                db.ref('dados/validity_control/' + slug3 + '/' + l._id).remove()
                  .then(() => { toast('\u2705 Lote removido'); renderValidBody(); })
                  .catch(err => toast('Erro: ' + err.message));
              });
              loteRow.append(dot, info, cBtn);
              lotesWrap.appendChild(loteRow);
            });
            tdLotes.appendChild(lotesWrap);
          }
          tr.appendChild(tdLotes);

          // Botão +
          const tdAdd = el('td', {style:'text-align:center;width:36px;padding:4px 6px'});
          const addBtn = el('button', {cls:'valid-lote-consume', style:'font-size:16px;font-weight:700', title:'Adicionar lote'}, '+');
          addBtn.addEventListener('click', e => {
            e.stopPropagation();
            openAddLoteModal(item, slug3, renderValidBody);
          });
          tdAdd.appendChild(addBtn);
          tr.appendChild(tdAdd);
          tbody.appendChild(tr);
        });
      });

      table.appendChild(tbody);
      tableWrap.appendChild(table);
      bodyEl.appendChild(tableWrap);

    }).catch(e => {
      bodyEl.innerHTML = '';
      bodyEl.appendChild(el('div', {cls:'valid-empty'}, '\u274C Erro: ' + e.message));
    });
  }

  function openAddLoteModal(item, slug3, onSave) {
    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    const today = new Date().toISOString().slice(0,10);
    const overlay = el('div', {cls:'modal-overlay'});
    const box = el('div', {cls:'modal-box', style:'max-width:360px'});
    const hdr = el('div', {cls:'modal-header'});
    hdr.appendChild(el('div', {cls:'modal-title'}, '+ Lote: ' + item.name));
    const closeX = el('button', {cls:'modal-close'}, '\u00D7');
    closeX.addEventListener('click', () => overlay.remove());
    hdr.appendChild(closeX);
    box.appendChild(hdr);
    const body2 = el('div', {cls:'modal-body', style:'padding:16px 18px;display:flex;flex-direction:column;gap:12px'});
    const qtyWrap = el('div');
    qtyWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Quantidade (' + item.unit + ')'));
    const qtyInp = el('input', {type:'number', cls:'confirm-name-input', placeholder:'0', min:'0.01', step:'0.01', style:'width:100%'});
    qtyWrap.appendChild(qtyInp);
    body2.appendChild(qtyWrap);
    const dateWrap = el('div');
    dateWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Data de Validade'));
    const dateInp = el('input', {type:'date', cls:'confirm-name-input', style:'width:100%'});
    dateInp.min = today;
    dateWrap.appendChild(dateInp);
    body2.appendChild(dateWrap);
    box.appendChild(body2);
    const errEl = el('div', {style:'padding:0 18px 8px;font-size:12px;color:var(--danger,#A03A3A);display:none'});
    box.appendChild(errEl);
    const ftr = el('div', {cls:'modal-footer'});
    const cancelBtn2 = el('button', {cls:'btn btn-outline btn-sm'}, 'Cancelar');
    cancelBtn2.addEventListener('click', () => overlay.remove());
    const saveBtn2 = el('button', {cls:'btn btn-sm', style:'background:var(--accent,#1A5229);color:#fff'}, 'Salvar');
    saveBtn2.addEventListener('click', () => {
      errEl.style.display = 'none';
      const qty = parseFloat(qtyInp.value);
      if (!qty || qty <= 0) { errEl.textContent = 'Quantidade inválida.'; errEl.style.display = 'block'; return; }
      if (!dateInp.value) { errEl.textContent = 'Informe a data de validade.'; errEl.style.display = 'block'; return; }
      const lote = { item_id: item.id, item_name: item.name, quantidade: qty,
        unidade_medida: item.unit, data_validade: dateInp.value, data_cadastro: today, status_alerta: 'pendente' };
      db.ref('dados/validity_control/' + slug3 + '/' + Date.now()).set(lote)
        .then(() => { overlay.remove(); toast('\u2705 Lote registrado!'); onSave(); })
        .catch(e => { errEl.textContent = 'Erro: ' + e.message; errEl.style.display = 'block'; });
    });
    qtyInp.addEventListener('keydown', e => { if (e.key === 'Enter') dateInp.focus(); });
    dateInp.addEventListener('keydown', e => { if (e.key === 'Enter') saveBtn2.click(); });
    ftr.appendChild(cancelBtn2); ftr.appendChild(saveBtn2);
    box.appendChild(ftr);
    overlay.appendChild(box);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    setTimeout(() => qtyInp.focus(), 100);
  }
  renderValidBody();
  return frag;
}

// ═══ QUADRO DE PRODUÇÃO ════════════════════════════════════════════════════════
const QP_DIAS  = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const QP_AREAS = ['Madalena','Larissa','Maria Laura','Masseiro'];

function viewQuadroProducao() {
  const frag = document.createDocumentFragment();

  // ── Header ────────────────────────────────────────────────────────────────
  const hdrWrap = el('div', {style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px'});
  hdrWrap.appendChild(el('h2', {cls:'table-title'}, 'Quadro de Produção'));
  const pdfBtn = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:12px;margin-left:auto'});
  pdfBtn.textContent = '🖨️ Ordem de Produção';
  pdfBtn.addEventListener('click', () => qpGerarPDF());
  hdrWrap.appendChild(pdfBtn);
  frag.appendChild(hdrWrap);

  // ── Tabs de dia da semana ─────────────────────────────────────────────────
  const todayDow = new Date().getDay(); // 0=Dom
  const todayIdx = (todayDow + 6) % 7; // 0=Seg
  let activeDay = qpGet('activeDay', todayIdx);

  const tabsEl = el('div', {cls:'qp-day-tabs'});
  const bodyEl = el('div', {});
  frag.appendChild(tabsEl);
  frag.appendChild(bodyEl);

  QP_DIAS.forEach((dia, dIdx) => {
    const tab = document.createElement('button');
    tab.className = 'qp-day-tab' + (dIdx === activeDay ? ' active' : '') + (dIdx === todayIdx ? ' today' : '');
    tab.textContent = dia;
    tab.addEventListener('click', () => {
      activeDay = dIdx;
      qpSet('activeDay', dIdx);
      tabsEl.querySelectorAll('.qp-day-tab').forEach((b, i) => {
        b.classList.toggle('active', i === dIdx);
        b.classList.toggle('today', i === todayIdx);
      });
      // Fechar todas as áreas ao trocar de dia
      Object.keys(openAreas).forEach(k => delete openAreas[k]);
      renderQPBody(dIdx);
    });
    tabsEl.appendChild(tab);
  });

  // ── Calcular necessidade de produção ──────────────────────────────────────
  // Para cada ficha técnica, calcula quantos lotes são necessários:
  // 1. Pega o total a enviar para todas as unidades no próximo dia de entrega
  //    que corresponda ao dia selecionado
  // 2. Subtrai o estoque atual do CPD
  // 3. Divide pelo rendimentoFichas (arredondando pra cima)
  // Se resultado <= 0 → item não precisa ser produzido
  function calcLotesSugeridos(ft, cobertura) {
    const _norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    // Buscar item no catálogo CPD pelo cpdId
    const cpdItem = (catalog || []).find(c => c.id === ft.cpdId);
    if (!cpdItem) return { lotes:0, aEnviarTotal:0, estCPD:0, pendente:false };
    const estCPD = cpd[cpdItem.id] || 0;
    // Somar A Enviar de todas as unidades
    let aEnviarTotal = 0;
    let pendente = false; // true se alguma unidade ainda não contou este item nesta janela
    const dayCode = qpDayCode(activeDay);
    if (!dayCode) return { lotes:0, aEnviarTotal:0, estCPD, pendente };
    UNIT_NAMES.forEach(unitName => {
      const ucat   = getUnitCatalog(unitName).catalog;
      const ustock = unitStock[unitName] || {};
      // Somar estoques de todos os IDs do mesmo item nessa unidade
      const matchItems = ucat.filter(i => i.key === cpdItem.key);
      const estUnit = matchItems.reduce((s,i) => s + (ustock[i.id] || 0), 0);
      // Se a unidade ainda não contou este item (estoque 0 sem confirmação),
      // não sabemos o valor real — não somamos ao total, só sinalizamos.
      const _repItem = matchItems[0];
      if (_repItem && !itemFoiContado(unitName, _repItem.id, estUnit)) {
        pendente = true;
        return;
      }
      const aEnv = calcAEnviar(unitName, cpdItem.key, estUnit, dayCode);
      aEnviarTotal += aEnv;
    });
    // Multiplicar pela cobertura (número de entregas a cobrir)
    const necessidade = aEnviarTotal * cobertura;
    const deficit = Math.max(0, necessidade - estCPD);
    const lotes = deficit > 0 ? Math.ceil(deficit / ft.rendFichas) : 0;
    return { lotes, aEnviarTotal, estCPD, pendente };
  }

  // Dia de entrega correspondente ao dia selecionado
  function qpDayCode(dayIdx) {
    // 0=Seg→SEG, 2=Qua→QUA, 4=Sex→SEX; outros dias pegam o próximo dia de entrega
    const MAP = {0:'SEG', 2:'QUA', 4:'SEX'};
    return MAP[dayIdx] || null;
  }

  // ── Verificar alertas de validade para insumos de uma ficha ───────────────
  function getValidadeAlerta(ft) {
    const _norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    const today = new Date(); today.setHours(0,0,0,0);
    const in7   = new Date(today); in7.setDate(in7.getDate() + 7);
    // Verificar se alguma unidade tem lote vencendo de algum insumo desta ficha
    // (simplificado: verificar no validity_control carregado em memória se disponível)
    return false; // placeholder — requer leitura async do Firebase
  }

  // ── Render do body ─────────────────────────────────────────────────────────
  // Estado de abertura por área — persiste entre re-renders do mesmo dia
  const openAreas = {};

  function renderQPBody(dayIdx) {
    bodyEl.innerHTML = '';

    const dayCode = qpDayCode(dayIdx);

    if (!dayCode) {
      const _ew = el('div', {style:'padding:10px 14px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:14px;display:flex;gap:10px;align-items:center'});
      const _etxt = el('div');
      _etxt.appendChild(el('div', {style:'font-size:13px;font-weight:600;color:var(--text-2)'}, 'Dia sem entrega às unidades'));
      _etxt.appendChild(el('div', {style:'font-size:11px;color:var(--text-3);margin-top:2px'}, 'Sem cálculo automático — defina as quantidades manualmente se houver produção avulsa.'));
      _ew.appendChild(_etxt);
      bodyEl.appendChild(_ew);
    }

    // Agrupar fichas por área e calcular necessidade
    const ftPorArea = {};
    QP_AREAS.forEach(a => { ftPorArea[a] = []; });
    let totalLotes = 0, totalLiberados = 0;

    FT_LIBRARY.forEach(ft => {
      const cobertura = parseInt(qpGet(`cob_${ft.id}`, ft.coberturaDefault)) || 1;
      const { lotes, aEnviarTotal, estCPD, pendente } = calcLotesSugeridos(ft, cobertura);
      // Quantidade SEMPRE zero — responsavel decide aceitar a sugestao
      const lotesManuais = qpGet(`qty_${dayIdx}_${ft.id}`, 0);
      const lotesEfetivos = lotesManuais;
      const liberado = qpGet(`lib_${dayIdx}_${ft.id}`, false);
      ftPorArea[ft.area].push({ ft, lotes, aEnviarTotal, estCPD, cobertura, lotesEfetivos, liberado, pendente });
      if (lotesEfetivos > 0) totalLotes++;
      if (liberado) totalLiberados++;
    });

    // Renderizar por área
    QP_AREAS.forEach(area => {
      const items = ftPorArea[area] || [];
      const comNecessidade = items.filter(i => i.lotes > 0);
      const liberadosArea  = items.filter(i => i.liberado && i.lotesEfetivos > 0).length;
      const totalArea      = items.filter(i => i.lotesEfetivos > 0).length;

      const areaWrap = el('div', {style:'margin-bottom:20px'});

      const areaHdr = el('div', {cls:'qp-area-hdr', style:'cursor:pointer;user-select:none'});
      const areaLeft = el('div', {cls:'qp-area-name'});
      const chevron = document.createElement('span');
      chevron.className = 'qp-chevron';
      chevron.style.cssText = 'font-size:10px;transition:transform .2s;display:inline-block;margin-right:6px';
      chevron.textContent = '▼';
      areaLeft.appendChild(chevron);
      const _areaLabel = document.createElement('span');
      _areaLabel.textContent = area;
      areaLeft.appendChild(_areaLabel);
      if (dayCode && comNecessidade.length > 0)
        areaLeft.appendChild(el('span', {cls:'qp-area-badge'}, comNecessidade.length + ' a produzir'));
      else if (dayCode)
        areaLeft.appendChild(el('span', {cls:'qp-area-badge',
          style:'background:rgba(42,145,72,.08);color:var(--text-3)'}, 'tudo OK'));
      areaHdr.appendChild(areaLeft);

      const areaRight = el('div', {style:'display:flex;gap:8px;align-items:center'});
      if (totalArea > 0) {
        areaRight.appendChild(el('span', {cls:'qp-footer-info'},
          liberadosArea + '/' + totalArea + ' liberados'));
        if (liberadosArea < totalArea) {
          const libAllBtn = el('button', {cls:'qp-liberar-all'}, '✓ Liberar tudo');
          libAllBtn.addEventListener('click', e => {
            e.stopPropagation();
            items.forEach(i => {
              if (i.lotesEfetivos > 0 && !i.liberado) qpSet('lib_' + dayIdx + '_' + i.ft.id, true);
            });
            qpSalvarHistorico(dayIdx);
            renderQPBody(dayIdx);
          });
          areaRight.appendChild(libAllBtn);
        }
      }
      areaHdr.appendChild(areaRight);
      areaWrap.appendChild(areaHdr);

      // Tabela de itens
      const tableWrap = el('div', {cls:'table-wrap', style:'padding:0;border-top:none;border-radius:0'});
      const table = el('table', {cls:'qp-table'});

      const thead = el('thead');
      const hrHead = el('tr');
      ['Item / Rendimento','Cobertura','Sugestão','Lotes','Insumos','Obs','Status'].forEach((h,i) => {
        const th = el('th', {cls: i >= 2 && i <= 4 ? 'center' : ''});
        th.textContent = h;
        hrHead.appendChild(th);
      });
      thead.appendChild(hrHead);
      table.appendChild(thead);

      const tbody = el('tbody');

      // Área Masseiro — layout especial
      if (area === 'Masseiro') {
        const massGrid = el('div', {cls:'qp-masseiro-grid'});

        // Card Previsão
        const cardPrev = el('div', {cls:'qp-masseiro-card'});
        cardPrev.appendChild(el('div', {cls:'qp-masseiro-title'}, '📋 Produção prevista'));

        items.forEach(({ft, lotes, lotesEfetivos}) => {
          const row = el('div', {cls:'qp-masseiro-row'});
          row.appendChild(el('span', {style:'color:var(--text-2)'}, ft.nome));
          const inp = el('input', {cls:'qp-masseiro-input', type:'number', min:'0'});
          inp.value = String(lotesEfetivos);
          inp.placeholder = String(lotes);
          inp.title = lotes > 0 ? `Sugestão: ${lotes} lotes` : 'Sem necessidade calculada';
          inp.setAttribute('data-ft-id', ft.id);
          inp.addEventListener('change', () => {
            const v = Math.max(0, parseInt(inp.value) || 0);
            qpSet('qty_' + dayIdx + '_' + ft.id, v);
            // Atualizar cálculo de farinha/fermento inline (sem re-render)
            if (ft.id === 'massa_pizza') {
              const cd = cardPrev.querySelector('.qp-masseiro-calc');
              if (cd) cd.innerHTML = 'Farinha total: <b>' + (v * 10) + 'kg</b> · Fermento: <b>' + (v * 40) + 'g</b>';
            }
          });
          row.appendChild(inp);
          cardPrev.appendChild(row);
        });

        // Cálculo farinha/fermento
        const massaFt = FT_BY_ID['massa_pizza'];
        const massaLotes = parseInt(qpGet(`qty_${dayIdx}_massa_pizza`, calcLotesSugeridos(massaFt, 1).lotes)) || 0;
        const farinhaTotal = massaLotes * 10;
        const fermentoTotal = massaLotes * 40;
        const calcDiv = el('div', {cls:'qp-masseiro-calc'});
        calcDiv.innerHTML = `Farinha total: <b>${farinhaTotal}kg</b> · Fermento: <b>${fermentoTotal}g</b>`;
        cardPrev.appendChild(calcDiv);
        massGrid.appendChild(cardPrev);

        // Card Produzido
        const cardProd = el('div', {cls:'qp-masseiro-card'});
        cardProd.appendChild(el('div', {cls:'qp-masseiro-title'}, '✅ Produzido (preencher ao final)'));
        ['Muçarela','Biga','Massa'].forEach(tipo => {
          const row = el('div', {cls:'qp-masseiro-row'});
          row.appendChild(el('span', {style:'color:var(--text-2)'}, tipo));
          const inp = el('input', {cls:'qp-masseiro-input', type:'number', min:'0',
            style:'border-color:var(--accent)'});
          inp.value = String(qpGet(`prod_${dayIdx}_${tipo}`, ''));
          inp.placeholder = '0';
          inp.addEventListener('change', () => {
            qpSet('prod_' + dayIdx + '_' + tipo, parseInt(inp.value) || 0);
            qpSalvarHistorico(dayIdx);
            // Sem re-render — só salva
          });
          row.appendChild(inp);
          cardProd.appendChild(row);
        });
        massGrid.appendChild(cardProd);
        massGrid.style.display = 'none';
        areaWrap.appendChild(massGrid);

        const massFooter = el('div', {cls:'qp-section-footer'});
        massFooter.style.display = 'none';
        massFooter.appendChild(el('span', {cls:'qp-footer-info'}, 'Ficha: 10kg farinha + 40g fermento por lote de Biga · 10kg farinha por lote de Massa'));
        areaWrap.appendChild(massFooter);

        areaHdr.addEventListener('click', e => {
          if (e.target.closest('button,input,select,textarea')) return;
          openAreas[area] = !openAreas[area];
          const chev = areaHdr.querySelector('.qp-chevron');
          if (chev) chev.style.transform = openAreas[area] ? 'rotate(180deg)' : '';
          massGrid.style.display   = openAreas[area] ? '' : 'none';
          massFooter.style.display = openAreas[area] ? '' : 'none';
        });

        bodyEl.appendChild(areaWrap);
        return;
      }

      items.forEach(({ ft, lotes, aEnviarTotal, estCPD, cobertura, lotesEfetivos, liberado, pendente }) => {
        const tr = el('tr', {cls: (lotes > 0 && dayCode) ? 'qp-precisa' : ''});

        // Nome + rendimento
        const tdNome = el('td');
        const nameSpan = el('div', {cls:'qp-item-name'});
        nameSpan.textContent = ft.nome;
        if (lotes === 0 && dayCode) {
          nameSpan.appendChild(el('span', {cls:'qp-sem-necessidade'}, '✓ Estoque OK'));
        }
        if (pendente && dayCode) {
          nameSpan.appendChild(el('span', {
            style:'display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:#B8740D;background:rgba(232,160,32,.12);padding:1px 6px;border-radius:8px',
            title:'Alguma unidade ainda não contou este item nesta janela — a sugestão abaixo pode estar subestimada.'
          }, '⚠ NÃO CONTADO EM ALGUMA UNIDADE'));
        }
        tdNome.appendChild(nameSpan);
        tdNome.appendChild(el('div', {cls:'qp-rendimento'}, ft.rendimento));
        tr.appendChild(tdNome);

        // Cobertura (select)
        const tdCob = el('td', {style:'text-align:center'});
        const cobSel = el('select', {cls:'qp-cobertura-sel'});
        [1,2,3].forEach(n => {
          const opt = document.createElement('option');
          opt.value = String(n);
          opt.textContent = n + (n === 1 ? ' entrega' : ' entregas');
          if (n === cobertura) opt.selected = true;
          cobSel.appendChild(opt);
        });
        cobSel.addEventListener('change', () => {
          const newCob = parseInt(cobSel.value);
          qpSet(`cob_${ft.id}`, newCob);
          // Recalcular sugestão sem re-renderizar o DOM inteiro
          const { lotes: newLotes } = calcLotesSugeridos(ft, newCob);
          const thisTr = cobSel.closest('tr');
          if (thisTr) {
            const sugEl = thisTr.querySelector('[data-role="sug"]');
            if (sugEl) {
              sugEl.textContent = newLotes > 0 ? '↑ ' + newLotes + ' lotes' : '—';
              sugEl.className = 'qp-sugestao' + (newLotes === 0 ? ' zero' : '');
              sugEl.onclick = newLotes > 0 ? () => {
                qpSet('qty_' + dayIdx + '_' + ft.id, newLotes);
                const qi = thisTr.querySelector('.qp-qty-input');
                if (qi) qi.value = String(newLotes);
              } : null;
            }
          }
        });
        tdCob.appendChild(cobSel);
        if (dayCode) {
          const cobInfo = el('div', {style:'font-size:10px;color:var(--text-3);margin-top:3px'});
          cobInfo.textContent = 'A enviar: ' + aEnviarTotal + ' · CPD: ' + estCPD;
          tdCob.appendChild(cobInfo);
        }
        tr.appendChild(tdCob);

        // Sugestão automática
        const tdSug = el('td', {style:'text-align:center'});
        if (dayCode) {
          const sugSpan = document.createElement('span');
          sugSpan.className = 'qp-sugestao' + (lotes === 0 ? ' zero' : '');
          sugSpan.setAttribute('data-role', 'sug');
          sugSpan.title = lotes > 0 ? 'Clique para usar esta sugestão' : 'Sem necessidade de produção';
          sugSpan.textContent = lotes > 0 ? '↑ ' + lotes + ' lotes' : '—';
          if (lotes > 0) {
            sugSpan.addEventListener('click', () => {
              qpSet('qty_' + dayIdx + '_' + ft.id, lotes);
              const qi = tr.querySelector('.qp-qty-input');
              if (qi) qi.value = String(lotes);
            });
          }
          tdSug.appendChild(sugSpan);
        } else {
          tdSug.appendChild(el('span', {style:'color:var(--text-3);font-size:11px'}, 'manual'));
        }
        tr.appendChild(tdSug);

        // Quantidade de lotes (manual)
        const tdQty = el('td', {style:'text-align:center'});
        const qtyCell = el('div', {cls:'qp-lotes-cell'});
        const minusBtn = el('button', {cls:'qp-qty-btn'}, '−');
        const qtyInp = el('input', {cls:'qp-qty-input', type:'number', min:'0'});
        qtyInp.value = String(lotesEfetivos);
        const plusBtn = el('button', {cls:'qp-qty-btn'}, '+');
        // Atualizar insumos inline sem re-renderizar
        function _updateInsumos(v) {
          qpSet('qty_' + dayIdx + '_' + ft.id, v);
          // Atualizar insDiv na mesma linha
          const thisTr2 = qtyInp.closest('tr');
          if (!thisTr2) return;
          const insDiv2 = thisTr2.querySelector('.qp-insumos');
          if (insDiv2) {
            insDiv2.innerHTML = '';
            if (v > 0) {
              ft.mp.forEach(i => {
                const line = document.createElement('div');
                line.innerHTML = i.n + ': <b>' + +(i.q * v).toFixed(2) + ' ' + i.u + '</b>';
                insDiv2.appendChild(line);
              });
              if (ft.emb && ft.emb.length) {
                ft.emb.forEach(i => {
                  const line = document.createElement('div');
                  line.className = 'qp-insumos emb';
                  line.innerHTML = '[emb] ' + i.n + ': <b>' + +(i.q * v).toFixed(2) + ' ' + i.u + '</b>';
                  insDiv2.appendChild(line);
                });
              }
            } else {
              const dash = document.createElement('span');
              dash.style.cssText = 'color:var(--text-3);font-size:11px';
              dash.textContent = '—';
              insDiv2.appendChild(dash);
            }
          }
          // Atualizar botão liberar
          const libBtn2 = thisTr2.querySelector('.qp-status-btn');
          if (libBtn2 && !libBtn2.classList.contains('liberado')) {
            libBtn2.classList.toggle('disabled', v === 0);
          }
          // Se liberado e zerou, des-liberar
          if (v === 0 && qpGet('lib_' + dayIdx + '_' + ft.id, false)) {
            qpSet('lib_' + dayIdx + '_' + ft.id, false);
            if (libBtn2) {
              libBtn2.classList.remove('liberado');
              libBtn2.textContent = 'Liberar';
            }
          }
        }

        minusBtn.addEventListener('click', () => {
          const v = Math.max(0, (parseInt(qtyInp.value) || 0) - 1);
          qtyInp.value = v;
          _updateInsumos(v);
        });
        plusBtn.addEventListener('click', () => {
          const v = (parseInt(qtyInp.value) || 0) + 1;
          qtyInp.value = v;
          _updateInsumos(v);
        });
        qtyInp.addEventListener('change', () => {
          const v = Math.max(0, parseInt(qtyInp.value) || 0);
          qtyInp.value = v;
          _updateInsumos(v);
        });
        qtyCell.append(minusBtn, qtyInp, plusBtn);
        tdQty.appendChild(qtyCell);
        tr.appendChild(tdQty);

        // Insumos calculados
        const tdIns = el('td');
        const insDiv = el('div', {cls:'qp-insumos'});
        if (lotesEfetivos > 0) {
          ft.mp.forEach(i => {
            const line = el('div');
            line.innerHTML = `${i.n}: <b>${+(i.q * lotesEfetivos).toFixed(2)} ${i.u}</b>`;
            insDiv.appendChild(line);
          });
          if (ft.emb && ft.emb.length) {
            ft.emb.forEach(i => {
              const line = el('div', {cls:'emb'});
              line.innerHTML = `[emb] ${i.n}: <b>${+(i.q * lotesEfetivos).toFixed(2)} ${i.u}</b>`;
              insDiv.appendChild(line);
            });
          }
        } else {
          insDiv.appendChild(el('span', {style:'color:var(--text-3);font-size:11px'}, '—'));
        }
        tdIns.appendChild(insDiv);
        tr.appendChild(tdIns);

        // Observações
        const tdObs = el('td');
        const obsInp = el('textarea', {cls:'qp-obs-input', rows:'2',
          placeholder:'Obs...', style:'min-width:80px'});
        obsInp.value = qpGet(`obs_${dayIdx}_${ft.id}`, '');
        obsInp.addEventListener('change', () => qpSet(`obs_${dayIdx}_${ft.id}`, obsInp.value));
        tdObs.appendChild(obsInp);
        tr.appendChild(tdObs);

        // Status / Liberar
        const tdStatus = el('td', {style:'text-align:center'});
        const libBtn = el('button', {
          cls: 'qp-status-btn' + (liberado ? ' liberado' : lotesEfetivos === 0 ? ' disabled' : ''),
        });
        libBtn.textContent = liberado ? '✓ Liberado' : 'Liberar';
        if (!liberado && lotesEfetivos > 0) {
          libBtn.addEventListener('click', () => {
            qpSet(`lib_${dayIdx}_${ft.id}`, true);
            qpSalvarHistorico(dayIdx);
            renderQPBody(dayIdx);
          });
        } else if (liberado) {
          libBtn.addEventListener('click', () => {
            qpSet(`lib_${dayIdx}_${ft.id}`, false);
            renderQPBody(dayIdx);
          });
        }
        tdStatus.appendChild(libBtn);
        tr.appendChild(tdStatus);

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      tableWrap.appendChild(table);
      tableWrap.style.display = 'none';
      areaWrap.appendChild(tableWrap);

      const footer = el('div', {cls:'qp-section-footer'});
      footer.style.display = 'none';
      footer.appendChild(el('span', {cls:'qp-footer-info'},
        items.filter(i => i.lotes > 0).length + ' com necessidade · ' + liberadosArea + '/' + totalArea + ' liberados'));
      areaWrap.appendChild(footer);

      // Toggle ao clicar no header
      areaHdr.addEventListener('click', e => {
        if (e.target.closest('button,input,select,textarea')) return;
        openAreas[area] = !openAreas[area];
        const chev = areaHdr.querySelector('.qp-chevron');
        if (chev) chev.style.transform = openAreas[area] ? 'rotate(180deg)' : '';
        tableWrap.style.display = openAreas[area] ? '' : 'none';
        footer.style.display    = openAreas[area] ? '' : 'none';
      });

      bodyEl.appendChild(areaWrap);
    });
  }

  renderQPBody(activeDay);
  return frag;
}
