  // impedir tirar uma conferência a qualquer momento do dia.
  // (26/07: testamos temporariamente pular esse modal pra isolar um bug —
  // já achado e corrigido em printStockPdf/_catsToPrint — modal restaurado.)
  pdfUnitBtn.addEventListener('click', () => openPdfCategoriesModal(activeUnit, unitStock[activeUnit] || ustock, getUnitCatalog(activeUnit).categories));
  pdfWrapUnit.appendChild(pdfUnitBtn);
  const inner = el('div', {style:'padding:14px 18px 18px'});
  // Only the unit's own logged-in user can edit their stock panel
  const canEditUnit = !isCPD() && session && session.unit === activeUnit;
  inner.appendChild(buildStockTable(ustock, 'unit-search', canEditUnit ? (itemId, qty) => {
    if (!unitStock[activeUnit]) unitStock[activeUnit] = {};
    if (!unitStock[activeUnit]) unitStock[activeUnit] = {};
    unitStock[activeUnit][itemId] = qty;
    // Registrar modificação da categoria para zeragem automática
    if (!isCPD() && session) {
      const _modItem = (getUnitCatalog(activeUnit).catalog || []).find(i => i.id === itemId);
      if (_modItem) markCatModified(activeUnit, _modItem.category);
    }
    // Salvar APENAS este item no Firebase (atômico) — evita zerar outros itens
    // que ainda não carregaram na memória local
    const _slug = unitSlug(activeUnit);
    try { localStorage.setItem('pizza_unit_' + _slug, JSON.stringify(unitStock[activeUnit])); } catch(e) {}
    if (window._fb && window._fb.ready && typeof db !== 'undefined') {
      window._fb.localWrite = true;
      clearTimeout(window._fb.localWriteTimer);
      window._fb.localWriteTimer = setTimeout(() => { window._fb.localWrite = false; }, 5000);
      db.ref('dados/pizza_units/' + _slug + '/' + itemId).set(qty)
        .then(() => {
          clearTimeout(window._fb.localWriteTimer);
          window._fb.localWriteTimer = setTimeout(() => { window._fb.localWrite = false; }, 300);
        })
        .catch(e => {
          console.warn('[Firebase] Erro ao salvar item', itemId, e);
          window._fb.localWrite = false;
          // NÃO usar saveUnit() (sobrescreve o objeto inteiro) aqui — é
          // exatamente o que o comentário acima diz pra evitar: se este
          // aparelho não tiver em memória algum item que outro dispositivo
          // já salvou (rede lenta, aba com dado desatualizado), um "set"
          // do objeto completo apaga esse item de outra pessoa do Firebase,
          // mesmo já confirmado. Reenfileira só este item pro mecanismo de
          // retry (mesmo usado no modo offline) em vez de sobrescrever tudo.
          window._fb.pendingWrites = window._fb.pendingWrites || [];
          window._fb.pendingWrites.push({ key: 'pizza_units/' + _slug + '/' + itemId, data: qty });
          if (typeof _updatePendingBadge === 'function') _updatePendingBadge(window._fb.pendingWrites.length);
          if (typeof _flushPendingWrites === 'function') setTimeout(_flushPendingWrites, 3000);
        });
    } else {
      window._fb = window._fb || { ready: false, pendingWrites: [] };
      window._fb.pendingWrites = window._fb.pendingWrites || [];
      window._fb.pendingWrites.push({ key: 'pizza_units/' + _slug + '/' + itemId, data: qty });
    }
  } : undefined, {
    useMin: false,
    pdfLabel: activeUnit,
    showConfirm: !isCPD(),
    unitName: activeUnit,
    showEnviar: isCPD(),
    unitForDisplay: activeUnit,
    catSource: getUnitCatalog(activeUnit).catalog, // catálogo específico desta unidade
  }));
  tableBlock.appendChild(inner);
  frag.appendChild(tableBlock);

  return frag;
}// ═══ PDF DE ENVIOS (PRODUÇÃO / COMPRAS) ══════════════════════════════════════
function gerarPdfEnvios(tipo) {
  const day     = nextEnviarDay();
  const dayFull = {SEG:'Segunda-feira', QUA:'Quarta-feira', SEX:'Sexta-feira'}[day] || day;
  const titulo  = tipo === 'produzido' ? 'Lista de Producao' : 'Lista de Compras';
  const _norm   = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

  // Coletar itens com falta no CPD filtrados por tipo
  const linhas = [];
  const relevantPairs = new Set();
  const naoContados = []; // itens com estoque 0 e não contados nesta janela — não entram no cálculo, mas são avisados
  UNIT_NAMES.forEach(unitName => {
    const ucat   = getUnitCatalog(unitName).catalog;
    const ustock = unitStock[unitName] || {};
    const minMap = getMinPerDay(unitName);
    ucat.forEach(item => {
      if (classificarItem(item.name) !== tipo) return;
      const estUnit = ustock[item.id] || 0;
      // Item com estoque 0 e ainda não contado nesta janela: não sabemos o
      // valor real, então não tratamos como "zero de verdade" no cálculo —
      // só avisamos, em vez de silenciosamente considerar que a unidade tem 0.
      if (!itemFoiContado(unitName, item.id, estUnit)) {
        const minEntry = minMap[item.key];
        const minDia = minEntry ? (minEntry[day] || 0) : 0;
        if (minDia > 0) naoContados.push(unitName + ' - ' + item.name);
        return;
      }
      const aEnviar = calcAEnviar(unitName, item.key, estUnit, day);
      if (aEnviar === 0) return; // sem mínimo ou unidade já tem
      relevantPairs.add(unitName + '|' + item.category);
      const cpdItem = (catalog || []).find(c => c.key === item.key);
      const estCPD  = cpdItem ? (cpd[cpdItem.id] || 0) : 0;
      const falta   = Math.max(0, aEnviar - estCPD);
      if (falta === 0) return;
      const existing = linhas.find(l => l.key === item.key);
      if (existing) {
        existing.falta += falta;
        existing.detalhe += ', ' + unitName + ' (' + aEnviar + ')';
      } else {
        linhas.push({ name: item.name, key: item.key, unit: item.unit, falta,
                      category: categoriaCanonica(item.key, item.category), detalhe: unitName + ' (' + aEnviar + ')' });
      }
    });
  });

  const staleEntries = [];
  relevantPairs.forEach(pair => {
    const [unitName, cat] = pair.split('|');
    const st = getCategoryStaleness(unitName, cat);
    if (st) {
      staleEntries.push(unitName + ' - ' + cat + (st.never
        ? ' (nunca confirmada)'
        : ' (' + st.days + (st.days === 1 ? ' dia' : ' dias') + ' atr\u00E1s)'));
    }
  });
  // Itens com m\u00EDnimo pro dia mas ainda n\u00E3o contados nesta janela \u2014 n\u00E3o entraram
  // no c\u00E1lculo acima porque n\u00E3o sabemos se s\u00E3o zero de verdade, mas \u00E9 importante
  // avisar: podem estar faltando sem aparecer na lista.
  if (naoContados.length > 0) {
    staleEntries.push('N\u00C3O CONTADOS (podem estar faltando e n\u00E3o aparecem na lista): ' + naoContados.join(', '));
  }

  if (linhas.length === 0) {
    if (naoContados.length > 0) {
      toast('Nenhum item calculado, mas há ' + naoContados.length + ' item(ns) ainda não contado(s) que podem estar faltando. Confira as unidades antes de assumir que está tudo certo.');
    } else {
      toast((tipo === 'produzido' ? 'Nenhum item de producao' : 'Nenhum item de compra') + ' faltando para ' + dayFull);
    }
    return;
  }

  // Ordenar por categoria depois posição — usa a ordem do catálogo da Asa Sul,
  // que é o formato de referência para estas telas agregadas do CPD.
  const refCats = getUnitCatalog('Asa Sul').categories;
  linhas.sort((a, b) => {
    const ia = refCats.indexOf(a.category), ib = refCats.indexOf(b.category);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  // ── PDF Multipágina ──────────────────────────────────────────────────────
  function rgb(r,g,b) { return (r/255).toFixed(3)+' '+(g/255).toFixed(3)+' '+(b/255).toFixed(3); }
  const W = 595.28, H = 841.89, ml = 40, mr = 40;
  const col = [ml+2, ml+162, ml+212, ml+272];
  const rowH = 15, MARGIN_BOT = 50;
  const genDate = new Date().toLocaleDateString('pt-BR');

  function wrapText(text, maxChars) {
    const words = text.split(', '); const lines = []; let cur = '';
    words.forEach(w => {
      const test = cur ? cur+', '+w : w;
      if (test.length > maxChars && cur) { lines.push(cur); cur = w; } else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  const pages = [];
  let cmds = [];
  const c = (...p) => cmds.push(p.join(' '));

  function newPage() {
    cmds = [];
    const warnLines = staleEntries.length > 0
      ? wrapText('\u26A0 Contagem desatualizada usada no c\u00E1lculo: ' + staleEntries.join('; '), 95)
      : [];
    const extraH = warnLines.length * 11;
    c(rgb(12,26,15)+' rg', ml+' '+(H-50-extraH)+' '+(W-80)+' '+(40+extraH)+' re f');
    c('BT /F1 13 Tf '+rgb(240,237,224)+' rg '+(ml+8)+' '+(H-34)+' Td '+pdfStr(titulo+' - '+dayFull)+' Tj ET');
    c('BT /F2 8 Tf '+rgb(168,196,174)+' rg '+(W-mr-80)+' '+(H-34)+' Td '+pdfStr(genDate)+' Tj ET');
    c('BT /F2 9 Tf '+rgb(168,196,174)+' rg '+(ml+8)+' '+(H-48)+' Td '+pdfStr(linhas.length+' itens com falta no CPD')+' Tj ET');
    warnLines.forEach((wl, wi) => {
      c('BT /F1 8 Tf '+rgb(255,214,120)+' rg '+(ml+8)+' '+(H-48-12-wi*11)+' Td '+pdfStr(wl)+' Tj ET');
    });
    c(rgb(184,146,42)+' RG 0.8 w '+ml+' '+(H-58-extraH)+' m '+(W-mr)+' '+(H-58-extraH)+' l S');
    const thY = H-78-extraH;
    c(rgb(38,116,62)+' rg '+ml+' '+thY+' '+(W-ml-mr)+' 18 re f');
    ['ITEM','UN','FALTA','PARA - UNIDADES'].forEach((h,i) => {
      c('BT /F1 8 Tf 1 1 1 rg '+col[i]+' '+(thY+5)+' Td '+pdfStr(h)+' Tj ET');
    });
    return thY - 2;
  }

  function closePage() {
    c(rgb(218,215,197)+' RG 0.5 w '+ml+' 36 m '+(W-mr)+' 36 l S');
    c('BT /F2 8 Tf '+rgb(154,152,128)+' rg '+ml+' 24 Td '+pdfStr("Sesconetto's Pizzeria  -  Sistema de Estoque")+' Tj ET');
    pages.push(cmds.slice());
  }

  let y = newPage();
  let lastCat = null;
  let rowIdx = 0;

  linhas.forEach(row => {
    const detLines = wrapText(row.detalhe, 52);
    const dynH = Math.max(rowH, 8 + detLines.length * 10);
    const catH = (row.category !== lastCat) ? 15 : 0;

    if (y - catH - dynH < MARGIN_BOT) {
      closePage();
      y = newPage();
      lastCat = null;
    }

    if (row.category !== lastCat) {
      lastCat = row.category;
      c(rgb(220,238,224)+' rg '+ml+' '+(y-13)+' '+(W-ml-mr)+' 14 re f');
      c('BT /F1 8 Tf '+rgb(16,48,22)+' rg '+(ml+4)+' '+(y-9)+' Td '+pdfStr(row.category.toUpperCase())+' Tj ET');
      y -= 15;
    }

    if (rowIdx%2===0) c(rgb(253,252,247)+' rg '+ml+' '+(y-dynH)+' '+(W-ml-mr)+' '+dynH+' re f');
    else              c(rgb(245,242,232)+' rg '+ml+' '+(y-dynH)+' '+(W-ml-mr)+' '+dynH+' re f');

    const midY = y - dynH/2 - 3;
    const nm = row.name.length > 36 ? row.name.substring(0,36)+'...' : row.name;
    c('BT /F2 9 Tf '+rgb(26,26,18)+' rg '+col[0]+' '+midY+' Td '+pdfStr(nm)+' Tj ET');
    c('BT /F2 9 Tf '+rgb(26,26,18)+' rg '+col[1]+' '+midY+' Td '+pdfStr(row.unit)+' Tj ET');
    c('BT /F1 10 Tf '+rgb(180,40,40)+' rg '+col[2]+' '+midY+' Td ('+row.falta+') Tj ET');
    detLines.forEach((dl,di) => {
      c('BT /F2 7.5 Tf '+rgb(60,60,60)+' rg '+col[3]+' '+((y-6)-di*10)+' Td '+pdfStr(dl)+' Tj ET');
    });
    c(rgb(218,215,197)+' RG 0.3 w '+ml+' '+(y-dynH)+' m '+(W-mr)+' '+(y-dynH)+' l S');
    y -= dynH;
    rowIdx++;
  });
  closePage();

  // Montar PDF multipágina
  const objs = [];
  function addObj(cnt) { const id=objs.length+1; objs.push({id,content:cnt}); return id; }
  const f1id = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const f2id = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const pageObjIds = [];
  pages.forEach(pageCmds => {
    const sc = pageCmds.join(String.fromCharCode(10));
    const NL2=String.fromCharCode(10); const sid = addObj('<< /Length '+sc.length+' >>'+NL2+'stream'+NL2+sc+NL2+'endstream');
    const pid = addObj('<< /Type /Page /Parent 999 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+sid+' 0 R /Resources << /Font << /F1 '+f1id+' 0 R /F2 '+f2id+' 0 R >> >> >>');
    pageObjIds.push(pid);
  });
  const pagesId = objs.length + 1;
  const catId   = addObj('<< /Type /Catalog /Pages '+(pagesId+1)+' 0 R >>');
  addObj('<< /Type /Pages /Kids ['+pageObjIds.map(id=>id+' 0 R').join(' ')+'] /Count '+pages.length+' >>');
  objs.forEach(obj => { obj.content = obj.content.replace('/Parent 999 0 R','/Parent '+pagesId+' 0 R'); });

  let out = '%PDF-1.4'+String.fromCharCode(10)+'%'+String.fromCharCode(255,255,255,255)+String.fromCharCode(10);
  const offsets = [];
  objs.forEach(obj => { offsets.push(out.length); out += obj.id+' 0 obj'+String.fromCharCode(10)+obj.content+String.fromCharCode(10)+'endobj'+String.fromCharCode(10); });
  const xrefOff = out.length;
  out += 'xref'+String.fromCharCode(10)+'0 '+(objs.length+1)+String.fromCharCode(10)+'0000000000 65535 f '+String.fromCharCode(10);
  offsets.forEach(o => { out += String(o).padStart(10,'0')+' 00000 n '+String.fromCharCode(10); });
  out += 'trailer'+String.fromCharCode(10)+'<< /Size '+(objs.length+1)+' /Root '+catId+' 0 R >>'+String.fromCharCode(10)+'startxref'+String.fromCharCode(10)+xrefOff+String.fromCharCode(10)+'%%EOF';

  const fname = (tipo === 'produzido' ? 'Lista_Producao_' : 'Lista_Compras_') + day + '.pdf';
  _baixarPdfString(out, fname);
  toast('PDF ' + (tipo === 'produzido' ? 'Producao' : 'Compras') + ' gerado!');
}

// PDF da "Tabela de Envios" — a mesma tabela-matriz da tela (agrupada por
// categoria, na mesma ordem), mas sem a coluna Est. CPD e sem a coluna
// Situação: item + Est. e A Enviar de cada unidade, com separadores
// verticais mais fortes entre as unidades para facilitar a leitura.
// Recebe as linhas já filtradas/buscadas como aparecem na tela no momento
// do clique.
function gerarPdfEnviosTabela(rows, dayFull, staleEntries) {
  if (!rows || rows.length === 0) {
    toast('Nenhum item para gerar o PDF com os filtros atuais.');
    return;
  }

  function rgb(r,g,b) { return (r/255).toFixed(3)+' '+(g/255).toFixed(3)+' '+(b/255).toFixed(3); }
  const W = 595.28, H = 841.89, ml = 40, mr = 40, TW = W - ml - mr;
  const genDate = new Date().toLocaleDateString('pt-BR');
  const nUnits  = UNIT_NAMES.length;
  // Cada unidade ganha 2 sub-colunas: Est. (estoque atual) e A Env. (a enviar) —
  // mesma leitura da tabela em tela, só sem a coluna Est. CPD e sem Situação.
  const itemW      = TW * 0.28;
  const subW       = (TW - itemW) / (nUnits * 2);
  const unitGroupW = subW * 2;
  const groupX     = i => ml + itemW + i * unitGroupW;
  const rowH = 16, MARGIN_BOT = 50;
  const SEP_CLR = rgb(184,146,42); // dourado — mesmo tom do separador entre unidades na tela

  // Aviso de "não contado"/"contagem desatualizada" removido do topo do PDF —
  // era ilegível quando havia muitos itens pendentes (virava uma parede de
  // texto cobrindo várias linhas). Quem quiser essa lista, consulta pelo botão
  // "Ver lista" na tela (Envios do Dia), que abre um pop-up organizado por
  // unidade. O PDF mantém só o "NC" discreto em cada célula do item pendente.

  const pages = [];
  let cmds = [];
  const c = (...p) => cmds.push(p.join(' '));

  function newPage() {
    cmds = [];
    c(rgb(12,26,15)+' rg', ml+' '+(H-50)+' '+(W-80)+' 40 re f');
    c('BT /F1 13 Tf '+rgb(240,237,224)+' rg '+(ml+8)+' '+(H-34)+' Td '+pdfStr('Tabela de Envios - '+dayFull)+' Tj ET');
    c('BT /F2 8 Tf '+rgb(168,196,174)+' rg '+(W-mr-80)+' '+(H-34)+' Td '+pdfStr(genDate)+' Tj ET');
    c('BT /F2 9 Tf '+rgb(168,196,174)+' rg '+(ml+8)+' '+(H-48)+' Td '+pdfStr(rows.length+' itens')+' Tj ET');
    c(SEP_CLR+' RG 0.8 w '+ml+' '+(H-58)+' m '+(W-mr)+' '+(H-58)+' l S');

    // Linha 1 do cabeçalho: nome da unidade (fundo verde escuro, texto branco)
    const hdr1Top = H-58, hdr1H = 16;
    c(rgb(38,116,62)+' rg '+ml+' '+(hdr1Top-hdr1H)+' '+(W-ml-mr)+' '+hdr1H+' re f');
    c('BT /F1 8 Tf 1 1 1 rg '+(ml+4)+' '+(hdr1Top-hdr1H+5)+' Td '+pdfStr('ITEM')+' Tj ET');

    // Linha 2 do cabeçalho: "Est." / "A Env." por unidade (fundo cinza claro)
    const hdr2Top = hdr1Top - hdr1H, hdr2H = 15;
    c(rgb(245,242,232)+' rg '+ml+' '+(hdr2Top-hdr2H)+' '+(W-ml-mr)+' '+hdr2H+' re f');

    UNIT_NAMES.forEach((u, i) => {
      const gx = groupX(i);
      // Separador vertical mais forte entre cada unidade — atravessa as duas
      // linhas do cabeçalho, para deixar claro onde uma unidade termina e a
      // próxima começa.
      c(SEP_CLR+' RG 1.1 w '+gx+' '+(hdr1Top-hdr1H)+' m '+gx+' '+(hdr2Top-hdr2H)+' l S');
      const nmW = u.length > 13 ? u.substring(0,13) : u;
      c('BT /F1 6.5 Tf 1 1 1 rg '+(gx+3)+' '+(hdr1Top-hdr1H+5.5)+' Td '+pdfStr(nmW.toUpperCase())+' Tj ET');
      c('BT /F1 6.5 Tf '+rgb(114,109,79)+' rg '+(gx+3)+' '+(hdr2Top-hdr2H+5)+' Td '+pdfStr('Est.')+' Tj ET');
      c('BT /F1 6.5 Tf '+rgb(114,109,79)+' rg '+(gx+3+subW)+' '+(hdr2Top-hdr2H+5)+' Td '+pdfStr('A Env.')+' Tj ET');
    });
    // Separador final à direita da última unidade
    c(SEP_CLR+' RG 1.1 w '+(W-mr)+' '+(hdr1Top-hdr1H)+' m '+(W-mr)+' '+(hdr2Top-hdr2H)+' l S');
    return hdr2Top - hdr2H - 2;
  }

  function closePage() {
    c(rgb(218,215,197)+' RG 0.5 w '+ml+' 36 m '+(W-mr)+' 36 l S');
    c('BT /F2 8 Tf '+rgb(154,152,128)+' rg '+ml+' 24 Td '+pdfStr("Sesconetto's Pizzeria  -  Sistema de Estoque")+' Tj ET');
    pages.push(cmds.slice());
  }

  let y = newPage();
  let lastCat = null;
  let rowIdx = 0;

  rows.forEach(row => {
    const cat  = row._catOrder || row.category;
    const catH = (cat !== lastCat) ? 15 : 0;

    if (y - catH - rowH < MARGIN_BOT) {
      closePage();
      y = newPage();
      lastCat = null;
    }

    if (cat !== lastCat) {
      lastCat = cat;
      c(rgb(220,238,224)+' rg '+ml+' '+(y-13)+' '+(W-ml-mr)+' 14 re f');
      c('BT /F1 8 Tf '+rgb(16,48,22)+' rg '+(ml+4)+' '+(y-9)+' Td '+pdfStr(cat.toUpperCase())+' Tj ET');
      y -= 15;
    }

    if (rowIdx%2===0) c(rgb(253,252,247)+' rg '+ml+' '+(y-rowH)+' '+(W-ml-mr)+' '+rowH+' re f');
    else              c(rgb(245,242,232)+' rg '+ml+' '+(y-rowH)+' '+(W-ml-mr)+' '+rowH+' re f');

    const midY     = y - rowH/2 - 3;
    const maxChars = Math.floor(itemW / 5.2);
    const nm = row.name.length > maxChars ? row.name.substring(0, maxChars-3)+'...' : row.name;
    c('BT /F2 9 Tf '+rgb(26,26,18)+' rg '+(ml+4)+' '+midY+' Td '+pdfStr(nm)+' Tj ET');

    UNIT_NAMES.forEach((u, i) => {
      const gx  = groupX(i);
      // Separador vertical entre unidades, descendo por toda a altura da linha
      c(SEP_CLR+' RG 0.6 w '+gx+' '+y+' m '+gx+' '+(y-rowH)+' l S');

      const pu    = row.perUnit ? row.perUnit[u] : null;
      const hasPu = !!pu;
      // 28/07: só é "NC" se a unidade também tem mínimo relevante pra esse
      // dia — sem isso, não contar não muda nada no envio de hoje.
      const naoContado = hasPu && pu.contado === false && pu.minDia > 0;
      const hasEnv = hasPu && !naoContado && pu.aEnviar > 0;
      const estVal = hasPu ? String(pu.est) : '-';
      const envVal = naoContado ? 'NC' : (hasEnv ? String(pu.aEnviar) : '-');
      const estClr = hasPu ? rgb(70,68,58) : rgb(160,158,140);
      const envClr = naoContado ? rgb(184,116,13) : (hasEnv ? rgb(26,82,41) : rgb(160,158,140));
      c('BT /F2 8.5 Tf '+estClr+' rg '+(gx+3)+' '+midY+' Td '+pdfStr(estVal)+' Tj ET');
      c('BT /F1 8.5 Tf '+envClr+' rg '+(gx+3+subW)+' '+midY+' Td '+pdfStr(envVal)+' Tj ET');
    });
    c(SEP_CLR+' RG 0.6 w '+(W-mr)+' '+y+' m '+(W-mr)+' '+(y-rowH)+' l S');

    c(rgb(218,215,197)+' RG 0.3 w '+ml+' '+(y-rowH)+' m '+(W-mr)+' '+(y-rowH)+' l S');
    y -= rowH;
    rowIdx++;
  });
  closePage();

  // Montar PDF multipágina
  const objs = [];
  function addObj(cnt) { const id=objs.length+1; objs.push({id,content:cnt}); return id; }
  const f1id = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const f2id = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const pageObjIds = [];
  pages.forEach(pageCmds => {
    const sc = pageCmds.join(String.fromCharCode(10));
    const NL2=String.fromCharCode(10); const sid = addObj('<< /Length '+sc.length+' >>'+NL2+'stream'+NL2+sc+NL2+'endstream');
    const pid = addObj('<< /Type /Page /Parent 999 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+sid+' 0 R /Resources << /Font << /F1 '+f1id+' 0 R /F2 '+f2id+' 0 R >> >> >>');
    pageObjIds.push(pid);
  });
  const pagesId = objs.length + 1;
  const catId   = addObj('<< /Type /Catalog /Pages '+(pagesId+1)+' 0 R >>');
  addObj('<< /Type /Pages /Kids ['+pageObjIds.map(id=>id+' 0 R').join(' ')+'] /Count '+pages.length+' >>');
  objs.forEach(obj => { obj.content = obj.content.replace('/Parent 999 0 R','/Parent '+pagesId+' 0 R'); });

  let out = '%PDF-1.4'+String.fromCharCode(10)+'%'+String.fromCharCode(255,255,255,255)+String.fromCharCode(10);
  const offsets = [];
  objs.forEach(obj => { offsets.push(out.length); out += obj.id+' 0 obj'+String.fromCharCode(10)+obj.content+String.fromCharCode(10)+'endobj'+String.fromCharCode(10); });
  const xrefOff = out.length;
  out += 'xref'+String.fromCharCode(10)+'0 '+(objs.length+1)+String.fromCharCode(10)+'0000000000 65535 f '+String.fromCharCode(10);
  offsets.forEach(o => { out += String(o).padStart(10,'0')+' 00000 n '+String.fromCharCode(10); });
  out += 'trailer'+String.fromCharCode(10)+'<< /Size '+(objs.length+1)+' /Root '+catId+' 0 R >>'+String.fromCharCode(10)+'startxref'+String.fromCharCode(10)+xrefOff+String.fromCharCode(10)+'%%EOF';

  // 28/07: nome do arquivo reflete os dias somados (ex.: "QUA", "QUA-SEX",
  // "SEG-QUA-SEX"), pra não ficar um PDF chamado "Tabela_Envios_QUA" com
  // dado de quarta+sexta somado dentro. dayFull chega como "Quarta-feira"
  // (um dia só) ou "SEG + QUA (soma)" (mais de um dia) — em ambos os casos
  // dá pra extrair os códigos SEG/QUA/SEX direto do texto.
  const _codigosNoTexto = (dayFull || '').match(/SEG|QUA|SEX|Segunda|Quarta|Sexta/g) || [];
  const _diasSlug = _codigosNoTexto
    .map(s => ({SEG:'SEG', QUA:'QUA', SEX:'SEX', Segunda:'SEG', Quarta:'QUA', Sexta:'SEX'}[s] || ''))
    .filter(Boolean)
    .join('-') || (typeof nextEnviarDay === 'function' ? nextEnviarDay() : Date.now());
  const fname = 'Tabela_Envios_' + _diasSlug + '.pdf';
  _baixarPdfString(out, fname);
  toast('PDF da tabela de envios gerado!');
}

// Modal com a lista de itens ainda não contados nesta janela, agrupada por
// unidade — usado pelo botão "Ver lista" do aviso na aba Envios do Dia.
// items: [{ unit, name }]
function openNaoContadosModal(items) {
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
  const overlay = el('div', {cls:'modal-overlay'});
  const box = el('div', {cls:'modal-box', style:'max-width:480px'});

  const header = el('div', {cls:'modal-header'});
  header.appendChild(el('div', {cls:'modal-title'}, 'Itens não contados (' + items.length + ')'));
  header.appendChild(el('button', {cls:'modal-close', onclick:()=>overlay.remove()}, '×'));
  box.appendChild(header);

  const body = el('div', {cls:'modal-body', style:'max-height:70vh'});
  body.appendChild(el('p', {style:'padding:2px 20px 12px;color:var(--text-3);font-size:13px'},
    'Esses itens não entram no cálculo de A Enviar até a unidade confirmar a contagem (mesmo que a contagem real seja zero).'));

  const byUnit = {};
  items.forEach(({unit, name}) => {
    if (!byUnit[unit]) byUnit[unit] = [];
    byUnit[unit].push(name);
  });
  UNIT_NAMES.forEach(u => {
    const list = byUnit[u];
    if (!list || !list.length) return;
    body.appendChild(el('div', {cls:'dash-section-head'}, u + ' (' + list.length + ')'));
    list.forEach(name => {
      const row = el('div', {cls:'dash-detail-row'});
      row.appendChild(el('span', {cls:'dash-detail-name'}, name));
      body.appendChild(row);
    });
  });
  box.appendChild(body);

  const footer = el('div', {cls:'modal-footer'});
  footer.appendChild(el('button', {cls:'btn btn-outline', onclick:()=>overlay.remove()}, 'Fechar'));
  box.appendChild(footer);

  overlay.appendChild(box);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// ═══ ENVIOS DO DIA ═══════════════════════════════════════════════════════════
function viewEnviosDia() {
  const frag = document.createDocumentFragment();
  const day     = nextEnviarDay();
  const dayFull = {SEG:'Segunda-feira', QUA:'Quarta-feira', SEX:'Sexta-feira'}[day] || day;
  const _norm   = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

  // ── Seletor de dias a somar (SEG/QUA/SEX) ───────────────────────────────────
  // Por padrão, só o dia automático de hoje (comportamento de sempre). O
  // usuário pode marcar mais de um dia pra ver a soma dos mínimos — útil pra
  // ter uma ideia geral da semana ou programar uma compra que cubra vários
  // dias de uma vez. window._enviosDiaDias persiste entre renders (igual a
  // openCats), então a seleção não se perde ao digitar na busca etc.
  const DIA_LABEL_CURTO = {SEG:'Segunda', QUA:'Quarta', SEX:'Sexta'};
  const DIA_LABEL_FULL  = {SEG:'Segunda-feira', QUA:'Quarta-feira', SEX:'Sexta-feira'};
  const DIAS_ORDEM = ['SEG','QUA','SEX'];
  if (!window._enviosDiaDias || window._enviosDiaDias.length === 0) {
    window._enviosDiaDias = [day];
  }
  const diasSel = DIAS_ORDEM.filter(d => window._enviosDiaDias.includes(d));
  const ehSelecaoPadrao = diasSel.length === 1 && diasSel[0] === day;
  const diasSelFullTexto = diasSel.map(d => DIA_LABEL_FULL[d]).join(' + ');
  // Título mais curto pro cabeçalho do PDF quando tem mais de um dia somado
  // (evita estourar a largura da página com "Segunda-feira + Quarta-feira + Sexta-feira").
  const diasSelTituloPdf = diasSel.length === 1
    ? DIA_LABEL_FULL[diasSel[0]]
    : diasSel.join(' + ') + ' (soma)';

  // ── Cabeçalho ──────────────────────────────────────────────────────────────
  const hdrWrap = el('div', {style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px'});
  hdrWrap.appendChild(el('h2', {cls:'table-title'}, 'Envios do Dia'));
  const dayBadge = el('span', {cls:'envios-dia-day-badge'}, '\uD83D\uDE9A ' + dayFull);
  hdrWrap.appendChild(dayBadge);
  // Botões PDF
  const pdfWrap = el('div', {style:'display:flex;gap:6px;margin-left:auto;flex-wrap:wrap'});
  const btnProd = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:12px;display:flex;align-items:center;gap:5px'});
  btnProd.innerHTML = '\uD83D\uDCC4 PDF Produ\u00E7\u00E3o';
  btnProd.title = 'Lista de itens produzidos que faltam no CPD';
  btnProd.addEventListener('click', () => gerarPdfEnvios('produzido'));
  const btnComp = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:12px;display:flex;align-items:center;gap:5px'});
  btnComp.innerHTML = '\uD83D\uDCC4 PDF Compras';
  btnComp.title = 'Lista de itens comprados que faltam no CPD';
  btnComp.addEventListener('click', () => gerarPdfEnvios('comprado'));
  const btnTabela = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:12px;display:flex;align-items:center;gap:5px'});
  btnTabela.innerHTML = '📄 PDF Tabela';
  btnTabela.title = 'Imprime a tabela de envios (item + estoque e quantidade a enviar de cada unidade), sem Est. CPD e sem Situação';
  btnTabela.addEventListener('click', () => gerarPdfEnviosTabela(currentFilteredRows, diasSelTituloPdf, staleEntries));
  pdfWrap.appendChild(btnProd);
  pdfWrap.appendChild(btnComp);
  pdfWrap.appendChild(btnTabela);
  hdrWrap.appendChild(pdfWrap);
  frag.appendChild(hdrWrap);

  // ── Chips de seleção de dias ─────────────────────────────────────────────
  const diasWrap = el('div', {style:'display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px'});
  diasWrap.appendChild(el('span', {style:'font-size:11px;color:var(--text-3);font-weight:600'}, 'Somar dias:'));
  DIAS_ORDEM.forEach(d => {
    const ativo = diasSel.includes(d);
    const chip = el('button', {
      cls: 'btn btn-sm' + (ativo ? '' : ' btn-outline'),
      style: 'font-size:11px;padding:4px 12px;' + (ativo ? 'background:var(--accent,#1A5229);color:#fff;border-color:var(--accent,#1A5229);' : '')
    }, DIA_LABEL_CURTO[d]);
    chip.title = ativo ? 'Clique para remover ' + DIA_LABEL_CURTO[d] + ' da soma' : 'Clique para somar ' + DIA_LABEL_CURTO[d];
    chip.addEventListener('click', () => {
      const idx = window._enviosDiaDias.indexOf(d);
      if (idx >= 0) {
        if (window._enviosDiaDias.length > 1) window._enviosDiaDias.splice(idx, 1); // nunca deixar vazio
      } else {
        window._enviosDiaDias.push(d);
      }
      render();
    });
    diasWrap.appendChild(chip);
  });
  const btnTodos = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:11px;padding:4px 12px'}, 'Semana (3 dias)');
  btnTodos.title = 'Somar segunda + quarta + sexta — visão geral pra compra semanal';
  btnTodos.addEventListener('click', () => { window._enviosDiaDias = DIAS_ORDEM.slice(); render(); });
  diasWrap.appendChild(btnTodos);
  if (!ehSelecaoPadrao) {
    const btnReset = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:11px;padding:4px 12px'}, '\u21BB Voltar pra hoje');
    btnReset.title = 'Voltar a mostrar só o envio automático de hoje (' + dayFull + ')';
    btnReset.addEventListener('click', () => { window._enviosDiaDias = [day]; render(); });
    diasWrap.appendChild(btnReset);
  }
  frag.appendChild(diasWrap);

  // ── Aviso: visualização de planejamento, não é o envio operacional ──────────
  if (!ehSelecaoPadrao) {
    const vizBanner = el('div', {cls:'alert-banner', style:'margin-bottom:14px;align-items:center;background:var(--accent-bg,#EAF6EF);border:1.5px solid var(--accent,#1A5229)'});
    const vizIcon = el('span', {cls:'alert-banner-icon'}, '\uD83D\uDCCA');
    const vizBody = el('div', {cls:'alert-banner-body'});
    vizBody.appendChild(el('div', {cls:'alert-banner-title'}, 'Visualizando: ' + diasSelFullTexto));
    vizBody.appendChild(el('div', {cls:'alert-banner-items'},
      'Isso é uma projeção pra planejamento (compra semanal, visão geral) — não substitui o envio operacional de hoje (' + dayFull + ').'));
    vizBanner.appendChild(vizIcon);
    vizBanner.appendChild(vizBody);
    frag.appendChild(vizBanner);
  }

  // ── Coletar todos os itens que precisam de envio ───────────────────────────
  // 28/07: corrigido a pedido do Eduardo — antes, se uma unidade não tivesse
  // mínimo cadastrado pra ESSA unidade no(s) dia(s) selecionado(s), o
  // estoque real dela (Est.) simplesmente desaparecia da tabela (virava "-"),
  // mesmo a unidade tendo o item contado normalmente. Isso é perigoso: quem
  // olha "Est." pra decidir se precisa mandar algo pode achar que a unidade
  // não tem o produto quando na verdade tem, só não tinha mínimo pro dia
  // exibido. Agora: o item aparece na tabela se PELO MENOS UMA unidade
  // precisar de envio nesse(s) dia(s) (mesmo critério de sempre), mas TODAS
  // as unidades que têm o item no catálogo mostram o estoque real — só o "A
  // Enviar" fica "-"/0 nas unidades sem mínimo pro dia, o "Est." nunca some.
  const itemMap = new Map(); // itemKey → { name, category, unit, cpdId, perUnit: {unitName: {est, aEnv}} }
  // Unidade+categoria cujo estoque atual (potencialmente desatualizado) entrou
  // no cálculo de A Enviar de hoje — usado para o aviso de dado desatualizado
  const relevantPairs = new Set();

  // Passo 1: para cada unidade, somar estoque por item.key (cobre o caso de
  // um mesmo produto cadastrado em categorias diferentes) e calcular, sem
  // decidir ainda se o item "entra" na tabela — isso é feito só no Passo 2,
  // olhando as 4 unidades juntas.
  const porUnidade = {}; // unitName → { itemKey → { name, estSoma, item, minDia, contado, aEnviar } }
  UNIT_NAMES.forEach(unitName => {
    const ucat   = getUnitCatalog(unitName).catalog;
    const ustock = unitStock[unitName] || {};
    const minMap = getMinPerDay(unitName);

    // Itens com mesmo produto em categorias diferentes (ex: Morango em Refrig + Bar):
    // → SOMAR estoques de todos os IDs (agrupados por item.key, fixo mesmo se renomeado)
    // → calcAEnviarDias já usa MIN_PER_DAY consolidado (soma de todas as categorias)
    const _seenInUnit = {}; // item.key → { name, estSoma, item }
    ucat.forEach(item => {
      const key = item.key;
      const est = ustock[item.id] || 0;
      if (!_seenInUnit[key]) {
        _seenInUnit[key] = { name: item.name, estSoma: est, item };
      } else {
        _seenInUnit[key].estSoma += est;
      }
    });

    const resultado = {};
    Object.values(_seenInUnit).forEach(({ name, estSoma, item }) => {
      const minEntry = minMap[item.key];
      // 28/07: soma os mínimos de TODOS os dias selecionados no seletor (por
      // padrão só o dia de hoje, mesmo comportamento de sempre) — ver
      // window._enviosDiaDias / somaMinDias / calcAEnviarDias.
      const minDia = somaMinDias(minEntry, diasSel);
      const contado = itemFoiContado(unitName, item.id, estSoma);
      const aEnviar = (contado && minDia > 0) ? calcAEnviarDias(unitName, item.key, estSoma, diasSel) : 0;
      resultado[item.key] = { name, estSoma, item, minDia, contado, aEnviar };
    });
    porUnidade[unitName] = resultado;
  });

  // Passo 2: um item vira LINHA na tabela se pelo menos uma unidade precisa
  // dele nesse(s) dia(s) (mesmo critério de sempre — não lista o catálogo
  // inteiro). Mas ao virar linha, TODAS as unidades que têm o item no
  // catálogo entram no perUnit com o estoque real, mesmo as que não tinham
  // mínimo pro dia selecionado.
  const todasAsKeys = new Set();
  UNIT_NAMES.forEach(u => Object.keys(porUnidade[u]).forEach(k => todasAsKeys.add(k)));

  todasAsKeys.forEach(itemKey => {
    const algumaUnidadePrecisa = UNIT_NAMES.some(u => porUnidade[u][itemKey] && porUnidade[u][itemKey].minDia > 0);
    if (!algumaUnidadePrecisa) return; // nenhuma unidade tem mínimo pra esse item nesse(s) dia(s) — não é relevante

    UNIT_NAMES.forEach(unitName => {
      const dados = porUnidade[unitName][itemKey];
      if (!dados) return; // essa unidade nem tem esse item no catálogo — fica "-" mesmo (correto)
      const { name, estSoma, item, aEnviar, contado, minDia } = dados;
      if (aEnviar > 0) relevantPairs.add(unitName + '|' + item.category);

      if (!itemMap.has(item.key)) {
        const cpdItem = catalog.find(c => c.key === item.key);
        itemMap.set(item.key, {
          name, key: item.key, unit: item.unit, category: categoriaCanonica(item.key, item.category),
          estCPD: cpdItem ? (cpd[cpdItem.id] || 0) : 0,
          perUnit: {}
        });
      }
      // Sempre registrar: estoque, aEnviar (pode ser 0 se unidade já tem suficiente
      // ou se ainda não contado) e a flag "contado" para diferenciar os dois casos.
      // minDia também vai junto — precisa pra "pendente" (linha 8348-ish) não
      // acusar falta de contagem numa unidade que nem tem mínimo pra esse
      // item nesse dia (não contar não muda o total de qualquer forma).
      itemMap.get(item.key).perUnit[unitName] = { est: estSoma, aEnviar, contado, minDia };
    });
  });

  // ── Aviso de itens ainda não contados nesta janela ──────────────────────────
  // Esses itens não entram no cálculo de A Enviar (não sabemos se é zero de
  // verdade) — aparecem como "NC" em cada célula da tabela. O aviso fica só
  // com a contagem e um botão "Ver lista" (abre modal agrupado por unidade) —
  // listar tudo direto no banner virava uma parede de texto ilegível quando
  // havia muitos itens pendentes.
  const naoContadosDia = [];
  itemMap.forEach(row => {
    UNIT_NAMES.forEach(u => {
      const pu = row.perUnit[u];
      // 28/07: só entra no aviso se a unidade tiver mínimo relevante pra
      // esse dia — não contar um item que a unidade nem precisa enviar
      // hoje não é motivo de alerta.
      if (pu && pu.contado === false && pu.minDia > 0) naoContadosDia.push({ unit: u, name: row.name });
    });
  });
  if (naoContadosDia.length > 0) {
    const ncBanner = el('div', {cls:'alert-banner warn', style:'margin-bottom:14px;align-items:center'});
    const ncIcon = el('span', {cls:'alert-banner-icon'}, '❓');
    const ncBody = el('div', {cls:'alert-banner-body', style:'display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%'});
    const ncText = el('div', {});
    ncText.appendChild(el('div', {cls:'alert-banner-title'}, naoContadosDia.length + ' item(ns) ainda não contado(s) nesta janela'));
    ncText.appendChild(el('div', {cls:'alert-banner-items'}, 'Não entram no cálculo de A Enviar até a unidade confirmar a contagem.'));
    ncBody.appendChild(ncText);
    const ncBtn = el('button', {cls:'btn btn-outline btn-sm', style:'flex-shrink:0'}, 'Ver lista');
    ncBtn.addEventListener('click', () => openNaoContadosModal(naoContadosDia));
    ncBody.appendChild(ncBtn);
    ncBanner.appendChild(ncIcon);
    ncBanner.appendChild(ncBody);
    // 28/07: acima de toda a estrutura da tabela (cabeçalho, botões de PDF,
    // seletor de dias) a pedido do Eduardo — mesmo tratamento dado ao aviso
    // de contagem em aberto/desatualizada.
    frag.insertBefore(ncBanner, frag.firstChild);
  }

  // ── Aviso de contagem desatualizada usada neste cálculo ────────────────────
  // 28/07: a versão anterior listava unidade+categoria+"há quantos dias" pra
  // cada par desatualizado — virava uma parede de texto somada ao banner
  // global "Contagem em aberto" já visível no topo da tela. A pedido do
  // Eduardo, isso vira UM aviso só, curto, sem lista detalhada — colocado
  // acima de toda a estrutura da tabela (antes do cabeçalho "Envios do
  // Dia"). O banner global (renderOpenCountBanner) fica escondido nesta
  // tela pra não duplicar a mesma informação.
  const staleEntries = [];
  relevantPairs.forEach(pair => {
    const [unitName, cat] = pair.split('|');
    const st = getCategoryStaleness(unitName, cat);
    if (st) {
      staleEntries.push(unitName + ' \u2014 ' + cat + (st.never
        ? ' (nunca confirmada)'
        : ' (' + st.days + (st.days === 1 ? ' dia' : ' dias') + ' atr\u00E1s)'));
    }
  });
  if (staleEntries.length > 0) {
    const staleBanner = el('div', {cls:'alert-banner warn', style:'margin-bottom:14px'});
    const icon = el('span', {cls:'alert-banner-icon'}, '\u26A0\uFE0F');
    const body = el('div', {cls:'alert-banner-body'});
    body.appendChild(el('div', {cls:'alert-banner-title'}, 'Contagem em aberto \u2014 c\u00E1lculo desatualizado'));
    body.appendChild(el('div', {cls:'alert-banner-items'},
      'Uma ou mais unidades ainda n\u00E3o confirmaram a contagem de hoje. O valor de A Enviar usa o \u00FAltimo estoque registrado, n\u00E3o uma contagem atual.'));
    staleBanner.appendChild(icon);
    staleBanner.appendChild(body);
    frag.insertBefore(staleBanner, frag.firstChild);
  }

  // Enriquecer com totais e situação
  const rows = [];
  itemMap.forEach(row => {
    const totalAEnviar = UNIT_NAMES.reduce((s, u) => s + (row.perUnit[u] ? row.perUnit[u].aEnviar : 0), 0);
    const falta   = Math.max(0, totalAEnviar - row.estCPD);
    // Se alguma unidade ainda não contou este item, totalAEnviar pode estar
    // subestimado (a contribuição dela entrou como 0). Marcamos "pendente"
    // pra não deixar a badge "✓ OK" passar confiança que os dados não têm —
    // ver o resumo no topo, mas cada linha também precisa avisar sozinha,
    // já que a pessoa pode filtrar/rolar e não ver o resumo.
    // 28/07: só marca "pendente" se a unidade que não contou TAMBÉM tem
    // mínimo relevante pra esse dia (minDia > 0) — uma unidade sem mínimo
    // pro dia selecionado nunca entra no total de qualquer forma, então não
    // contar não deixa o total mais incerto.
    const pendente = UNIT_NAMES.some(u => row.perUnit[u] && row.perUnit[u].contado === false && row.perUnit[u].minDia > 0);
    row.totalAEnviar = totalAEnviar;
    row.falta    = falta;
    row.pendente = pendente;
    row.situacao = falta > 0 ? 'falta' : 'ok';
    rows.push(row);
  });

  // Ordenar pela posição exata no catálogo das unidades (ordem de produção)
  // A CATEGORIA usada aqui é sempre a do catálogo da Asa Sul (categoriaCanonica)
  // — formato de referência para as telas agregadas do CPD, corrigido em 27/07
  // a pedido do Eduardo (uma correção anterior usava o catálogo do CPD como
  // referência, o que não é o formato correto para estas telas). A posição
  // (pos, só usada pra ordenar dentro da categoria) usa a primeira unidade
  // encontrada — isso é só estética, não afeta o agrupamento.
  const _getUnitCatalogPos = (itemKey) => {
    const cat = categoriaCanonica(itemKey, '');
    for (const u of UNIT_NAMES) {
      const uc = getUnitCatalog(u).catalog;
      const idx = uc.findIndex(c => c.key === itemKey);
      if (idx > -1) return { cat: cat || uc[idx].category, pos: idx };
    }
    return { cat, pos: 99999 };
  };
  rows.forEach(r => {
    const pos = _getUnitCatalogPos(r.key);
    r._catOrder = pos.cat;
    r._pos = pos.pos;
  });
  rows.sort((a, b) => {
    // Primeiro ordenar por categoria, pela ordem do catálogo da Asa Sul
    const catA = a._catOrder, catB = b._catOrder;
    if (catA !== catB) {
      const _refCatsRow = getUnitCatalog('Asa Sul').categories;
      const ia = _refCatsRow.indexOf(catA);
      const ib = _refCatsRow.indexOf(catB);
      if (ia > -1 && ib > -1) return ia - ib;
      if (ia > -1) return -1;
      if (ib > -1) return 1;
    }
    // Dentro da mesma categoria, pela posição no catálogo
    return a._pos - b._pos;
  });

  // ── Sumário ────────────────────────────────────────────────────────────────
  const totalItems  = rows.length;
  const totalFaltas = rows.filter(r => r.situacao === 'falta').length;
  const totalOk     = rows.filter(r => r.situacao === 'ok').length;

  const summaryRow = el('div', {cls:'envios-summary-row'});
  [['Total a enviar', totalItems, ''],
   ['CPD tem estoque', totalOk, 'ok'],
   ['Faltam no CPD',  totalFaltas, 'falta']].forEach(([lbl, val, cls]) => {
    const card = el('div', {cls:'envios-summary-card' + (cls ? ' ' + cls : '')});
    card.appendChild(el('div', {cls:'e-lbl'}, lbl));
    card.appendChild(el('div', {cls:'e-val'}, String(val)));
    summaryRow.appendChild(card);
  });
  frag.appendChild(summaryRow);

  if (rows.length === 0) {
    const empty = el('div', {cls:'table-wrap', style:'padding:32px;text-align:center;color:var(--success);font-weight:600'});
    empty.textContent = '\u2705 Nenhum item a enviar para ' + diasSelFullTexto + '. Todas as unidades t\u00EAm estoque suficiente.';
    frag.appendChild(empty);
    return frag;
  }

  // ── Filtros ────────────────────────────────────────────────────────────────
  let activeFilter = 'todos';
  let searchQuery = '';
  const searchWrap = el('div', {cls:'search-wrap', style:'margin-bottom:12px'});
  const searchIcon = el('span', {cls:'search-icon', html:'<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'});
  const searchInp  = el('input', {type:'text', placeholder:'Buscar item...', id:'envios-search'});
  searchWrap.appendChild(searchIcon);
  searchWrap.appendChild(searchInp);
  const filterTabs = el('div', {cls:'envios-filter-tabs'});
  const tableWrap  = el('div', {});
  frag.appendChild(searchWrap);
  frag.appendChild(filterTabs);
  frag.appendChild(tableWrap);

  // Guarda a lista atualmente filtrada/buscada (mesma que está na tela) para
  // que o PDF "Tabela de Envios" imprima exatamente o que está sendo exibido.
  let currentFilteredRows = rows;

  function buildMatrix() {
    tableWrap.innerHTML = '';
    tableWrap.classList.toggle('envios-searching', !!searchQuery);
    let filtered = activeFilter === 'todos' ? rows :
                     rows.filter(r => r.situacao === activeFilter);
    if (searchQuery) {
      const q = _norm(searchQuery);
      filtered = filtered.filter(r => _norm(r.name).includes(q));
    }
    currentFilteredRows = filtered;

    if (filtered.length === 0) {
      const empty = el('div', {style:'padding:24px;text-align:center;color:var(--success);font-weight:600;font-size:13px'});
      empty.textContent = searchQuery
        ? '\u2705 Nenhum item encontrado para "' + searchQuery + '".'
        : '\u2705 Nenhum item neste filtro.';
      tableWrap.appendChild(empty);
      return;
    }

    const wrap  = el('div', {cls:'envios-wrap'});
    const table = el('table', {cls:'envios-matrix'});

    // ── Thead linha 1: ITEM | EST CPD | ASA SUL(2) | SIG(2) | VP(2) | DLV(2) | SITUAÇÃO
    const thead = el('thead');
    const tr1   = el('tr');
    const thItem = el('th', {}, 'Item');
    thItem.setAttribute('rowspan', '2');
    tr1.appendChild(thItem);
    const thCpd = el('th', {}, 'Est. CPD');
    thCpd.setAttribute('rowspan', '2');
    tr1.appendChild(thCpd);
    UNIT_NAMES.forEach(u => {
      const th = el('th', {cls:'unit-hdr'}, u);
      th.setAttribute('colspan', '2');
      tr1.appendChild(th);
    });
    const thSit = el('th', {cls:'u-sep'}, 'Situa\u00E7\u00E3o');
    thSit.setAttribute('rowspan', '2');
    tr1.appendChild(thSit);
    thead.appendChild(tr1);

    // ── Thead linha 2: Est. | A Env. × 4 unidades
    const tr2 = el('tr');
    UNIT_NAMES.forEach((u, i) => {
      const thEst = el('th', {cls: i === 0 ? 'sub-first' : 'sub-first'}, 'Est.');
      const thEnv = el('th', {}, 'A env.');
      tr2.appendChild(thEst);
      tr2.appendChild(thEnv);
    });
    thead.appendChild(tr2);
    table.appendChild(thead);

    // ── Tbody — agrupado por categoria
    const tbody = el('tbody');
    let lastCat = null;
    filtered.forEach(row => {
      // Inserir linha de categoria quando mudar
      const rowCat = row._catOrder || row.category;
      if (rowCat !== lastCat) {
        lastCat = rowCat;
        const catTr = el('tr');
        const catTd = el('td');
        catTd.setAttribute('colspan', String(2 + UNIT_NAMES.length * 2 + 1));
        catTd.style.cssText = 'background:#F5EDD8;color:var(--accent-dark,#1A5229);font-family:Lato,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:7px 10px;border-bottom:1px solid var(--border);border-top:1px solid var(--border)';
        catTd.textContent = rowCat;
        catTr.appendChild(catTd);
        tbody.appendChild(catTr);
      }
      const tr = el('tr');
      // Nome
      const tdName = el('td', {}, row.name);
      tr.appendChild(tdName);
      // Est. CPD
      const tdCpd = el('td');
      tdCpd.textContent = String(row.estCPD);
      if (row.estCPD < row.totalAEnviar) tdCpd.className = 'val-cpd-low';
      tr.appendChild(tdCpd);
      // Por unidade
      UNIT_NAMES.forEach(u => {
        const pu = row.perUnit[u];
        const tdEst = el('td', {cls:'u-sep'});
        const tdEnv = el('td');
        if (pu) {
          // Mostrar estoque sempre; A Enviar: valor se > 0, '—' se 0 (unidade já tem
          // suficiente), 'NC' se ainda não contado nesta janela (não sabemos se é zero
          // de verdade — não mostramos como se a unidade já tivesse o suficiente)
          tdEst.textContent = String(pu.est);
          // 28/07: só mostra "NC" se a unidade também tem mínimo relevante
          // pra esse dia — se ela não precisa enviar nada hoje de qualquer
          // forma (minDia 0), não contar não é motivo de alerta.
          if (pu.contado === false && pu.minDia > 0) {
            tdEnv.textContent = 'NC';
            tdEnv.className = 'val-dash';
            tdEnv.style.color = '#E8A020';
            tdEnv.title = 'Item ainda não contado nesta janela';
          } else if (pu.aEnviar > 0) {
            tdEnv.textContent = String(pu.aEnviar);
            tdEnv.className = 'val-env';
          } else {
            tdEnv.textContent = '\u2014';
            tdEnv.className = 'val-dash';
          }
        } else {
          // Unidade não tem este item no catálogo ou sem mínimo para o dia
          tdEst.textContent = '\u2014';
          tdEst.className = 'val-dash u-sep';
          tdEnv.textContent = '\u2014';
          tdEnv.className = 'val-dash';
        }
        tr.appendChild(tdEst);
        tr.appendChild(tdEnv);
      });
      // Situação
      const tdSit = el('td', {cls:'u-sep'});
      const badgeCls = row.pendente ? 'pendente' : row.situacao;
      const badge = el('span', {cls:'envios-badge ' + badgeCls});
      badge.textContent = row.pendente ? '❓ Pendente' : (row.situacao === 'ok' ? '\u2705 OK' : '\u26A0\uFE0F Falta ' + row.falta);
      if (row.pendente) badge.title = 'Alguma unidade ainda não contou este item — o cálculo pode estar incompleto.';
      tdSit.appendChild(badge);
      tr.appendChild(tdSit);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    tableWrap.appendChild(wrap);

    // ── Versão em cards (mesmos dados de `filtered`, um card por item) ──────
    const cardsWrap = el('div', {cls:'envios-cards'});
    let lastCatCard = null;
    filtered.forEach(row => {
      const rowCat = row._catOrder || row.category;
      if (rowCat !== lastCatCard) {
        lastCatCard = rowCat;
        cardsWrap.appendChild(el('div', {cls:'envios-card-cat-header'}, rowCat));
      }

      const isOpen = row.situacao === 'falta' || row.pendente;
      const card = el('div', {cls:'envios-card' + (row.situacao === 'falta' ? ' falta' : '') + (isOpen ? ' open' : '')});

      const summary = el('div', {cls:'envios-card-summary envios-card-header'});
      summary.appendChild(el('div', {cls:'envios-card-name'}, row.name));
      const rightWrap = el('div', {style:'display:flex;align-items:center;gap:10px'});
      rightWrap.appendChild(el('span', {style:'font-size:11px;color:var(--text-3)'}, 'CPD: ' + row.estCPD));
      const badgeCls = row.pendente ? 'pendente' : row.situacao;
      const badge = el('span', {cls:'envios-badge ' + badgeCls});
      badge.textContent = row.pendente ? '❓ Pendente' : (row.situacao === 'ok' ? '\u2705 OK' : '\u26A0\uFE0F Falta ' + row.falta);
      if (row.pendente) badge.title = 'Alguma unidade ainda não contou este item — o cálculo pode estar incompleto.';
      rightWrap.appendChild(badge);
      rightWrap.appendChild(el('span', {cls:'envios-card-chevron'}, '\u25BE'));
      summary.appendChild(rightWrap);
      summary.addEventListener('click', () => card.classList.toggle('open'));
      card.appendChild(summary);

      const detail = el('div', {cls:'envios-card-detail'});
      const cpdLine = el('div', {cls:'envios-card-cpd' + (row.estCPD < row.totalAEnviar ? ' low' : ''), style:'margin-top:2px'},
        'Est. CPD: ' + row.estCPD + ' \u00B7 Total a enviar: ' + row.totalAEnviar);
      detail.appendChild(cpdLine);

      const unitsWrap = el('div', {cls:'envios-card-units', style:'margin-top:8px'});
      UNIT_NAMES.forEach(u => {
        const pu = row.perUnit[u];
        const uRow = el('div', {cls:'envios-card-unit-row'});
        uRow.appendChild(el('span', {cls:'envios-card-unit-name'}, u));
        const vals = el('div', {cls:'envios-card-unit-vals'});
        if (pu) {
          vals.appendChild(el('span', {cls:'est'}, 'Est. ' + pu.est));
          if (pu.contado === false && pu.minDia > 0) {
            const ncSpan = el('span', {cls:'env dash', style:'color:#E8A020', title:'Item ainda n\u00e3o contado nesta janela'}, 'NC');
            vals.appendChild(ncSpan);
          } else {
            vals.appendChild(el('span', {cls:'env' + (pu.aEnviar > 0 ? '' : ' dash')},
              pu.aEnviar > 0 ? String(pu.aEnviar) : '\u2014'));
          }
        } else {
          vals.appendChild(el('span', {cls:'est'}, '\u2014'));
          vals.appendChild(el('span', {cls:'env dash'}, '\u2014'));
        }
        uRow.appendChild(vals);
        unitsWrap.appendChild(uRow);
      });
      detail.appendChild(unitsWrap);
      card.appendChild(detail);
      cardsWrap.appendChild(card);
    });
    tableWrap.appendChild(cardsWrap);
  }

  // Montar botões de filtro
  [['todos', 'Todos (' + totalItems + ')'],
   ['falta', '\u26A0\uFE0F Falta no CPD (' + totalFaltas + ')'],
   ['ok',    '\u2705 CPD tem estoque (' + totalOk + ')']].forEach(([key, lbl]) => {
    const btn = el('button', {cls:'envios-filter-tab' + (key === activeFilter ? ' active' : '')});
    btn.textContent = lbl;
    btn.addEventListener('click', () => {
      activeFilter = key;
      filterTabs.querySelectorAll('.envios-filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildMatrix();
    });
    filterTabs.appendChild(btn);
  });

  buildMatrix();
  searchInp.addEventListener('input', () => {
    searchQuery = searchInp.value;
    buildMatrix();
  });
  return frag;
}

// ═══ CONTROLE DE VALIDADES ════════════════════════════════════════════════════
function viewValidadeControl() {
  const frag = document.createDocumentFragment();
  const isCP = isCPD();

  // Unidade ativa: CPD usa selector, unidades usam a própria
  let activeValidUnit = isCP ? UNIT_NAMES[0] : (session ? session.unit : UNIT_NAMES[0]);

  // ── Header ────────────────────────────────────────────────────────────────
  const hdrWrap = el('div', {style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px'});
  hdrWrap.appendChild(el('h2', {cls:'table-title'}, 'Controle de Validades'));
  const regBtn = el('button', {cls:'btn btn-sm valid-register-btn', style:'background:var(--accent,#1A5229);color:#fff;margin-left:auto'});
  regBtn.textContent = '+ Registrar Lote';
  hdrWrap.appendChild(regBtn);
  frag.appendChild(hdrWrap);

  // ── Tabs (CPD vê todas as unidades) ───────────────────────────────────────
  const tabsEl = el('div', {cls:'valid-unit-tabs', style: isCP ? '' : 'display:none'});
  const bodyEl = el('div', {});
  frag.appendChild(tabsEl);
  frag.appendChild(bodyEl);

  if (isCP) {
    UNIT_NAMES.forEach(u => {
      const tab = el('button', {cls:'valid-unit-tab' + (u === activeValidUnit ? ' active' : '')});
      tab.textContent = u;
      tab.addEventListener('click', () => {
        activeValidUnit = u;
        tabsEl.querySelectorAll('.valid-unit-tab').forEach(b => b.classList.toggle('active', b.textContent === u));
        renderValidBody();
      });
      tabsEl.appendChild(tab);
    });
  }

  // ── Modal Registrar Lote ──────────────────────────────────────────────────
  regBtn.addEventListener('click', () => {
    const unitForReg = activeValidUnit;
    const ucat = getUnitCatalog(unitForReg).catalog;

    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    const overlay = el('div', {cls:'modal-overlay'});
    const box = el('div', {cls:'modal-box', style:'max-width:420px'});

    const hdr = el('div', {cls:'modal-header'});
    hdr.appendChild(el('div', {cls:'modal-title'}, '+ Registrar Lote — ' + unitForReg));
    const closeX = el('button', {cls:'modal-close'}, '\u00D7');
    closeX.addEventListener('click', () => overlay.remove());
    hdr.appendChild(closeX);
    box.appendChild(hdr);

    const body2 = el('div', {cls:'modal-body', style:'padding:16px 18px;display:flex;flex-direction:column;gap:12px'});

    // Item (autocomplete)
    const itemLabel = el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2)'}, 'Item');
    const itemWrap  = el('div', {style:'position:relative'});
    const itemInp   = el('input', {type:'text', cls:'confirm-name-input', placeholder:'Buscar item...'});
    const itemDrop  = el('div', {style:'position:absolute;top:100%;left:0;right:0;z-index:100;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);max-height:180px;overflow-y:auto;display:none;box-shadow:0 4px 16px rgba(0,0,0,.15)'});
    let selectedItem = null;

    itemInp.addEventListener('input', () => {
      const q = itemInp.value.toLowerCase();
      itemDrop.innerHTML = '';
      if (q.length < 1) { itemDrop.style.display = 'none'; return; }
      const matches = ucat.filter(i => i.name.toLowerCase().includes(q)).slice(0, 20);
      if (!matches.length) { itemDrop.style.display = 'none'; return; }
      matches.forEach(i => {
        const opt = el('div', {style:'padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)'}, i.name);
        opt.addEventListener('mousedown', () => {
          selectedItem = i;
          itemInp.value = i.name;
          unitInp.value = i.unit;
          itemDrop.style.display = 'none';
        });
        opt.addEventListener('mouseover', () => opt.style.background = 'var(--surface-2)');
        opt.addEventListener('mouseout', () => opt.style.background = '');
        itemDrop.appendChild(opt);
      });
      itemDrop.style.display = 'block';
    });
    itemInp.addEventListener('blur', () => setTimeout(() => { itemDrop.style.display = 'none'; }, 150));
    itemWrap.appendChild(itemInp);
    itemWrap.appendChild(itemDrop);
    body2.appendChild(itemLabel);
    body2.appendChild(itemWrap);

    // Quantidade + Unidade
    const qtyRow = el('div', {style:'display:flex;gap:8px'});
    const qtyWrap = el('div', {style:'flex:1'});
    qtyWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Quantidade'));
    const qtyInp = el('input', {type:'number', cls:'confirm-name-input', placeholder:'0', min:'0.01', step:'0.01', style:'width:100%'});
    qtyWrap.appendChild(qtyInp);
    const unitWrap = el('div', {style:'flex:1'});
    unitWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Unidade'));
    const unitInp = el('input', {type:'text', cls:'confirm-name-input', placeholder:'Un', style:'width:100%'});
    unitWrap.appendChild(unitInp);
    qtyRow.appendChild(qtyWrap);
    qtyRow.appendChild(unitWrap);
    body2.appendChild(qtyRow);

    // Data de validade (sem retroativo)
    const dateWrap = el('div');
    dateWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Data de Validade'));
    const dateInp = el('input', {type:'date', cls:'confirm-name-input', style:'width:100%'});
    const today = new Date().toISOString().slice(0,10);
    dateInp.min = today; // trava: não permite data retroativa
    dateWrap.appendChild(dateInp);
    body2.appendChild(dateWrap);

    box.appendChild(body2);

    const errEl = el('div', {style:'padding:0 18px 8px;font-size:12px;color:var(--danger,#A03A3A);display:none'});
    box.appendChild(errEl);

    const ftr = el('div', {cls:'modal-footer'});
