<script>
// \u2500\u2500 iOS: Se aberto pelo app Arquivos (quick look), redireciona para Safari \u2500\u2500
(function() {
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua);
  var isFileProtocol = location.protocol === 'file:';
  
  // Detecta o quick look viewer do iOS (tem limita\u00E7\u00F5es de JS)
  // A forma mais confi\u00E1vel: verificar se localStorage est\u00E1 dispon\u00EDvel
  if (isIOS && isFileProtocol) {
    try {
      localStorage.setItem('_test', '1');
      localStorage.removeItem('_test');
      // localStorage funciona - estamos no Safari, tudo certo
    } catch(e) {
      // localStorage bloqueado = estamos no Quick Look do app Arquivos
      // Mostrar instru\u00E7\u00E3o para abrir no Safari
      document.addEventListener('DOMContentLoaded', function() {
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:#0C1A0F;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;font-family:sans-serif';
        overlay.innerHTML = '<div style="font-size:48px;margin-bottom:20px">\uD83C\uDF55</div>' +
          '<div style="color:#E8F2EA;font-size:22px;font-weight:700;margin-bottom:12px">Sesconetto\'s Estoque</div>' +
          '<div style="color:#5A7A62;font-size:15px;margin-bottom:32px;line-height:1.5">Para usar o app, abra no <strong style="color:#26743E">Safari</strong></div>' +
          '<div style="background:#1A3020;border-radius:12px;padding:20px;max-width:300px;width:100%">' +
          '<div style="color:#A8C4AE;font-size:13px;line-height:1.8;text-align:left">' +
          '1. Toque em <strong style="color:#E8F2EA">\u22EF</strong> (3 pontos) no canto superior direito<br>' +
          '2. Toque em <strong style="color:#E8F2EA">"Abrir com..."</strong><br>' +
          '3. Escolha <strong style="color:#26743E">Safari</strong>' +
          '</div></div>' +
          '<div style="color:#2A4030;font-size:11px;margin-top:24px">ou copie o arquivo para o iCloud Drive<br>e abra pelo Safari</div>';
        document.body.appendChild(overlay);
      });
    }
  }
})();
</script>
<script>
  // window.screen.width retorna pixels f\u00EDsicos no Android (devicePixelRatio > 1),
  // ent\u00E3o normalizamos para pixels l\u00F3gicos (CSS pixels) antes de decidir a escala.
  (function() {
    const dpr = window.devicePixelRatio || 1;
    const physW = window.screen.width;
    const logicalW = Math.round(physW / dpr); // largura em CSS pixels

    let scale = 1.0;

    if (logicalW <= 320) scale = 0.78;      // iPhone SE 1\u00AA gen, Android compacto
    else if (logicalW <= 360) scale = 0.82; // Galaxy S (base), Pixel 6a, Moto G
    else if (logicalW <= 375) scale = 0.83; // iPhone 6/7/8/SE 2\u00AA/3\u00AA
    else if (logicalW <= 390) scale = 0.85; // iPhone 12/13/14 Pro, Pixel 7
    else if (logicalW <= 393) scale = 0.85; // iPhone 14/15, Pixel 8
    else if (logicalW <= 400) scale = 0.86; // Galaxy S22, Pixel 6
    else if (logicalW <= 412) scale = 0.87; // Pixel 6 Pro, Galaxy S21+
    else if (logicalW <= 414) scale = 0.88; // iPhone 8 Plus, XR, 11
    else if (logicalW <= 420) scale = 0.88; // Galaxy S23+, OnePlus
    else if (logicalW <= 430) scale = 0.90; // iPhone 14/15 Pro Max
    else if (logicalW <= 448) scale = 0.90; // Galaxy S23 Ultra, Pixel Fold (fechado)
    else if (logicalW <= 480) scale = 0.92; // tablets pequenos, Android landscape
    else if (logicalW <= 600) scale = 0.95; // tablets 7" e Android landscape grande
    // acima de 600px = tablet/desktop, escala 1.0

    const meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = `width=device-width, initial-scale=${scale}, maximum-scale=1.0, user-scalable=no, viewport-fit=cover`;
    document.head.appendChild(meta);
  })();
</script>
<title>Estoque — Sesconetto's Pizzeria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Touch global: elimina delay de 300ms em todo o app ─────────────────── */
  html { touch-action: manipulation; }
  button, [role="button"], input, select, a {
    touch-action: manipulation;   /* sem double-tap zoom nos controles */
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* Remove native number spinners */
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  :root {
    /* Sesconetto's brand — Projeto C: premium editorial (trattoria italiana) */
    --accent: #1A5229;
    --accent-light: #E8F0E5;
    --accent-dark: #123D1E;
    --accent-hover: #164924;
    --gold: #B8922A;
    --gold-light: #F5EDD8;

    --sidebar-bg: #1A5229;
    --sidebar-border: #2A6238;
    --sidebar-text: #CFE4D2;
    --sidebar-label: #8FBF9C;
    --sidebar-active-bg: #F5EDD8;
    --sidebar-active: #1A5229;

    --bg: #F7F2E4;
    --bg-2: #EFE7D0;
    --surface: #FFFEFA;
    --surface-2: #F9F4E6;
    --border: #E0D8BC;
    --border-light: #EFE9D5;

    --text: #1A1A12;
    --text-2: #6B6448;
    --text-3: #726D4F;
    --text-inv: #F7F2E4;

    --success: #1A5229;
    --success-bg: #E8F0E5;
    --warning: #8A6A10;
    --warning-bg: #FBF3DC;
    --danger: #A03A3A;
    --danger-bg: #FBEAEA;

    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(26,82,41,.08), 0 0 0 1px rgba(26,82,41,.04);
  }

  body {
    font-family: 'Lato', 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* SIDEBAR */
  #sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    border-right: 1px solid var(--sidebar-border);
  }

  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--sidebar-border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--gold-light);
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
  }

  .logo-label {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    color: #E8F2EA;
    letter-spacing: 0.2px;
    line-height: 1.2;
    display: block;
  }

  .logo-sub {
    font-size: 10px;
    color: var(--sidebar-label);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-top: 2px;
    display: block;
  }

  .nav-section {
    padding: 16px 12px 8px;
  }

  .nav-label {
    font-size: 10px;
    color: var(--sidebar-label);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    padding: 0 10px;
    margin-bottom: 4px;
    display: block;
    font-weight: 700;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--sidebar-text);
    font-size: 13.5px;
    transition: background 0.15s, color 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: 'Lato', sans-serif;
  }

  .nav-item:hover { background: rgba(255,255,255,.05); color: #C8E8CE; }
  .nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active); font-weight: 700; }
  .nav-item svg { flex-shrink: 0; }

  .sidebar-footer {
    margin-top: auto;
    padding: 14px 20px;
    border-top: 1px solid var(--sidebar-border);
    font-size: 10px;
    color: var(--sidebar-label);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* MAIN */
  #main {
    margin-left: 220px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .topbar-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }

  .topbar-date {
    font-size: 12px;
    color: var(--text-3);
  }

  .content {
    padding: 28px 32px;
    flex: 1;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }

  /* CARDS */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .metric-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .metric-label {
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .metric-value {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    line-height: 1;
    color: var(--text);
  }

  .metric-value.success { color: var(--success); }
  .metric-value.danger { color: var(--danger); }
  .metric-value.accent { color: var(--accent); }

  /* TABLE */
  .table-wrap {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .table-header {
    padding: 14px 18px;
    border-bottom: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface-2);
  }

  .table-title {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    background: var(--surface-2);
    padding: 10px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1.5px solid var(--border);
  }

  tbody tr { border-bottom: 1px solid var(--border-light); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #F8F6EF; }

  td {
    padding: 11px 16px;
    font-size: 13px;
    color: var(--text);
  }

  td.muted { color: var(--text-3); }

  /* Collapsible category header */
  .cat-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 16px; /* +3px para área de toque maior */
    min-height: 48px;   /* mínimo recomendado para touch */
    background: #F5EDD8;
    border: none;
    border-bottom: 1.5px solid var(--border);
    cursor: pointer;
    font-family: 'Lato', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--accent-dark);
    text-align: left;
    transition: background .12s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .cat-toggle:hover { background: #DDF0E3; }
  .cat-toggle .cat-chevron {
    margin-left: auto;
    font-size: 10px;
    color: var(--accent);
    transition: transform .2s;
    display: inline-block;
  }
  .cat-toggle.open .cat-chevron { transform: rotate(180deg); }

  /* Barra de progresso de contagem por categoria */
  .cat-progress-track {
    width: 54px; height: 6px; border-radius: 3px; background: var(--border);
    overflow: hidden; flex-shrink: 0; margin-left: 8px;
  }
  .cat-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
  .cat-progress-fill.complete { background: var(--success); }

  .catalogo-fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 500;
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 26px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 14px rgba(26,82,41,.35);
    touch-action: manipulation;
  }
  .catalogo-fab:hover { background: var(--accent-hover); }

  /* Janelas de contagem — cores no cabeçalho de categoria (unidades) */
  .cat-toggle.janela-aberta {
    background: rgba(56, 161, 105, 0.14);
    border-left: 3px solid var(--success, #1A5229);
    color: var(--success, #1A5229);
  }
  .cat-toggle.janela-aberta .cat-count { color: #1A5229; font-weight: 700; }
  .cat-toggle.janela-fechada {
    background: rgba(214, 158, 46, 0.10);
    border-left: 3px solid #D69E2E;
  }
  .cat-toggle.janela-fechada .cat-count { color: #975A16; }

  /* Banner de atualização disponível */
  #update-banner { animation: slideUp .3s ease; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: .5; transform: scale(.85); }
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  /* ── Tela de carregamento ─────────────────────────────────────────────────── */
  #loading-gate {
    position: fixed; inset: 0; z-index: 2000;
    background: var(--sidebar-bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    transition: opacity .4s ease;
  }
  #loading-gate.hiding {
    opacity: 0;
    pointer-events: none;
  }
  .loading-logo {
    width: 64px; height: 64px;
    background: var(--gold-light);
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
    animation: loadPulse 1.8s ease-in-out infinite;
  }
  @keyframes loadPulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 8px 32px rgba(42,96,73,.3); }
    50%       { transform: scale(1.06); box-shadow: 0 12px 40px rgba(42,96,73,.6); }
  }
  .loading-bar-wrap {
    width: 200px; height: 3px;
    background: rgba(255,255,255,.1);
    border-radius: 99px; overflow: hidden;
  }
  .loading-bar {
    height: 100%; width: 0%;
    background: var(--accent, #1A5229);
    border-radius: 99px;
    transition: width .3s ease;
  }
  .loading-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,.45);
    letter-spacing: .4px;
    min-height: 18px;
    transition: opacity .2s;
  }
  .loading-steps {
    display: flex; gap: 6px; align-items: center;
  }
  .loading-step {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,.15);
    transition: background .3s ease, transform .2s ease;
  }
  .loading-step.done    { background: #1A5229; }
  .loading-step.active  { background: #68D391; transform: scale(1.3); }
  .loading-step.error   { background: #FC8181; }

  /* ── Quadro de Produção ─────────────────────────────────────────────────── */
  .qp-day-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .qp-day-tab {
    padding:5px 14px; border-radius:20px; font-size:12px; font-weight:600;
    cursor:pointer; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text-2); transition:all .15s;
    touch-action:manipulation;
  }
  .qp-day-tab.active { background:var(--accent,#1A5229); color:#fff !important; border-color:var(--accent,#1A5229); }
  .qp-day-tab.today { border-color:var(--accent,#1A5229); color:var(--accent,#1A5229); font-weight:700; }
  .qp-day-tab.active.today { background:var(--accent,#1A5229); color:#fff !important; }
  .qp-area-hdr {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:#F5EDD8;
    border:1.5px solid rgba(42,145,72,.3);
    border-radius:var(--radius) var(--radius) 0 0;
    font-weight:700; font-size:13px; color:var(--accent-dark,#1A5229);
    flex-wrap:wrap; gap:8px;
  }
  .qp-area-hdr .qp-area-name { display:flex; align-items:center; gap:8px; }
  .qp-area-badge {
    font-size:11px; padding:2px 8px; border-radius:10px;
    background:rgba(42,145,72,.15); color:var(--accent-dark,#1A5229);
    font-weight:600;
  }
  .qp-table { width:100%; border-collapse:separate; border-spacing:0 8px; }
  .qp-table th {
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    color:var(--text-3); padding:8px 12px; text-align:left;
    background:transparent; border-bottom:none;
  }
  .qp-table th.center { text-align:center; }
  .qp-table td {
    padding:12px; border-bottom:none; background:var(--surface);
    vertical-align:middle; font-size:13px; color:var(--text);
  }
  .qp-table td:first-child { border-radius:var(--radius) 0 0 var(--radius); border-left:1.5px solid var(--border); border-top:1.5px solid var(--border); border-bottom:1.5px solid var(--border); }
  .qp-table td:last-child  { border-radius:0 var(--radius) var(--radius) 0; border-right:1.5px solid var(--border); border-top:1.5px solid var(--border); border-bottom:1.5px solid var(--border); }
  .qp-table td:not(:first-child):not(:last-child) { border-top:1.5px solid var(--border); border-bottom:1.5px solid var(--border); }
  .qp-table tr.qp-precisa td { background:var(--warning-bg); }
  .qp-table tr.qp-precisa td:first-child { border-left-color:#D6A017; border-top-color:#D6A017; border-bottom-color:#D6A017; }
  .qp-table tr.qp-precisa td:last-child  { border-right-color:#D6A017; border-top-color:#D6A017; border-bottom-color:#D6A017; }
  .qp-item-name { font-weight:500; }
  .qp-rendimento { font-size:11px; color:var(--text-3); margin-top:2px; }
  .qp-lotes-cell { display:flex; align-items:center; gap:6px; justify-content:center; }
  .qp-qty-btn {
    width:26px; height:26px; border-radius:6px;
    border:1.5px solid var(--border); background:var(--surface);
    color:var(--text); font-size:14px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .1s; touch-action:manipulation;
  }
  .qp-qty-btn:hover { border-color:var(--accent); color:var(--accent); }
  .qp-qty-input {
    width:48px; text-align:center;
    background:var(--surface-2); border:1.5px solid var(--border);
    color:var(--text); font-size:14px; font-weight:700;
    padding:4px; border-radius:6px;
  }
  .qp-qty-input:focus { outline:none; border-color:var(--accent); }
  .qp-sugestao {
    font-size:11px; color:var(--accent-dark,#1A5229); font-weight:600;
    white-space:nowrap; cursor:pointer;
  }
  .qp-sugestao:hover { text-decoration:underline; }
  .qp-sugestao.zero { color:var(--text-3); font-weight:400; cursor:default; }
  .qp-cobertura-sel {
    font-size:11px; padding:3px 6px; border-radius:4px;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-2); cursor:pointer;
  }
  .qp-status-btn {
    padding:5px 12px; border-radius:6px; font-size:12px; font-weight:700;
    border:1.5px solid var(--border); background:var(--surface); color:var(--text-3);
    cursor:pointer; white-space:nowrap; transition:all .15s; touch-action:manipulation;
  }
  .qp-status-btn.liberado { background:#F5EDD8; color:var(--accent-dark,#1A5229); border-color:var(--accent,#1A5229); }
  .qp-status-btn.disabled { opacity:.4; cursor:not-allowed; pointer-events:none; }
  .qp-liberar-all {
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700;
    background:var(--accent,#1A5229); color:#fff; border:none; cursor:pointer;
    touch-action:manipulation; transition:opacity .15s;
  }
  .qp-liberar-all:hover { opacity:.88; }
  .qp-insumos { font-size:11px; color:var(--text-3); line-height:1.7; }
  .qp-insumos b { color:var(--text-2); }
  .qp-insumos .emb { color:var(--accent-dark,#1A5229); }
  .qp-obs-input {
    width:100%; font-size:12px; padding:5px 8px;

    background:var(--surface); color:var(--text); resize:none;
  }

  .qp-sem-necessidade {
    display:inline-flex; align-items:center; gap:4px;

  }

    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:var(--surface-2);

  }
  .qp-footer-info { font-size:11px; color:var(--text-3); }
  .qp-masseiro-grid {

  }

  .qp-masseiro-card {
    background:var(--surface-2); border-radius:var(--radius);
    border:1px solid var(--border); padding:12px;
  }
  .qp-masseiro-title {
    font-size:11px; font-weight:700; text-transform:uppercase;
    color:var(--accent-dark,#1A5229); letter-spacing:.5px; margin-bottom:10px;
  }
  .qp-masseiro-row {
    display:flex; align-items:center; justify-content:space-between;

  }
  .qp-masseiro-input {
    width:72px; text-align:center; padding:5px;

  }
  .qp-masseiro-input:focus { outline:none; border-color:var(--accent); }
  .qp-masseiro-calc { font-size:11px; color:var(--text-3); margin-top:8px; }

  /* ── Controle de Validades ─────────────────────────────────────────────── */
  .valid-unit-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .valid-unit-tab {
    padding:5px 14px; border-radius:20px; font-size:12px; font-weight:600;
    cursor:pointer; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text-2); transition:all .15s;
    touch-action:manipulation;
  }
  .valid-unit-tab.active { background:var(--accent,#1A5229); color:#fff; border-color:var(--accent,#1A5229); }
  .valid-empty { padding:28px; text-align:center; color:var(--text-3); font-size:13px; }
  .valid-register-btn { margin-bottom:16px; }
  /* Tabela de validade estilo contagem */
  .valid-table { width:100%; border-collapse:collapse; }
  .valid-table {width:100%;border-collapse:collapse;table-layout:fixed;}
  .valid-table thead th {
    font-family:'Lato',sans-serif; font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px; color:var(--text-3);
    padding:8px 10px; background:var(--surface-2);
    border-bottom:1.5px solid var(--border);
  }
  .valid-table tbody td {
    padding:7px 10px; font-size:13px; color:var(--text);
    border-bottom:1px solid var(--border); vertical-align:middle;
    overflow:hidden; text-overflow:ellipsis;
  }
  .valid-table tbody tr:last-child td { border-bottom:none; }
  .valid-table tbody tr:nth-child(even) td { background:var(--surface-2); }
  /* Cat header dentro da tabela */
  .valid-cat-row td {
    padding:7px 10px; font-family:'Lato',sans-serif; font-size:10px;
    font-weight:700; text-transform:uppercase; letter-spacing:.7px;
    background:#F5EDD8; color:var(--accent-dark,#1A5229);
    border-bottom:1px solid var(--border); border-top:1.5px solid var(--border);
  }
  /* Status dot na coluna de dias */
  .valid-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .valid-dot.expired { background:#A03A3A; }
  .valid-dot.alert   { background:#C07A00; }
  .valid-dot.ok      { background:#1A5229; }
  .valid-date-text.expired { color:#A03A3A; font-weight:700; }
  .valid-date-text.alert   { color:#C07A00; font-weight:700; }
  .valid-date-text.ok      { color:#1A5229; }
  .valid-lote-consume {
    width:28px; height:28px; border-radius:50%; border:1.5px solid var(--border);
    background:var(--surface); cursor:pointer; display:flex; align-items:center;
    justify-content:center; font-size:13px; flex-shrink:0;
    transition:all .15s; touch-action:manipulation;
  }
  .valid-lote-consume:hover { background:#F5EDD8; border-color:#1A5229; }

  /* ── Histórico de Contagens ─────────────────────────────────────────────── */
  .hist-unit-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .hist-unit-tab {
    padding:5px 14px; border-radius:20px; font-size:12px; font-weight:600;
    cursor:pointer; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text-2); transition:all .15s;
    touch-action:manipulation;
  }
  .hist-unit-tab.active { background:var(--accent,#1A5229); color:#fff; border-color:var(--accent,#1A5229); }
  .hist-list { display:flex; flex-direction:column; gap:6px; margin-bottom:20px; }
  .hist-entry {
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:var(--radius); cursor:pointer; transition:border-color .12s;
  }
  .hist-entry:hover { border-color:var(--accent,#1A5229); }
  .hist-entry.selected { border-color:var(--accent,#1A5229); background:#F5EDD8; }
  .hist-entry-check {
    width:18px; height:18px; border-radius:4px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:var(--surface); transition:all .12s;
  }
  .hist-entry.selected .hist-entry-check {
    background:var(--accent,#1A5229); border-color:var(--accent,#1A5229); color:#fff;
  }
  .hist-entry-date { font-weight:700; font-size:13px; color:var(--text); min-width:90px; }
  .hist-entry-time { font-size:12px; color:var(--text-3); min-width:50px; }
  .hist-entry-who  { font-size:12px; color:var(--text-2); flex:1; }
  .hist-entry-count { font-size:11px; color:var(--text-3); }
  .hist-compare-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border:1.5px solid var(--border); border-radius:var(--radius); }
  .hist-compare-table { width:100%; border-collapse:collapse; min-width:500px; font-size:12px; }
  .hist-compare-table th {
    background:var(--surface-2); color:var(--text-3); font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:.4px; padding:8px 10px;
    text-align:left; border-bottom:1.5px solid var(--border); white-space:nowrap;
  }
  .hist-compare-table th.num { text-align:center; }
  .hist-compare-table td { padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .hist-compare-table tr:last-child td { border-bottom:none; }
  .hist-compare-table tr:nth-child(even) td { background:var(--surface-2); }
  .hist-compare-table td.num { text-align:center; font-weight:600; }
  .hist-compare-table td.zero { color:var(--danger,#A03A3A); }
  .hist-cat-row td { background:#F5EDD8 !important; color:var(--accent-dark,#1A5229); font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .hist-actions { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .hist-empty { padding:32px; text-align:center; color:var(--text-3); font-size:13px; }

  /* ── Modal genérico ─────────────────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 3000;
    background: rgba(0,0,0,.48);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: 0 8px 40px rgba(0,0,0,.28); overflow: hidden;
    width: 100%; max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    background: var(--surface-2); flex-shrink: 0;
  }
  .modal-title { font-weight: 700; font-size: 15px; color: var(--text); }
  .modal-close {
    background: none; border: none; font-size: 20px; line-height: 1;
    color: var(--text-3); cursor: pointer; padding: 0 4px;
    transition: color .12s;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body {
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    flex: 1; padding: 4px 0;
  }
  .modal-footer {
    padding: 12px 18px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px;
    background: var(--surface-2); flex-shrink: 0;
  }
  .dash-section-head {
    padding: 8px 18px 4px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .4px;
  }
  .dash-detail-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 18px; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .dash-detail-row:last-child { border-bottom: none; }
  .dash-detail-name { flex: 1; color: var(--text); }
  .dash-detail-qty  { font-weight: 700; min-width: 28px; text-align: right; }
  .dash-detail-min  { font-size: 11px; color: var(--text-3); }
  .dash-detail-unit { font-size: 11px; color: var(--text-3); min-width: 40px; }

  /* ── Confirmação de Contagem ───────────────────────────────────────────── */
  .cat-confirm-btn {
    flex: 0 0 auto; align-self: center;
    padding: 4px 10px; font-size: 11px; font-weight: 700;
    border-radius: 20px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text-3);
    cursor: pointer; white-space: nowrap;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: all .15s;
  }
  .cat-confirm-btn:hover { border-color: #1A5229; color: #1A5229; }
  .cat-confirm-btn.confirmed {
    background: rgba(42,145,72,.12); color: #1A5229;
    border-color: #1A5229;
  }
  .cat-confirm-btn.needs-reconfirm {
    background: rgba(200,150,0,.12); color: #975A16;
    border-color: #C89600;
    animation: pulse-warn 2s infinite;
  }
  @keyframes pulse-warn {
    0%,100% { opacity:1; } 50% { opacity:.65; }
  }
  .cat-pdf-btn-blocked { opacity:.35; pointer-events:none; cursor:not-allowed; }
  .confirm-modal-overlay {
    position:fixed;inset:0;z-index:3500;
    background:rgba(0,0,0,.5);display:flex;
    align-items:center;justify-content:center;padding:16px;
  }
  .confirm-modal-box {
    background:var(--surface);border-radius:var(--radius);
    padding:0;min-width:290px;max-width:340px;width:100%;
    box-shadow:0 8px 32px rgba(0,0,0,.3);overflow:hidden;
  }
  .confirm-modal-hdr {
    padding:14px 18px;border-bottom:1px solid var(--border);
    background:#F5EDD8;
  }
  .confirm-modal-title { font-weight:700;font-size:14px;color:var(--accent-dark,#1A5229); }
  .confirm-modal-sub   { font-size:11px;color:var(--text-3);margin-top:2px; }
  .confirm-modal-body  { padding:16px 18px; }
  .confirm-modal-label { font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px; }
  .confirm-name-input  {
    width:100%;height:38px;padding:0 12px;
    border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:14px;color:var(--text);background:var(--surface);
    outline:none;transition:border-color .12s;
  }
  .confirm-name-input:focus { border-color:var(--accent,#1A5229); }
  .confirm-modal-ftr {
    padding:12px 18px;border-top:1px solid var(--border);
    display:flex;gap:8px;justify-content:flex-end;
  }

  /* ── Painel Envios do Dia ───────────────────────────────────────────────── */
  .envios-wrap { border: 1.5px solid var(--border); border-radius: var(--radius); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .envios-matrix { width: 100%; border-collapse: collapse; min-width: 680px; }
  .envios-matrix th, .envios-matrix td { padding: 7px 10px; text-align: center; vertical-align: middle; font-size: 12px; }
  .envios-matrix thead tr:first-child th { background: var(--surface-2); color: var(--text-3); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1.5px solid var(--border); }
  .envios-matrix thead tr:first-child th:first-child { text-align: left; }
  .envios-matrix thead tr:first-child th.unit-hdr { background: #F5EDD8; color: var(--accent-dark, #1A5229); border-left: 1.5px solid var(--border); }
  .envios-matrix thead tr:nth-child(2) th { background: var(--surface-2); color: var(--text-3); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1.5px solid var(--border); }
  .envios-matrix thead tr:nth-child(2) th.sub-first { border-left: 1.5px solid var(--border); }
  .envios-matrix tbody td { border-bottom: 1px solid var(--border); color: var(--text); }
  .envios-matrix tbody td:first-child { text-align: left; font-weight: 500; }
  .envios-matrix tbody tr:last-child td { border-bottom: none; }
  .envios-matrix tbody tr:nth-child(even) td { background: var(--surface-2); }
  .envios-matrix .u-sep { border-left: 1.5px solid var(--border); }
  .envios-matrix .val-env { font-weight: 700; color: var(--accent-dark, #1A5229); }
  .envios-matrix .val-dash { color: var(--text-3); }
  .envios-matrix .val-cpd-low { font-weight: 700; color: #A03A3A; }
  .envios-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .envios-badge.ok    { background: rgba(26,82,41,.12); color: #1A5229; }
  .envios-badge.falta { background: rgba(160,58,58,.12);  color: #A03A3A; }
  .envios-badge.pendente { background: rgba(232,160,32,.14); color: #B8740D; }
  .envios-summary-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .envios-summary-card { flex: 1; min-width: 110px; padding: 12px 16px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); text-align: center; }
  .envios-summary-card .e-lbl { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .envios-summary-card .e-val { font-size: 26px; font-weight: 700; margin-top: 4px; color: var(--text); }
  .envios-summary-card.ok    .e-val { color: #1A5229; }
  .envios-summary-card.falta .e-val { color: #A03A3A; }
  .envios-filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .envios-filter-tab { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-2); transition: all .15s; touch-action: manipulation; }
  .envios-filter-tab.active { background: var(--accent, #1A5229); color: #fff; border-color: var(--accent, #1A5229); }

  /* ── Envios do Dia: cards colapsáveis (mobile e desktop) ──────────────
     Cada item vira um card que expande sob demanda pro detalhe por
     unidade — itens com falta já vêm abertos, os OK ficam fechados.
     Padrão: mobile mostra cards, desktop mostra a matriz densa. Durante
     uma busca ativa (.envios-searching), força os cards em qualquer
     tamanho de tela — é o formato mais fácil de ler um resultado único. */
  .envios-cards { display: flex; flex-direction: column; gap: 10px; }
  .envios-wrap { display: none; }
  @media (min-width: 600px) {
    .envios-wrap { display: block; }
    .envios-cards { display: none; }
  }
  .envios-searching .envios-wrap  { display: none !important; }
  .envios-searching .envios-cards { display: flex !important; }
  .envios-card-summary { cursor: pointer; touch-action: manipulation; }
  .envios-card-detail { display: none; }
  .envios-card.open .envios-card-detail { display: block; }
  .envios-card-chevron { transition: transform .2s; display: inline-block; font-size: 11px; color: var(--text-3); }
  .envios-card.open .envios-card-chevron { transform: rotate(180deg); }
  .envios-card-cat-header {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
    color: var(--accent-dark, #1A5229); background: #F5EDD8; padding: 7px 10px;
    border-radius: 6px; margin: 4px 0 2px;
  }
  .envios-card {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px;
  }
  .envios-card.falta { border-color: #E0A0A0; }
  .envios-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .envios-card-name { font-weight: 600; font-size: 14px; color: var(--text); }
  .envios-card-cpd { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .envios-card-cpd.low { color: #A03A3A; font-weight: 700; }
  .envios-card-units { display: flex; flex-direction: column; }
  .envios-card-unit-row {
    display: flex; justify-content: space-between; align-items: center; font-size: 12.5px;
    padding: 6px 0; border-top: 1px solid var(--border-light);
  }
  .envios-card-unit-row:first-child { border-top: none; }
  .envios-card-unit-name { color: var(--text-2); font-weight: 500; }
  .envios-card-unit-vals { display: flex; gap: 12px; align-items: baseline; }
  .envios-card-unit-vals .est { color: var(--text-3); font-size: 11px; }
  .envios-card-unit-vals .env { font-weight: 700; color: var(--accent-dark, #1A5229); min-width: 18px; text-align: right; }
  .envios-card-unit-vals .env.dash { color: var(--text-3); font-weight: 400; }
  .envios-dia-day-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; background: #F5EDD8; color: var(--accent-dark, #1A5229); border: 1px solid var(--accent, #1A5229); }


  /* Botão confirmar item */
  .confirm-btn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; min-width: 30px;
    border-radius: 50%; border: 2px solid var(--border);
    background: transparent; cursor: pointer; font-size: 14px;
    transition: all .15s ease; color: var(--text-3);
  }
  .confirm-btn:hover { border-color: var(--accent); color: var(--accent); }
  .confirm-btn.confirmed-ok     { background: rgba(26,82,41,.18); border-color: #1A5229; color: #1A5229; }
  .confirm-btn.confirmed-warn   { background: rgba(214,158,46,.18); border-color: #D69E2E; color: #975A16; }
  .confirm-btn.confirmed-danger { background: rgba(160,58,58,.18);  border-color: #A03A3A; color: #7A2C2C; }

  /* Linha confirmada: cor de fundo suave */
  tr.count-ok     { background: rgba(26,82,41,.08) !important; }
  tr.count-warn   { background: rgba(214,158,46,.10) !important; }
  tr.count-danger { background: rgba(160,58,58,.10)  !important; }
  .cat-toggle .cat-count {
    font-weight: 400;
    color: var(--accent);
    font-size: 10px;
    margin-left: 4px;
    text-transform: none;
    letter-spacing: 0;
    opacity: 0.7;
  }

  /* Category row stretches full width */
  .cat-row { background: none; }
  .cat-row:hover { background: none !important; }
  .cat-row > td { padding: 0 !important; border: none; }
  .cat-toggle { box-sizing: border-box; width: 100%; }
  .cat-toggle.janela-aberta  { background: rgba(34,139,34,.10); border-left: 4px solid #1A5229; color: #1e7a38; }
  .cat-toggle.janela-fechada { background: rgba(200,150,0,.08); border-left: 4px solid #C89600; color: #8a6500; }
  .cat-toggle.janela-aberta .cat-count  { color: #1A5229 !important; }
  .cat-toggle.janela-fechada .cat-count { color: #C89600 !important; }
  .confirm-btn { flex:0 0 auto; width:32px; height:32px; border-radius:50%; border:2px solid var(--border); background:transparent; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .18s; }
  .confirm-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .confirm-btn:disabled  { opacity:0.4; cursor:default; }

  .qty-controls { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
  .qty-btn-sm {
    width: 26px; height: 26px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    font-size: 16px; font-weight: 500;
    cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    /* Sem transition no active — feedback tátil instantâneo */
    transition: border-color .12s, color .12s, background .12s;
    flex-shrink: 0;
    user-select: none;
    /* Área de toque maior que o visual (padding invisível) */
    position: relative;
  }
  .qty-btn-sm::before {
    content: '';
    position: absolute;

  db.ref('.info/connected').on('value', snap => {
    const isConnected = snap.val() === true;
    const badge = document.getElementById('conn-badge');
    if (!badge) return;

    const dot   = document.getElementById('conn-dot');
    const label = document.getElementById('conn-label');
    if (isConnected) {
      badge.style.display = 'flex';
      badge.style.cssText += ';background:rgba(26,82,41,.15);color:#1A5229;border-color:rgba(26,82,41,.3)';
      if (dot)   { dot.style.background = '#1A5229'; dot.style.animation = 'pulse 1s infinite'; }
      if (label) label.textContent = 'CONECTADO';
      clearTimeout(window._connHideTimer);
      window._connHideTimer = setTimeout(() => { badge.style.display = 'none'; }, 2000);

      // Reconectou — processar writes pendentes imediatamente
      if (window._fb && (window._fb.pendingWrites || []).length > 0) {
        console.log('[Firebase] Reconectado — sincronizando', window._fb.pendingWrites.length, 'writes pendentes');
        setTimeout(_flushPendingWrites, 500); // pequeno delay para estabilizar conexão
      }
    } else {
      clearTimeout(window._connHideTimer);
      badge.style.display = 'flex';
      badge.style.cssText += ';background:rgba(160,58,58,.15);color:#A03A3A;border-color:rgba(160,58,58,.3)';
      if (dot)   { dot.style.background = '#A03A3A'; dot.style.animation = 'none'; }
      if (label) label.textContent = 'SEM CONEXÃO';
      console.warn('[Firebase] Conexão perdida — dados em modo offline');
    }
  });

  // Compara versões tipo "1.5.12" numericamente por partes (evita bug de comparação
  // de string, onde "1.5.12" > "1.5.9" dá FALSO porque '1' < '9' no 3º caractere)
  function _compareVersions(a, b) {
    const pa = String(a).split('.').map(n => parseInt(n, 10) || 0);
    const pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      const diff = (pa[i] || 0) - (pb[i] || 0);
      if (diff !== 0) return diff;
    }
    return 0;
  }
  window._compareVersions = _compareVersions;

  // Publicar versão do app — qualquer dispositivo com versão mais recente atualiza
  setTimeout(() => {
    if (!window._APP_VERSION) return;
    db.ref('dados/pizza_app_version').once('value').then(snap => {
      const stored = snap.val();
      if (!stored || _compareVersions(window._APP_VERSION, stored) > 0) {
        db.ref('dados/pizza_app_version').set(window._APP_VERSION)
          .then(() => console.log('[App] Versão ' + window._APP_VERSION + ' publicada'))
          .catch(e => console.warn('[App] Erro ao publicar versão:', e));
      }
    });
  }, 4000); // aguarda listeners inicializarem

  // ═══ LISTENERS SEPARADOS POR SUBNÓ (Fase 3) ════════════════════════════════
  // Cada dispositivo ouve apenas o que precisa — sem receber o banco inteiro
  // a cada mudança de qualquer outro dispositivo.

  // Helper: throttle de render para updates externos (compartilhado por todos os listeners)
  function _scheduleRender() {
    if (!session || window._fb.localWrite) return;
    clearTimeout(window._fb.renderThrottleTimer);
    window._fb.renderThrottleTimer = setTimeout(() => {
      if (!session || window._fb.localWrite) return;
      const hasRows = document.querySelectorAll('tr[data-item-id]').length > 0;
      if (hasRows && (currentView === 'cpd' || currentView === 'units')) {
        try {
          if (currentView === 'cpd') {
            patchStockValues(cpd, false, {});
          } else {
            const ustock = unitStock[activeUnit] || {};
            patchStockValues(ustock, false, {});
            if (isCPD()) patchUnitReadValues(ustock, activeUnit);
          }
          return;
        } catch(e) { console.warn('[Render] Patch falhou:', e); }
      }
      render();
    }, 800);
  }

  // ── 1. CATÁLOGO CPD (ouvir sempre — qualquer sessão pode precisar) ─────────
  db.ref('dados/pizza_catalog').on('value', snap => {
    const fbCatalog = snap.val();
    const fbCatalogLen = Array.isArray(fbCatalog) ? fbCatalog.length : 0;

    if (typeof catalog === 'undefined') return;

    // Migração de versão
    const CATALOG_VER = 'v15'; // catálogos independentes
    const APP_VERSION = '1.5.29'; // 28/07: corrige bug no botão "Adicionar item" da tela de Catálogo — para catálogo de UNIDADE (não CPD), o item novo era salvo só no localStorage do aparelho, nunca chegava no Firebase (a chave usada não estava na lista de sincronização). Agora usa saveUnitCatalog(), que grava de verdade. Também corrige a referência de catálogo usada: antes pegava o catálogo da unidade LOGADA (podia ser diferente da aba que o CPD estava editando), agora usa sempre o catálogo da aba ativa
    window._APP_VERSION = APP_VERSION;

    if (fbCatalogLen === 0) {
      // Banco vazio — primeira execução
      const catToSend = SEED_CATALOG.length > 0 ? SEED_CATALOG : catalog;
      if (catToSend.length > 0) {
        db.ref('dados/pizza_catalog').set(catToSend)
          .then(() => db.ref('dados/pizza_catalog_ver').set(CATALOG_VER))
          .catch(e => console.error('[Firebase] Erro catálogo inicial:', e));
        catalog.length = 0; catToSend.forEach(i => catalog.push(i));
        if (typeof _ensureItemKeys === 'function') _ensureItemKeys(catalog);
      }
    } else {
      catalog.length = 0; fbCatalog.forEach(i => catalog.push(i));
      if (typeof _ensureItemKeys === 'function') _ensureItemKeys(catalog);
      saveLocal('pizza_catalog', catalog);
      console.log('[Firebase] Catálogo CPD carregado:', fbCatalog.length, 'itens');
      _gateStep('catalog', 'Catálogo carregado…');
    }
  });

  // ── 2. CATÁLOGO UNIDADES ────────────────────────────────────────────────────
  // Catálogos por unidade: cada unidade tem seu próprio nó no Firebase
  // dados/pizza_unit_catalog/asa_sul, /sig, /vicente_pires, /delivery
  // O seed de cada unidade é empurrado automaticamente na primeira abertura
  const _unitSlugMap = {
    'Asa Sul': 'asa_sul', 'SIG': 'sig',
    'Vicente Pires': 'vicente_pires', 'Delivery': 'delivery'
  };
  Object.entries(_unitSlugMap).forEach(([unitName, slug]) => {
    db.ref('dados/pizza_unit_catalog/' + slug).on('value', snap => {
      if (!window._fb.ready) return;
      const val = snap.val();
      // Se é o catálogo da unidade logada, atualizar unitCatalog global
      // Guardar catálogo recebido em cache por slug (independente de sessão)
      if (val && Array.isArray(val) && val.length > 0) {
        if (typeof _ensureItemKeys === 'function') _ensureItemKeys(val);
        if (!window._unitCatalogCache) window._unitCatalogCache = {};
        window._unitCatalogCache[slug] = val;
        try { localStorage.setItem('pizza_unit_catalog_' + slug, JSON.stringify(val)); } catch(e) {}
        // Se é a unidade logada, atualizar unitCatalog imediatamente
        // Usar localStorage para verificar sessão (session pode não existir no bloco Firebase)
        const _sess = (typeof session !== 'undefined' && session) ||
          (() => { try { return JSON.parse(localStorage.getItem('pizza_session')); } catch(e) { return null; } })();
        if (_sess && unitSlug(_sess.unit) === slug) {
          if (typeof unitCatalog !== 'undefined') unitCatalog = val;
          if (typeof _scheduleRender === 'function') _scheduleRender();
        }
      } else if (!window._unitCatalogPushed) {
        // Primeira vez: publicar os seeds de cada unidade no Firebase
        if (!window._unitCatalogPushing) window._unitCatalogPushing = {};
        if (!window._unitCatalogPushing[slug]) {
          window._unitCatalogPushing[slug] = true;
          const seed = getUnitCatalog(unitName).catalog;
          db.ref('dados/pizza_unit_catalog/' + slug).set(seed)
            .then(() => console.log('[Firebase] Seed ' + unitName + ' publicado:', seed.length, 'itens'))
            .catch(e => { console.error('[Firebase] Erro seed ' + unitName, e); window._unitCatalogPushing[slug] = false; });
        }
      }
    });
  });
  window._unitCatalogPushed = true; // marcar após registrar todos os listeners

  // ── 3. VERSÃO DO APP ────────────────────────────────────────────────────────
  db.ref('dados/pizza_app_version').on('value', snap => {
    const remoteVer = snap.val();
    if (remoteVer && _compareVersions(remoteVer, window._APP_VERSION) > 0 && !window._updateBannerShown) {
      window._updateBannerShown = true;
      if (!document.getElementById('update-banner')) {
        const banner = document.createElement('div');
        banner.id = 'update-banner';
        banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#1a3a2a;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;font-family:DM Sans,sans-serif;font-size:14px;box-shadow:0 -4px 20px rgba(0,0,0,.3)';
        // OBS (27/07): "location.reload(true)" N\u00C3O for\u00E7a mais buscar do
        // servidor em nenhum navegador moderno \u2014 esse par\u00E2metro foi removido
        // do padr\u00E3o h\u00E1 anos e \u00E9 ignorado silenciosamente. Como o GitHub Pages
        // serve o index.html com cache de 10 minutos (cache-control: max-age=600),
        // um reload comum muitas vezes reaproveitava a c\u00F3pia antiga j\u00E1 em cache
        // do navegador, mostrando o MESMO aviso de novo \u2014 da\u00ED a sensa\u00E7\u00E3o de
        // precisar recarregar v\u00E1rias vezes at\u00E9 "pegar". Trocamos por navegar
        // para uma URL com um par\u00E2metro \u00FAnico a cada clique: como \u00E9 uma URL
        // diferente, o navegador n\u00E3o tem escolha a n\u00E3o ser buscar de novo.
        banner.innerHTML = '<span>\uD83D\uDD04 Nova vers\u00E3o dispon\u00EDvel (' + remoteVer + '). Recarregue para atualizar.</span><button onclick="location.href = location.pathname + \'?v=\' + Date.now();" style="background:#1A5229;border:none;color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;margin-left:12px">Atualizar agora</button>';
        document.body.appendChild(banner);
      }
    }
  });

  // ── 4. ESTOQUE CPD ──────────────────────────────────────────────────────────
  db.ref('dados/pizza_cpd').on('value', snap => {
    if (!window._fb.ready || typeof cpd === 'undefined') return;
    const val = snap.val();
    if (!val) return;
    Object.keys(cpd).forEach(k => delete cpd[k]);
    Object.assign(cpd, val);
    saveLocal('pizza_cpd', cpd);
    _gateStep('stock', 'Estoque sincronizado…');
    _scheduleRender();
  });

  // ── 5. MÍNIMOS / PREÇOS / MÍNIMOS-UNIDADE ──────────────────────────────────
  db.ref('dados/pizza_minimums').on('value', snap => {
    if (!window._fb.ready || typeof minimums === 'undefined') return;
    const val = snap.val(); if (!val) return;
    Object.keys(minimums).forEach(k => delete minimums[k]);
    Object.assign(minimums, val);
    saveLocal('pizza_minimums', minimums);
    _scheduleRender();
  });
  db.ref('dados/pizza_prices').on('value', snap => {
    if (!window._fb.ready || typeof prices === 'undefined') return;
    const val = snap.val(); if (!val) return;
    Object.assign(prices, val);
    saveLocal('pizza_prices', prices);
  });
  db.ref('dados/pizza_unit_minimums').on('value', snap => {
    if (!window._fb.ready) return;
    const val = snap.val(); if (!val) return;
    if (!window.unitMinimums) window.unitMinimums = {};
    Object.keys(window.unitMinimums).forEach(k => delete window.unitMinimums[k]);
    Object.assign(window.unitMinimums, val);
    saveLocal('pizza_unit_minimums', window.unitMinimums);
  });

  // ── 7. ENVIOS, REMESSAS, PENDÊNCIAS, CONTADOS ──────────────────────────────



  db.ref('dados/pizza_counted').on('value', snap => {
    if (!window._fb.ready) return;
    const val = snap.val(); if (!val) return;
    countedMap = val;
    saveLocal('pizza_counted', countedMap);
    if (typeof renderOpenCountBanner === 'function') renderOpenCountBanner();
  });

  // Sincroniza o estado de confirmação de categoria/geral entre dispositivos
  // (necessário para o CPD enxergar contagens em aberto das unidades)
  db.ref('dados/pizza_cat_confirms').on('value', snap => {
    if (!window._fb.ready) return;
    const val = snap.val(); if (!val) return;
    catConfirmations = val;
    saveLocal('pizza_cat_confirms', catConfirmations);
    if (typeof renderOpenCountBanner === 'function') renderOpenCountBanner();
  });

  // ── 8. ESTOQUE DAS UNIDADES (granular por unidade) ─────────────────────────
  // CPD ouve todas as unidades; cada unidade ouve apenas a si mesma
  // Determinar unidades a ouvir com base na sessão salva no localStorage
  // (mais seguro que isCPD() pois não depende de função do bloco principal)
  const _savedSession = (() => { try { return JSON.parse(localStorage.getItem('pizza_session')); } catch(e) { return null; } })();
  const _isCpdSession = _savedSession && _savedSession.unit === 'cpd';
  const unitsToWatch = _isCpdSession
    ? UNIT_NAMES                       // CPD ouve todas as unidades
    : (_savedSession ? [_savedSession.unit] : UNIT_NAMES); // Unidade ouve só a si

  const watchedUnitNames = Array.isArray(unitsToWatch) ? unitsToWatch : UNIT_NAMES;
  watchedUnitNames.forEach(unitName => {
    const slug = unitSlug(unitName);
    db.ref('dados/pizza_units/' + slug).on('value', snap => {
      if (!window._fb.ready) return;
      const val = snap.val() || {};

      // Proteção zero-flash AMPLIADA: não aceitar snapshot vazio SE
      // (a) a migração ainda está rodando OU
      // (b) não há confirmação de migração E já tínhamos dados locais
      const localKey = 'pizza_unit_' + slug;
      const hasLocalData = (() => {
        try { const d = localStorage.getItem(localKey); return d && JSON.parse(d) && Object.keys(JSON.parse(d)).length > 0; } catch(e) { return false; }
      })();
      if (Object.keys(val).length === 0) {
        const hasMemoryData = unitStock[unitName] && Object.keys(unitStock[unitName]).length > 0;
        if (window._migrandoUnits || (!window._migrationConfirmed && (hasLocalData || hasMemoryData))) {
          console.log('[Guard] Ignorando snapshot vazio para', unitName, '— dados locais preservados');
          // Restaurar dados do localStorage
          try {
            const local = JSON.parse(localStorage.getItem(localKey) || '{}');
            if (!unitStock[unitName]) unitStock[unitName] = {};
            Object.assign(unitStock[unitName], local);
          } catch(e) {}
          return;
        }
      }

      if (!unitStock[unitName]) unitStock[unitName] = {};
      Object.keys(unitStock[unitName]).forEach(k => delete unitStock[unitName][k]);
      Object.assign(unitStock[unitName], val);
      try { localStorage.setItem('pizza_unit_' + slug, JSON.stringify(val)); } catch(e) {}

      // Liberar gate de stock ao receber a própria unidade (ou qualquer unidade para o CPD)
      _gateStep('stock', 'Estoque sincronizado…');
      _scheduleRender();
    });
  });

  console.log('[Firebase] Listeners separados registrados.');

  // Notificacoes em tempo real para a unidade logada
  if (typeof session !== 'undefined' && session) {
    const notifPath = session.unit === 'cpd'
      ? 'notificacoes/cpd'
      : 'notificacoes/unidades/' + encodeURIComponent(session.unit);

    db.ref(notifPath).on('child_added', snap => {
      const n = snap.val();
      if (!n) return;
      if (typeof showPushNotif === 'function') {
        showPushNotif(n.titulo, n.corpo, []);
      }
      snap.ref.remove(); // remove apos exibir
    });
  }
});
</script>

function getDailyRequiredCategories(date) {
  const now = date || new Date();
  const brt = new Date(now.getTime() - 3*60*60*1000); // UTC-3
  const extras = DAILY_REQUIRED_CATEGORIES_BY_WEEKDAY[brt.getDay()] || [];
  return DAILY_REQUIRED_CATEGORIES.concat(extras.filter(c => !DAILY_REQUIRED_CATEGORIES.includes(c)));
}

  if (!cats || cats.length === 0) return '';
  if (cats.length === 1) return cats[0];
  return cats.slice(0, -1).join(', ') + ' e ' + cats[cats.length - 1];

// Migração em tempo real: dados de catálogo já salvos no Firebase/localStorage
// foram gravados ANTES do campo `key` existir. Sem isso, item.key fica
// undefined pra quem já tem dado real salvo, e todo o cálculo de A Enviar
// (que agora casa por key, não por nome) para de achar qualquer item —
// era exatamente o bug de "Envios do Dia sempre vazio" relatado.
function _ensureItemKeys(arr) {
  if (!Array.isArray(arr)) return arr;
  const _n = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  arr.forEach(item => {
    if (item && !item.key) item.key = _n(item.name);
  });
  return arr;
}

// Mapa unidade → catálogo e categorias
function getUnitCatalog(unitName) {
  // Priorizar cache em memória (versão editada) sobre seed hardcoded
  const slug = typeof unitSlug === 'function' ? unitSlug(unitName) : (unitName||'').toLowerCase().replace(/[^a-z0-9]+/g,'_');
  if (window._unitCatalogCache && window._unitCatalogCache[slug]) {
    // Derivar categorias do catálogo em cache (preserva ordem de edição)
    const cachedCat = _ensureItemKeys(window._unitCatalogCache[slug]);
    const cats = [...new Set(cachedCat.map(i => i.category))];
    return { catalog: cachedCat, categories: cats };
  }
  // Fallback: seed hardcoded
  switch(unitName) {
    case 'Asa Sul':       return { catalog: ASA_SUL_CATALOG,       categories: ASA_SUL_CATEGORIES };
    case 'SIG':           return { catalog: SIG_CATALOG,           categories: SIG_CATEGORIES };
    case 'Vicente Pires': return { catalog: VICENTE_PIRES_CATALOG, categories: VICENTE_PIRES_CATEGORIES };
    case 'Delivery':      return { catalog: DELIVERY_CATALOG,      categories: DELIVERY_CATEGORIES };
    default:              return { catalog: ASA_SUL_CATALOG,       categories: ASA_SUL_CATEGORIES };
  }
}

// Encoder PDF Latin-1/WinAnsi — usado em todas as funções de geração de PDF
function pdfStr(str) {
  let out = '';
  for (const ch of String(str)) {
    const code = ch.charCodeAt(0);
    if (ch === '(') out += '\\(';
    else if (ch === ')') out += '\\)';
    else if (ch === '\\') out += '\\\\';
    else if (code < 128) out += ch;
    else if (code <= 0xFF) out += '\\' + code.toString(8).padStart(3, '0');
    else {
      const norm = ch.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      out += (norm && norm.charCodeAt(0) < 128) ? norm : '?';
    }
  }
  return '(' + out + ')';
}

// Helper: classificar item por nome (normalizado)
function classificarItem(itemName) {
  const _n = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const nm = _n(itemName);
  // Match exato primeiro
  for (const p of ITENS_PRODUZIDOS) { if (_n(p) === nm) return 'produzido'; }
  for (const c of ITENS_COMPRADOS)  { if (_n(c) === nm) return 'comprado'; }
  // Match por prefixo (ex: 'Peperoni' bate 'Peperoni 1kg' e vice-versa)
  for (const p of ITENS_PRODUZIDOS) { if (nm.startsWith(_n(p)) || _n(p).startsWith(nm)) return 'produzido'; }
  for (const c of ITENS_COMPRADOS)  { if (nm.startsWith(_n(c)) || _n(c).startsWith(nm)) return 'comprado'; }
  return 'outro';
}

// Retorna mapa min_per_day para uma unidade
function getMinPerDay(unitName) {
  // Normalizar nome para garantir match independente de formato
  const u = (unitName || '').trim();
  if (u === 'Asa Sul'       || u === 'asa_sul')        return MIN_PER_DAY_ASA_SUL;
  if (u === 'SIG'           || u === 'sig')             return MIN_PER_DAY_SIG;
  if (u === 'Vicente Pires' || u === 'vicente_pires')   return MIN_PER_DAY_VICENTE_PIRES;
  if (u === 'Delivery'      || u === 'delivery')        return MIN_PER_DAY_DELIVERY;
  return {};
}

// Calcula quantidade a enviar para um item específico
// = max(0, Mínimo do Dia de Entrega - Estoque Atual)
// Um item é considerado "contado" na janela atual se:
//  - a quantidade for > 0 (alguém digitou algo, mesmo sem clicar em confirmar), OU
//  - foi confirmado explicitamente pelo botão ✓ (cobre o caso de contagem real = 0)
// Sem isso, "não contei ainda" e "contei e acabou" ficam indistinguíveis (os dois
// gravam como 0), e o cálculo de "A Enviar" trata os dois casos como estoque zerado
// de verdade — o que pode disparar pedido de reposição de um item que ninguém
// checou ainda. CPD não tem esse conceito de janela de contagem por unidade, então
// itens do CPD são sempre tratados como "contados".
function itemFoiContado(unitName, itemId, qty) {
  if ((qty || 0) > 0) return true;
  if (!unitName || unitName === 'CPD') return true;
  if (typeof isConfirmed === 'function' && isConfirmed(unitName, itemId)) return true;
  // 28/07: a unidade também pode confirmar a contagem por CATEGORIA inteira
  // (botão "Confirmar" no topo de cada categoria — ver confirmCategory /
  // getCatConfirmState), sem precisar clicar no ✓ individual de cada item
  // zerado — é esse o fluxo que os funcionários realmente usam no dia a dia.
  // Antes desta correção, "Envios do Dia" no CPD ignorava esse sinal e
  // mostrava "NC" (não contado) em itens que a unidade já tinha contado e
  // confirmado por categoria, gerando divergência entre a tela da unidade
  // (tudo confirmado) e a tela do CPD (muita coisa "NC"). A confirmação por
  // categoria agora também conta como "contado" aqui. O ✓ individual por
  // item continua existindo e sendo registrado à parte — ver
  // itemConfirmadoIndividualmente(), usado no indicador de conformidade que
  // o CPD vê ao lado de cada categoria.
  if (typeof getUnitCatalog === 'function' && typeof getCatConfirmState === 'function' && typeof unitStock !== 'undefined') {
    const item = getUnitCatalog(unitName).catalog.find(c => c.id === itemId);
    if (item) {
      const stockObj = unitStock[unitName] || {};
      if (getCatConfirmState(unitName, item.category, stockObj) === 'confirmed') return true;
    }
  }
  return false;
}

// Confirmação INDIVIDUAL do item (botão ✓ da linha), sem considerar a
// confirmação por categoria — usado só para medir adesão ao fluxo item-a-
// item (indicador de conformidade visível pro CPD), nunca para decidir "A
// Enviar"/NC (isso é itemFoiContado, que já aceita confirmação por categoria).
function itemConfirmadoIndividualmente(unitName, itemId) {
  return typeof isConfirmed === 'function' ? isConfirmed(unitName, itemId) : false;
}

// Um mesmo produto (mesma item.key) pode estar cadastrado em categorias
// diferentes em cada catálogo de unidade (ex: "Coca-Cola 1,5L" é "Salão" na
// Asa Sul, "Bar" na Vicente Pires, "Delivery" no SIG/Delivery/CPD) — cada
// unidade organiza sua contagem física do jeito que faz sentido pra ela.
// Nas telas do CPD que juntam a necessidade de TODAS as unidades num único
// item (Tabela de Envios, Lista de Produção/Compras), o formato de referência
// é sempre o catálogo da Asa Sul — corrigido em 27/07 a pedido do Eduardo
// (uma correção anterior usava o catálogo do CPD como referência, o que não
// é o formato correto para essas telas).
function categoriaCanonica(itemKey, categoriaFallback) {
  const asaSulItem = (typeof getUnitCatalog === 'function')
    ? getUnitCatalog('Asa Sul').catalog.find(c => c.key === itemKey) : null;
  return asaSulItem ? asaSulItem.category : categoriaFallback;
}

// Acha a entrada de mínimos de um item no MIN_PER_DAY da unidade.
// Preferência: item.key (fixo, não muda quando o nome exibido é renomeado).
// Fallback: nome normalizado, só por segurança pra qualquer chamada antiga
// que ainda não tenha sido migrada pra passar a key.
function _acharMinEntry(minMap, itemKeyOrName) {
  let entry = minMap[itemKeyOrName];
  if (!entry) {
    const _norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    const k = Object.keys(minMap).find(k => _norm(k) === _norm(itemKeyOrName));
    entry = k ? minMap[k] : null;
  }
  return entry;
}

function calcAEnviar(unitName, itemKeyOrName, estoqueAtual, dayCode) {
  const minMap = getMinPerDay(unitName);
  const entry = _acharMinEntry(minMap, itemKeyOrName);
  if (!entry) return 0;
  const minDia = entry[dayCode] || 0;
  return Math.max(0, minDia - (estoqueAtual || 0));
}

// 28/07: a pedido do Eduardo — "Envios do Dia" ganha um seletor de dias
// (SEG/QUA/SEX, múltipla escolha) pra somar os mínimos de quantos dias
// quiser (ex.: só quarta+sexta, ou os 3 juntos, pra ter uma ideia geral ou
// programar uma compra semanal), em vez de só o dia automático de hoje. Por
// padrão a tela continua vindo só com o dia de hoje marcado — nada muda no
// comportamento normal se ninguém mexer no seletor. Ver window._enviosDiaDias
// e o seletor de chips dentro de viewEnviosDia().
function somaMinDias(entry, dayCodes) {
  if (!entry) return 0;
  return (dayCodes || []).reduce((s, d) => s + (entry[d] || 0), 0);
}

function calcAEnviarDias(unitName, itemKeyOrName, estoqueAtual, dayCodes) {
  const minMap = getMinPerDay(unitName);
  const entry = _acharMinEntry(minMap, itemKeyOrName);
  if (!entry) return 0;
  const minAlvo = somaMinDias(entry, dayCodes);
  return Math.max(0, minAlvo - (estoqueAtual || 0));
}

// Horário de corte: depois desse horário no próprio dia de entrega, a aba
// "Envios do Dia" já considera que aquele envio passou e calcula pro PRÓXIMO
// dia de entrega, em vez de continuar mostrando um cálculo de um envio que já
// aconteceu. Antes disso não existia corte nenhum — o dia só virava à meia-
// noite, então às 20h de uma segunda-feira (bem depois do envio das 14h/15h)
// o sistema ainda calculava "hoje", podendo levar a produção/compra pro dia
// errado. Decidido com o Eduardo em 27/07: corte às 15h.
const HORA_CORTE_ENVIO_DIA = 15;

// Detecta o próximo dia de entrega (SEG/QUA/SEX)
function nextEnviarDay() {
  const now = new Date();
  const dow = now.getDay();
  const passouCorte = now.getHours() >= HORA_CORTE_ENVIO_DIA;
  const dmap = {1:'SEG', 3:'QUA', 5:'SEX'};
  for (let d = 0; d <= 6; d++) {
    if (d === 0 && passouCorte) continue; // envio de hoje já passou do horário de corte
    const dd = (dow + d) % 7;
    if (dmap[dd]) return dmap[dd];
  }
  return 'SEG';
}

// Mesma lógica de nextEnviarDay(), mas retorna a data real (não só o código
// SEG/QUA/SEX) — necessário para calcular a janela de validade da contagem.
function nextEnviarDate() {
  const now = new Date();
  const dow = now.getDay();
  const passouCorte = now.getHours() >= HORA_CORTE_ENVIO_DIA;
  const dmap = {1:'SEG', 3:'QUA', 5:'SEX'};
  for (let d = 0; d <= 6; d++) {
    if (d === 0 && passouCorte) continue; // envio de hoje já passou do horário de corte
    const dd = (dow + d) % 7;
    if (dmap[dd]) {
      const dt = new Date(now);
      dt.setDate(now.getDate() + d);
      return dt;
    }
  }
  const dt = new Date(now);
  dt.setDate(now.getDate() + 7);
  return dt;
}

// Aliases para compatibilidade
const UNIT_SEED_CATALOG = ASA_SUL_CATALOG;
const UNIT_CATEGORIES   = ASA_SUL_CATEGORIES;


function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    if (!v) return fallback;
    const parsed = JSON.parse(v);
    // Return fallback if result is an empty array but fallback is not
    if (Array.isArray(parsed) && parsed.length === 0 && Array.isArray(fallback) && fallback.length > 0) return fallback;
    return parsed;
  }
  catch(e) { return fallback; }
}
// Salva APENAS no localStorage, sem disparar sync Firebase
// Usado pelo listener do Firebase para cachear dados recebidos
// ═══ GATE DE CARREGAMENTO ═══════════════════════════════════════════════════
// Controla a tela de carregamento com lógica de gate inteligente.
// A tela só some quando: auth OK + catálogo OK + estoque OK + migração OK.
const _gate = {
  auth:    false,
  catalog: false,
  stock:   false,
  migrate: false,
  released: false,
  _progress: 0,
};

function _gateStep(step, label) {
  if (_gate[step]) return; // já marcado
  _gate[step] = true;

  const dot = document.getElementById('ls-' + step);
  if (dot) { dot.classList.remove('active'); dot.classList.add('done'); }

  // Avançar ponto ativo para o próximo
  const order = ['auth','catalog','stock','migrate'];
  const nextIdx = order.indexOf(step) + 1;
  if (nextIdx < order.length) {
    const nextDot = document.getElementById('ls-' + order[nextIdx]);
    if (nextDot) nextDot.classList.add('active');
  }

  // Atualizar barra e label
  const done = order.filter(s => _gate[s]).length;
  const pct  = Math.round((done / order.length) * 100);
  const bar  = document.getElementById('loading-bar');
  const lbl  = document.getElementById('loading-label');
  if (bar) bar.style.width = pct + '%';
  if (lbl && label) lbl.textContent = label;

  console.log('[Gate] ' + step + ' ✓ — ' + pct + '%');

  // Verificar se todos os passos concluíram
  if (order.every(s => _gate[s])) _gateRelease();
}function _gateRelease() {
  if (_gate.released) return;
  _gate.released = true;
  console.log('[Gate] Todos os passos concluídos — liberando app');
  const bar = document.getElementById('loading-bar');
  const lbl = document.getElementById('loading-label');
  if (bar) bar.style.width = '100%';
  if (lbl) lbl.textContent = 'Pronto!';

  setTimeout(() => {
    const gate = document.getElementById('loading-gate');
    if (!gate) return;
    gate.classList.add('hiding');
    setTimeout(() => { gate.style.display = 'none'; }, 420);
  }, 300); // pequena pausa para o usuário ver 100%
}

// Timeout de segurança: se algum passo travar por >15s, libera mesmo assim
setTimeout(() => {
  if (!_gate.released) {
    console.warn('[Gate] Timeout de 15s — liberando app, alguns dados podem estar incompletos');
    // Marcar todos como concluídos para liberar o gate
    ['auth','catalog','stock','migrate'].forEach(s => {
      _gate[s] = true;
      const dot = document.getElementById('ls-' + s);
      if (dot && !dot.classList.contains('done')) dot.classList.add('error');
    });
    const lbl = document.getElementById('loading-label');
    if (lbl) lbl.textContent = 'Carregado (conex\u00E3o lenta)';
    _gateRelease();
  }
}, 15000);

// ═══ CONFIRMAÇÃO DE CONTAGEM POR CATEGORIA ═══════════════════════════════════
// Estrutura: { unitSlug: { 'Categoria': { name, ts, qtys: {itemId: qty} } } }
// qtys = snapshot das quantidades no momento da confirmação
let catConfirmations = load('pizza_cat_confirms', {});

// Antes, isto apagava as confirmações do dia às 6h (com um auto-save de
// emergência antes de apagar). Decisão da operação: a rede de segurança não
// pode confirmar nada sozinha, nem trocar dado real por dado velho disfarçado
// de novo. Agora as confirmações de categoria simplesmente NÃO são apagadas
// automaticamente — o "rascunho" fica em aberto (ver getOpenCountUnits) até
// alguém de fato finalizar (Confirmar Contagem Geral) ou descartar
// explicitamente (gate de saída em logout()). Mantido como no-op só para não
// quebrar as chamadas existentes em getCatConfirmState/getGeneralConfirmState.
function _checkDailyReset() {
  // Intencionalmente vazio — ver comentário acima.
}

// Salvar confirmação de categoria
// Mesma proteção aplicada ao PDF: se `stockObj` foi capturado num render
// anterior ao carregamento completo do Firebase, ele pode estar desatualizado
// (congelado vazio) mesmo com a tela já mostrando os números certos. Buscar
// de novo aqui garante que a quantidade GRAVADA na confirmação é sempre a
// mais atual, e não uma foto velha que o operador nem viu.
function confirmCategory(unitName, cat, respName, stockObj) {
  if (unitName !== 'CPD' && typeof unitStock !== 'undefined' && unitStock[unitName]) {
    stockObj = unitStock[unitName];
  }
  const slug = unitSlug(unitName);
  if (!catConfirmations[slug]) catConfirmations[slug] = {};
  const qtys = {};
  const ucat = getUnitCatalog(unitName).catalog.filter(i => i.category === cat);
  ucat.forEach(i => { qtys[i.id] = stockObj[i.id] || 0; });
  catConfirmations[slug][cat] = {
    name: respName,
    ts: Date.now(),
    qtys
  };
  save('pizza_cat_confirms', catConfirmations);
}

// Verificar estado da confirmação de uma categoria
// Retorna: 'none' | 'confirmed' | 'needs-reconfirm'
function getCatConfirmState(unitName, cat, stockObj) {
  _checkDailyReset();
  if (unitName !== 'CPD' && typeof unitStock !== 'undefined' && unitStock[unitName]) {
    stockObj = unitStock[unitName];
  }
  const slug = unitSlug(unitName);
  const conf = catConfirmations[slug] && catConfirmations[slug][cat];
  if (!conf) return 'none';
  // Verificar se alguma quantidade mudou desde a confirmação
  const ucat = getUnitCatalog(unitName).catalog.filter(i => i.category === cat);
  const changed = ucat.some(i => (stockObj[i.id] || 0) !== (conf.qtys[i.id] || 0));
  return changed ? 'needs-reconfirm' : 'confirmed';
}

// Verificar se PELO MENOS UMA categoria já foi confirmada hoje (estado
// 'confirmed', não 'needs-reconfirm' nem 'none'). Usado para liberar o botão
// "PDF Contagem" do topo antes da Confirmação Geral — a barra fica menor que
// dailyRequiredCatsConfirmed, que exige todas as obrigatórias do dia.
function hasAnyCategoryConfirmed(unitName, stockObj) {
  const slug  = unitSlug(unitName);
  const confs = catConfirmations[slug];
  if (!confs) return false;
  return Object.keys(confs).some(cat => getCatConfirmState(unitName, cat, stockObj) === 'confirmed');
}

// Verificar se as categorias OBRIGATÓRIAS DO DIA (fixas + extras do dia da
// semana, via getDailyRequiredCategories) estão confirmadas. É este o
// critério real usado para avisar/liberar a Confirmação Geral — as demais
// categorias ainda não têm frequência definida.
function dailyRequiredCatsConfirmed(unitName, stockObj) {
  const unitCats = getUnitCatalog(unitName).categories;
  const required = getDailyRequiredCategories().filter(cat => unitCats.includes(cat));
  if (required.length === 0) return false; // unidade sem essas categorias — não se aplica
  return required.every(cat => getCatConfirmState(unitName, cat, stockObj) === 'confirmed');
}

// Confirmação geral (gerente)
function confirmGeneral(unitName, respName) {
  const slug = unitSlug(unitName);
  if (!catConfirmations[slug]) catConfirmations[slug] = {};
  catConfirmations[slug]._general = { name: respName, ts: Date.now() };
  save('pizza_cat_confirms', catConfirmations);
  // Salvar snapshot de histórico
  saveHistoricoSnapshot(unitName, respName);
}

function saveHistoricoSnapshot(unitName, respName) {
  if (!window._fb || !window._fb.ready || typeof db === 'undefined') return;
  const slug    = unitSlug(unitName);
  const ustock  = unitStock[unitName] || {};
  const ucat    = getUnitCatalog(unitName).catalog;
  const ts      = Date.now();
  // Snapshot: { ts, name, items: {itemId: qty} }
  const snapshot = {
    ts, name: respName, unit: unitName,
    items: {}
  };
  ucat.forEach(i => { snapshot.items[i.id] = ustock[i.id] || 0; });

  const ref = db.ref('dados/pizza_history/' + slug);
  ref.once('value').then(snap => {
    const existing = snap.val() || {};
    const entries = Object.entries(existing).sort((a,b) => Number(a[0]) - Number(b[0]));
    // Manter máximo 30 entradas — remover as mais antigas
    const writes = {};
    if (entries.length >= 30) {
      const toDelete = entries.slice(0, entries.length - 29);
      toDelete.forEach(([k]) => { writes[k] = null; });
    }
    writes[String(ts)] = snapshot;
    ref.update(writes)
      .then(() => console.log('[Histórico] Snapshot salvo para', unitName))
      .catch(e => console.warn('[Histórico] Erro ao salvar snapshot:', e));
  });
}

function getGeneralConfirmState(unitName) {
  _checkDailyReset();
  const slug = unitSlug(unitName);
  return catConfirmations[slug] && catConfirmations[slug]._general
    ? catConfirmations[slug]._general : null;
}

// ═══ AVISO DE CONTAGEM EM ABERTO ═══════════════════════════════════════════
// Lista as unidades onde as categorias obrigatórias do dia já foram
// confirmadas, mas a Confirmação Geral ainda não foi feita — ou seja, o
// snapshot ainda NÃO foi salvo em pizza_history. Não dispara só porque
// alguma categoria opcional foi confirmada, já que nem toda categoria
// precisa ser contada todo dia. Como as confirmações não são mais apagadas
// automaticamente (rascunho não morre sozinho), calcula também desde quando
// está em aberto, usando o carimbo de tempo da última categoria obrigatória
// confirmada.
function getOpenCountUnits() {
  const abertas = [];
  UNIT_NAMES.forEach(unitName => {
    const slug = unitSlug(unitName);
    const confData = catConfirmations[slug] || {};
    const hasGeneral = !!confData._general;
    const ustock = unitStock[unitName] || {};
    if (dailyRequiredCatsConfirmed(unitName, ustock) && !hasGeneral) {
      const unitCats = getUnitCatalog(unitName).categories;
      const required = getDailyRequiredCategories().filter(cat => unitCats.includes(cat));
      const tsList = required.map(cat => confData[cat] && confData[cat].ts).filter(Boolean);
      const since = tsList.length ? Math.max(...tsList) : null; // momento em que a última obrigatória foi confirmada
      abertas.push({ unitName, since });
    }
  });
  return abertas;
}

// Monta o conteúdo de um alert-banner a partir de ícone/título/corpo, com
// botão de fechar opcional
function _buildBannerContent(el, icone, titulo, corpo, onClose) {
  el.innerHTML = '';
  el.style.display = 'flex';
  const iconEl = document.createElement('span');
  iconEl.className = 'alert-banner-icon';
  iconEl.textContent = icone;
  const body = document.createElement('div');
  body.className = 'alert-banner-body';
  const titleEl = document.createElement('div');
  titleEl.className = 'alert-banner-title';
  titleEl.textContent = titulo;
  const itemsEl = document.createElement('div');
  itemsEl.className = 'alert-banner-items';
  itemsEl.textContent = corpo;
  body.appendChild(titleEl);
  body.appendChild(itemsEl);
  el.appendChild(iconEl);
  el.appendChild(body);
  if (onClose) {
    const closeBtn = document.createElement('button');
    closeBtn.textContent = '\u2715';
    closeBtn.setAttribute('aria-label', 'Fechar aviso');
    closeBtn.style.cssText = 'background:none;border:none;cursor:pointer;font-size:13px;color:inherit;opacity:.6;margin-left:8px;align-self:flex-start';
    closeBtn.addEventListener('click', onClose);
    el.appendChild(closeBtn);
  }
}

// Banner persistente (não fechável) — mostra contagens ainda não finalizadas.
// Unidade vê só a própria; CPD vê todas.
function renderOpenCountBanner() {
  const el = document.getElementById('open-count-banner');
  if (!el || !session) return;
  // 28/07: em "Envios do Dia" esse mesmo aviso (contagem em aberto → cálculo
  // desatualizado) já aparece de forma curta dentro da própria tela — mostrar
  // os dois juntos era excesso de aviso, a pedido do Eduardo.
  if (currentView === 'envios-dia') {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  const abertas = isCPD()
    ? getOpenCountUnits()
    : getOpenCountUnits().filter(u => u.unitName === session.unit);

  if (abertas.length === 0) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  const todayStr = _operationalDateStr(Date.now());
  const nomes = abertas.map(u => {
    if (!u.since) return u.unitName;
    const sinceStr = _operationalDateStr(u.since);
    if (sinceStr === todayStr) return u.unitName;
    const dias = Math.round((new Date(todayStr) - new Date(sinceStr)) / 86400000);
    return u.unitName + ' (em aberto há ' + dias + (dias === 1 ? ' dia' : ' dias') + ')';
  }).join(', ');
  const titulo = abertas.length === 1
    ? 'Contagem em aberto \u2014 ' + nomes
    : 'Contagens em aberto \u2014 ' + nomes;
  const reqTxt = formatCategoryList(getDailyRequiredCategories());
  const corpo = reqTxt + ' já foram confirmados, mas ainda falta "Confirmar Contagem Geral". '
    + 'Sem essa confirmação, o dia não entra no histórico usado nos relatórios de envio semanal. '
    + 'A contagem fica aberta até alguém finalizar ou descartar — não é apagada sozinha.';
  _buildBannerContent(el, '\u26A0\uFE0F', titulo, corpo, null);
}
