// HELPERS
function el(tag, attrs={}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'cls') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value' && (tag === 'input' || tag === 'textarea')) {
      e.setAttribute(k, v);
      e.value = v; // set live value too, not just HTML attribute
    }
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}function buildStockTable(stockObj, searchInputId, onUpdate, opts) {
  opts = opts || {};
  const useMin        = opts.useMin !== false;
  const pdfLabel      = opts.pdfLabel     || null;
  const lockByWindow  = opts.lockByWindow === true;
  const unitForConf   = opts.unitForConf  || null;
  const unitMins      = opts.unitMins     || {};
  const unitName      = opts.unitName     || null;  // unidade para botão confirmar
  const showConfirm   = opts.showConfirm === true;  // mostrar botão ✓ por item
  const catSource     = opts.catSource || catalog;   // catálogo a usar (padrão: CPD)
  // Diagnóstico: alertar se catSource parece ser o catálogo do CPD para uma unidade
  if (!isCPD() && catSource === catalog && catalog.length > 300) {
    console.warn('[buildStockTable] ATENÇÃO: usando catálogo do CPD (' + catalog.length + ' itens) para unidade. unitCatalog tem', unitCatalog ? unitCatalog.length : 0, 'itens');
  }
  const editable = typeof onUpdate === 'function';
  const showMin  = false; // M\u00CDN column removed from stock table \u2014 editable only in Cat\u00E1logo
  const wrap = el('div', {});

  const searchWrap = el('div', {cls:'search-wrap', style:'margin-bottom:14px'});
  const searchIcon = el('span', {cls:'search-icon', html:'<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'});
  const searchInp = el('input', {type:'text', placeholder:'Buscar item...', id: searchInputId || 'search-'+Date.now()});
  searchWrap.appendChild(searchIcon);
  searchWrap.appendChild(searchInp);
  wrap.appendChild(searchWrap);

  const colCount = editable ? (showMin ? '4' : '3') : '4';
  const tableWrap = el('div', {cls:'table-wrap'});
  const table = el('table', {cls: 'stock-table'});
  const thead = el('thead', {});
  const hasEnviarCol = !!(opts && opts.showEnviar);
  if (editable) {
    thead.innerHTML = showMin
      ? '<tr><th>Item</th><th class="col-unit" style="width:12%">Medida</th><th class="col-min" style="width:10%;text-align:right;font-size:10px;color:var(--text-3)">M\u00CDN.</th><th style="width:40%;text-align:right">Quantidade</th></tr>'
      : (showConfirm
        ? '<tr><th>Item</th><th class="col-unit" style="width:12%">Medida</th><th style="width:38%;text-align:right">Quantidade</th><th style="width:38px"></th></tr>'
        : '<tr><th>Item</th><th class="col-unit" style="width:14%">Medida</th><th style="width:46%;text-align:right">Quantidade</th></tr>');
  } else {
    thead.innerHTML = hasEnviarCol
      ? '<tr><th>Item</th><th style="width:15%;text-align:right">Qtd</th><th style="width:16%;text-align:right;color:var(--accent-dark,#1A5229);font-size:11px">A Enviar</th><th class="col-unit" style="width:15%">Medida</th><th style="width:8%"></th></tr>'
      : '<tr><th>Item</th><th style="width:18%;text-align:right">Qtd</th><th class="col-unit" style="width:18%">Medida</th><th style="width:8%"></th></tr>';
  }
  const tbody = el('tbody', {id:'tbody-'+searchInp.id});
  tbody.setAttribute('data-stock-table', searchInp.id);
  table.appendChild(thead);
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);

  let saveTimer = {};

  function updateQty(itemId, newQty, inp, tr, inlineSpan) {
    // Trava de janela: recusa gravação fora do horário/dia de contagem
    if (lockByWindow) {
      const it = catSource.find(i => i.id === itemId);
      if (it && !categoriaLiberada(it.category)) {
        toast('\uD83D\uDD12 Contagem de ' + it.category + ' dispon\u00EDvel ' + proximaJanela(it.category) + '.');
        return;
      }
    }
    const raw = typeof newQty === 'string' ? parseFloat(newQty.replace(',', '.')) : newQty;
    const q = Math.max(0, isNaN(raw) ? 0 : raw);
    stockObj[itemId] = q;
    inp.value = String(q);
    const min = unitForConf ? (unitMins[itemId] || 0) : (useMin ? (minimums[itemId] || 0) : 0);
    const isZero = q === 0;
    const isLow  = min > 0 && q < min && !isZero;

    // Update input class
    if (isZero && min > 0) inp.className = 'qty-inp-sm has-error';
    else                   inp.className = 'qty-inp-sm has-val';

    // Update row background instantly (alertas de cor s\u00F3 com m\u00EDnimos ativos)
    if (tr) {
      tr.style.background = useMin ? (isZero ? 'var(--danger-bg)' : isLow ? 'var(--warning-bg)' : '') : '';
    }

    // Update inline min text color instantly
    if (inlineSpan) {
      const dotColor = isZero ? 'var(--danger)' : isLow ? '#E8A020' : '';
      inlineSpan.style.color = dotColor || 'var(--text-3)';
      inlineSpan.style.fontWeight = dotColor ? '600' : '400';
    }

    clearTimeout(saveTimer[itemId]);
    saveTimer[itemId] = setTimeout(() => onUpdate(itemId, q), 1000);
  }

  // track open state per table instance -- all closed by default
  // openCats persiste entre renders usando um mapa global keyed por tableId
  // Assim categorias abertas não fecham quando o Firebase atualiza dados
  // _tableId = searchInp.id para garantir consistência com o setAttribute acima
  const _tableId = searchInp.id;
  if (!window._openCatsMap) window._openCatsMap = {};
  if (!window._openCatsMap[_tableId]) {
    window._openCatsMap[_tableId] = {};
  }
  const openCats = window._openCatsMap[_tableId];

  // Cache de linhas DOM por categoria — evita recriar elementos já montados
  if (!window._rowCache) window._rowCache = {};
  if (!window._rowCache[_tableId]) window._rowCache[_tableId] = {};
  const rowCache = window._rowCache[_tableId];

  function renderRows(q) {
    const isSearch = q && q.length > 0;

    // Com busca: mostrar/ocultar linhas existentes sem recriar DOM
    if (isSearch) {
      const qLow = q.toLowerCase();
      let visCount = 0;
      tbody.querySelectorAll('tr[data-item-id]').forEach(tr => {
        const name = (tr.getAttribute('data-item-name') || '').toLowerCase();
        const show = name.includes(qLow);
        tr.style.display = show ? '' : 'none';
        if (show) visCount++;
      });
      // cabeçalhos de categoria: mostrar se têm itens visíveis
      tbody.querySelectorAll('tr.cat-row').forEach(catTr => {
        const cat = catTr.querySelector('[data-cat-name]');
        if (!cat) return;
        const catName = cat.getAttribute('data-cat-name');
        const hasVisible = !!tbody.querySelector(`tr[data-cat="${CSS.escape(catName)}"]:not([style*="display: none"])`);
        catTr.style.display = hasVisible ? '' : 'none';
      });
      let emptyRow = tbody.querySelector('tr.empty-search-row');
      if (visCount === 0) {
        if (!emptyRow) {
          emptyRow = document.createElement('tr'); emptyRow.className = 'empty-search-row';
          const td = document.createElement('td');
          td.colSpan = colCount; td.style.cssText = 'text-align:center;color:var(--text-3);padding:16px;font-size:13px';
          td.textContent = 'Nenhum item encontrado'; emptyRow.appendChild(td); tbody.appendChild(emptyRow);
        }
        emptyRow.style.display = '';
      } else if (emptyRow) emptyRow.style.display = 'none';
      return;
    }

    // Sem busca: restaurar visibilidade normal (sem recriar DOM se já existe)
    tbody.querySelectorAll('tr.empty-search-row').forEach(r => r.remove());
    if (tbody.querySelectorAll('tr[data-item-id]').length > 0) {
      // Linhas já existem — ajustar visibilidade E atualizar células dinâmicas
      tbody.querySelectorAll('tr[data-item-id]').forEach(tr => {
        const cat = tr.getAttribute('data-cat');
        tr.style.display = openCats[cat] === true ? '' : 'none';
        // Atualizar coluna "A Enviar" com valores atuais de estoque
        if (hasEnviarCol) {
          const itemId  = tr.getAttribute('data-item-id');
          const itemKey = tr.getAttribute('data-item-key');
          const qtyCell = tr.querySelector('[data-qty-cell]');
          const envCell = tr.querySelector('[data-aenviar-cell]');
          if (envCell && itemKey) {
            const _qty    = parseInt((qtyCell && qtyCell.textContent) || '0') || (stockObj[itemId] || 0);
            const _unitD  = opts.unitForDisplay || opts.pdfLabel || opts.unitName || '';
            const _day    = nextEnviarDay();
            if (!itemFoiContado(_unitD, itemId, _qty)) {
              envCell.textContent = 'NC';
              envCell.title = 'Item ainda n\u00e3o contado nesta janela \u2014 contagem necess\u00e1ria antes de calcular o quanto enviar.';
              envCell.style.color = '#E8A020';
            } else {
              const _aEnv   = calcAEnviar(_unitD, itemKey, _qty, _day);
              envCell.textContent = _aEnv > 0 ? String(_aEnv) : '\u2014';
              envCell.style.color = _aEnv > 0 ? 'var(--accent-dark,#1A5229)' : 'var(--text-3)';
              envCell.title = '';
            }
          }
        }
      });
      tbody.querySelectorAll('tr.cat-row').forEach(catTr => { catTr.style.display = ''; });
      return;
    }

    // Primeira vez: montar todo o DOM
    const filtered = catSource;
    if (!filtered.length) {
      tbody.appendChild(el('tr', {}, el('td', {colspan: colCount, cls:'empty'}, 'Nenhum item encontrado')));
      return;
    }
    // Derivar categorias do próprio catSource (suporta CPD e Unidades com listas diferentes)
    const allCatsInSource = [...new Set(catSource.map(i => i.category))];
    const catOrder = (catSource === catalog ? CATEGORIES : UNIT_CATEGORIES)
      .filter(c => allCatsInSource.includes(c));
    // Categorias sem ordem definida ficam no fim
    const extraCats = allCatsInSource.filter(c => !catOrder.includes(c));
    const usedCats = [...catOrder, ...extraCats].filter(cat => filtered.some(i => i.category === cat));
    usedCats.forEach(cat => {
      const catItems = filtered.filter(i => i.category === cat);
      const isOpen = openCats[cat] === true; // fechado por padrão

      // Header row with toggle button
      const catTr = el('tr', {cls:'cat-row'});
      catTr.setAttribute('data-cat-row', cat); // para busca
      const catTd = document.createElement('td');
      catTd.setAttribute('colspan', colCount);
      catTd.setAttribute('data-cat-name', cat); // referência para busca
      catTd.style.cssText = 'padding:0;width:100%;';
      const catJanela = (lockByWindow && !isCPD())
        ? (categoriaLiberada(cat) ? ' janela-aberta' : ' janela-fechada')
        : '';
      const togBtn = el('button', {cls:'cat-toggle' + (isOpen ? ' open' : '') + catJanela});
      togBtn.appendChild(document.createTextNode(cat));

      // Alert count
      const alertCount = !useMin ? 0 : catItems.filter(i => {
        const qty = stockObj[i.id]||0; const min = minimums[i.id]||0;
        return min>0 && qty<min;
      }).length;
      const catLocked = lockByWindow && !categoriaLiberada(cat);
      const countText = catLocked
        ? `\uD83D\uDD12 Contagem ${proximaJanela(cat)}`
        : (alertCount > 0
          ? `${catItems.length} itens \u00B7 \u26A0\uFE0F ${alertCount}`
          : `${catItems.length} itens`);
      const countSpan = el('span', {cls:'cat-count', style: catLocked ? 'color:var(--text-3)' : (alertCount>0?'color:var(--warning);font-weight:700':'')}, countText);

      // ── Progresso da categoria ────────────────────────────────────────
      // Unidades: item conta como "contado" se qty>0 OU a categoria já foi
      // confirmada (mesma regra usada no PDF de contagem) — não é um cálculo
      // novo, reaproveita getCatConfirmState que já existe.
      // CPD: não existe confirmação por categoria, então o rótulo é
      // "com estoque lançado" em vez de "contado", pra não afirmar uma
      // garantia que o dado não sustenta.
      let progDone, progTotal, progLabel;
      if (!isCPD() && unitName) {
        const catConfirmed = getCatConfirmState(unitName, cat, stockObj) === 'confirmed';
        progTotal = catItems.length;
        progDone = catConfirmed ? progTotal : catItems.filter(i => (stockObj[i.id]||0) > 0).length;
        progLabel = (progDone === progTotal ? '\u2713 ' : '') + progDone + ' de ' + progTotal + ' contados';
      } else {
        progTotal = catItems.length;
        progDone = catItems.filter(i => (stockObj[i.id]||0) > 0).length;
        progLabel = progDone + ' de ' + progTotal + ' com estoque lançado';
      }
      const progWrap = el('div', {style:'display:flex;align-items:center;gap:8px', title: progLabel});
      const progTrack = el('div', {cls:'cat-progress-track'});
      const pct = progTotal > 0 ? Math.round(progDone / progTotal * 100) : 0;
      progTrack.appendChild(el('div', {cls:'cat-progress-fill' + (progDone === progTotal && progTotal > 0 ? ' complete' : ''), style:`width:${pct}%`}));
      progWrap.appendChild(progTrack);
      const chevron = el('span', {cls:'cat-chevron'}, '\u25BC');
      togBtn.appendChild(countSpan);
      togBtn.appendChild(progWrap);

      // \u2500\u2500 Indicador de conformidade: confirma\u00E7\u00E3o INDIVIDUAL por item \u2500\u2500\u2500\u2500\u2500\u2500
      // Vis\u00EDvel s\u00F3 pro CPD (a unidade j\u00E1 v\u00EA seu pr\u00F3prio progresso acima).
      // A confirma\u00E7\u00E3o por categoria j\u00E1 basta pro c\u00E1lculo de "A Enviar" (ver
      // itemFoiContado), mas o Eduardo pediu um jeito de monitorar se os
      // funcion\u00E1rios tamb\u00E9m est\u00E3o confirmando item a item, como orientado.
      if (isCPD() && unitName && unitName !== 'CPD') {
        const indDone = catItems.filter(i => itemConfirmadoIndividualmente(unitName, i.id)).length;
        const indTotal = catItems.length;
        const indOk = indDone === indTotal;
        const indSpan = el('span', {
          cls: 'cat-count',
          style: 'margin-left:2px;font-size:11px;white-space:nowrap;' + (indOk ? 'color:var(--text-3)' : 'color:var(--warning,#B8860B);font-weight:600'),
          title: indDone + ' de ' + indTotal + ' itens desta categoria com a confirma\u00E7\u00E3o INDIVIDUAL (\u2713 por item) registrada nesta janela \u2014 independente da confirma\u00E7\u00E3o por categoria.'
        }, (indOk ? '\u2713' : '\u26A0\uFE0F') + ' ind. ' + indDone + '/' + indTotal);
        togBtn.appendChild(indSpan);
      }

      togBtn.appendChild(chevron);
      togBtn.addEventListener('click', () => {
        openCats[cat] = !openCats[cat];
        togBtn.classList.toggle('open', openCats[cat]);
        // Mostrar/ocultar linhas diretamente — sem chamar renderRows (evita duplo clique)
        const rows = tbody.querySelectorAll(`[data-cat="${CSS.escape(cat)}"]`);
        rows.forEach(r => { r.style.display = openCats[cat] ? '' : 'none'; });
      });
      if (pdfLabel) {
        // Bot\u00E3o de PDF da categoria, ao lado do toggle
        const catWrap = el('div', {style:'display:flex;align-items:stretch;gap:6px;width:100%'});
        togBtn.style.flex = '1';
        const catPdfBtn = el('button', {
          cls:'btn btn-outline btn-sm',
          style:'flex:0 0 auto;align-self:center;padding:4px 10px;font-size:11px;white-space:nowrap',
          title:'Gerar PDF apenas desta categoria'
        });
        catPdfBtn.innerHTML = '\uD83D\uDCC4';
        catPdfBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          printStockPdf(pdfLabel, stockObj, cat);
        });
        catWrap.appendChild(togBtn);

        // ── Botão confirmar categoria (apenas unidades, não CPD) ────────────
        if (!isCPD() && unitName) {
          const confState = getCatConfirmState(unitName, cat, stockObj);
          const confBtn = el('button', {
            cls: 'cat-confirm-btn' + (confState === 'confirmed' ? ' confirmed' : confState === 'needs-reconfirm' ? ' needs-reconfirm' : ''),
            title: confState === 'confirmed' ? 'Categoria confirmada' : confState === 'needs-reconfirm' ? 'Reconfirmação necessária' : 'Confirmar contagem desta categoria'
          });
          const confInfo = catConfirmations[unitSlug(unitName)] && catConfirmations[unitSlug(unitName)][cat];
          confBtn.textContent = confState === 'confirmed'
            ? '\u2713 ' + confInfo.name
            : confState === 'needs-reconfirm'
              ? '\u26A0\uFE0F Reconfirmar'
              : 'Confirmar';
          confBtn.setAttribute('data-conf-cat', cat);
          confBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confState === 'confirmed') {
              // Já confirmada: mostrar menu com opções
              const existing = document.getElementById('conf-menu-' + CSS.escape(cat));
              if (existing) { existing.remove(); return; }
              const menu = el('div', {
                style: 'position:absolute;z-index:2000;background:var(--surface);' +
                       'border:1.5px solid var(--border);border-radius:var(--radius);' +
                       'box-shadow:0 4px 16px rgba(0,0,0,.2);min-width:180px;overflow:hidden'
              });
              menu.id = 'conf-menu-' + CSS.escape(cat);
              const rect = confBtn.getBoundingClientRect();
              menu.style.cssText += ';position:fixed;top:'+(rect.bottom+4)+'px;left:'+rect.left+'px';
              const reconfOpt = el('button', {
                style:'display:block;width:100%;text-align:left;padding:10px 14px;font-size:13px;' +
                      'border:none;background:none;cursor:pointer;color:var(--text)'
              }, '✏️ Reconfirmar');
              reconfOpt.addEventListener('click', () => {
                menu.remove();
                openConfirmModal(
                  'Reconfirmar: ' + cat,
                  'Atualize a confirmação desta categoria.',
                  (name) => {
                    confirmCategory(unitName, cat, name, stockObj);
                    if (dailyRequiredCatsConfirmed(unitName, stockObj) && !getGeneralConfirmState(unitName)) {
                      toast('\u2705 Refrigerados e Estoque Seco confirmados! Confirme a Contagem Geral para finalizar.');
                    } else {
                      toast('\u2713 ' + cat + ' reconfirmada por ' + name);
                    }
                    render();
                  }
                );
              });
              const deconfOpt = el('button', {
                style:'display:block;width:100%;text-align:left;padding:10px 14px;font-size:13px;' +
                      'border:none;background:none;cursor:pointer;color:var(--danger,#A03A3A);' +
                      'border-top:1px solid var(--border)'
              }, '✕ Desconfirmar');
              deconfOpt.addEventListener('click', () => {
                menu.remove();
                if (confirm('Desconfirmar "' + cat + '"? A categoria deixará de aparecer no PDF geral.')) {
                  deconfirmCategory(unitName, cat);
                  toast(cat + ' desconfirmada');
                  render();
                }
              });
              menu.appendChild(reconfOpt);
              menu.appendChild(deconfOpt);
              document.body.appendChild(menu);
              // Fechar ao clicar fora
              setTimeout(() => {
                document.addEventListener('click', function _close(ev) {
                  if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click', _close); }
                });
              }, 50);
            } else {
              // Não confirmada: abrir modal de confirmação diretamente
              openConfirmModal(
                'Confirmar: ' + cat,
                'Confirme a contagem desta categoria digitando seu nome.',
                (name) => {
                  confirmCategory(unitName, cat, name, stockObj);
                  if (dailyRequiredCatsConfirmed(unitName, stockObj) && !getGeneralConfirmState(unitName)) {
                    toast('\u2705 Refrigerados e Estoque Seco confirmados! Confirme a Contagem Geral para finalizar.');
                  } else {
                    toast('\u2713 ' + cat + ' confirmada por ' + name);
                  }
                  render();
                }
              );
            }
          });
          catWrap.appendChild(confBtn);

          // PDF da categoria liberado independente de confirmação — a
          // confirmação é um controle de processo (quem contou, quando),
          // não deve impedir tirar uma conferência em PDF a qualquer momento.
        }

        catWrap.appendChild(catPdfBtn);
        catTd.appendChild(catWrap);
      } else {
        catTd.appendChild(togBtn);
      }
      catTr.appendChild(catTd);
      tbody.appendChild(catTr);

      catItems.forEach(item => {
        const qty = stockObj[item.id] || 0;
        const min = useMin ? (minimums[item.id] || 0) : 0;
        const isZero = qty === 0;
        const isLow  = min > 0 && qty < min && !isZero;
        const isOk   = !isZero && !isLow;

        // Estado de confirmação da contagem desta janela
        const confirmed = showConfirm && unitName ? isConfirmed(unitName, item.id) : false;
        // 27/07: "estoque mínimo" por item desativado para unidades — mínimo
        // de unidade agora só existe dentro da lógica de Envios do Dia
        // (MIN_PER_DAY_*). window.unitMinimums (pizza_unit_minimums) fica
        // reservado só para o CPD; uma nova lógica está planejada em breve.
        const uMin = 0;
        let confirmState = 'none';
        if (confirmed) {
          confirmState = qty === 0 ? 'danger' : (uMin > 0 && qty < uMin ? 'warn' : 'ok');
        }

        const tr = el('tr', {});
        tr.setAttribute('data-cat', cat);
        tr.setAttribute('data-item-id', item.id);   // patch cirúrgico
        tr.setAttribute('data-item-name', item.name); // busca sem recriar DOM
        tr.setAttribute('data-item-key', item.key);   // chave fixa p/ A Enviar (não muda com rename)
        if (!isOpen) tr.style.display = 'none';
        // Cor da linha: confirmados → classes CSS; CPD → background direto
        if (showConfirm && confirmed) {
          tr.className = 'count-' + (confirmState === 'ok' ? 'ok' : confirmState === 'warn' ? 'warn' : 'danger');
        } else if (useMin && isZero) tr.style.background = 'var(--danger-bg)';
        else if (useMin && isLow) tr.style.background = 'var(--warning-bg)';

        const nameTd = el('td', {cls:'item-name'});
        nameTd.textContent = item.name;
        nameTd.style.fontWeight = qty>0?'500':'400';
        const dotColor = isZero ? 'var(--danger)' : isLow ? '#E8A020' : '';
        const inlineText = item.unit + (min>0 ? ` \u00B7 m\u00EDn: ${min}` : '');
        const inlineUnit = el('span', {cls:'item-unit-inline', style: dotColor?`color:${dotColor};font-weight:600`:''}, inlineText);
        nameTd.appendChild(inlineUnit);

        tr.appendChild(nameTd);

        if (editable) {
          // Medida (read-only in CPD panel \u2014 edit in Cat\u00E1logo)
          tr.appendChild(el('td', {cls:'muted col-unit'}, item.unit));

          // M\u00EDnimo cell (read-only in CPD panel -- edit in Cat\u00E1logo)
          if (showMin) {
            const minTd = el('td', {cls:'col-min', style:'text-align:right;padding-right:10px'});
            const curMin = minimums[item.id] || 0;
            minTd.appendChild(el('span', {style:'font-size:12px;color:var(--text-3)'}, curMin > 0 ? String(curMin) : '\u2014'));
            tr.appendChild(minTd);
          }

          const ctrlTd = el('td', {cls:'qty-controls-cell', style:'text-align:right; padding: 6px 16px;'});
          const wrap2 = el('div', {cls:'qty-controls'});
          const rowLocked = lockByWindow && !categoriaLiberada(item.category);
          if (rowLocked) wrap2.style.opacity = '0.45';
          const minBtn = el('button', {cls:'qty-btn-sm'}, '-');
          if (rowLocked) minBtn.disabled = true;

          // Colour input based on stock status
          let inpCls = 'qty-inp-sm';
          if (qty > 0 && isOk) inpCls += ' has-val';
          else if (isLow) inpCls += ' has-val'; // will show orange via row bg
          else if (isZero && min > 0) inpCls += ' has-error';
          else if (qty > 0) inpCls += ' has-val';

          const inp = el('input', {
            type: 'text', inputmode: 'decimal', pattern: '[0-9]*',
            cls: inpCls, value: String(qty)
          });
          inp.setAttribute('data-qty-input', item.id); // para patch cirúrgico
          if (rowLocked) { inp.disabled = true; inp.title = 'Contagem dispon\u00EDvel ' + proximaJanela(item.category); }
          const plusBtn = el('button', {cls:'qty-btn-sm'}, '+');
          if (rowLocked) plusBtn.disabled = true;
          // Long press: clique rápido = ±1; segurar = ±1 a cada 100ms
          {
            let _pt = null, _pi = null;
            const _getQ = () => parseFloat(inp.value.replace(',','.')) || 0;
            const _doStep = d => {
              // Botões +/- usam debounce reduzido (300ms) para resposta mais rápida
              const q = _getQ() + d;
              const clampedQ = Math.max(0, isNaN(q) ? 0 : q);
              inp.value = String(clampedQ);
              // Atualizar visual imediatamente
              if (typeof inlineUnit !== 'undefined' && inlineUnit) {
                inlineUnit.textContent = clampedQ > 0 ? String(clampedQ) : '';
              }
              // Cancelar timer anterior e agendar com 300ms
              clearTimeout(saveTimer[item.id]);
              saveTimer[item.id] = setTimeout(() => {
                if (typeof onUpdate === 'function') {
                  const raw = parseFloat(inp.value.replace(',','.'));
                  onUpdate(item.id, Math.max(0, isNaN(raw) ? 0 : raw));
                }
              }, 300);
            };
            const _start = d => { _doStep(d); _pt = setTimeout(() => { _pi = setInterval(() => _doStep(d), 100); }, 450); };
            const _stop  = () => { clearTimeout(_pt); clearInterval(_pi); };
            minBtn.addEventListener('mousedown',   () => _start(-1));
            minBtn.addEventListener('mouseup',     _stop);
            minBtn.addEventListener('mouseleave',  _stop);
            minBtn.addEventListener('touchstart',  e => { e.preventDefault(); _start(-1); }, {passive:false});
            minBtn.addEventListener('touchend',    e => { e.preventDefault(); _stop(); },   {passive:false});
            minBtn.addEventListener('touchcancel', _stop);
            plusBtn.addEventListener('mousedown',  () => _start(+1));
            plusBtn.addEventListener('mouseup',    _stop);
            plusBtn.addEventListener('mouseleave', _stop);
            plusBtn.addEventListener('touchstart', e => { e.preventDefault(); _start(+1); }, {passive:false});
            plusBtn.addEventListener('touchend',   e => { e.preventDefault(); _stop(); },   {passive:false});
            plusBtn.addEventListener('touchcancel',_stop);
          }
          inp.addEventListener('focus', () => { setTimeout(() => inp.select(), 50); }); // seleciona tudo ao focar
          inp.addEventListener('change', () => { updateQty(item.id, inp.value, inp, tr, inlineUnit); });
          inp.addEventListener('blur',   () => { updateQty(item.id, inp.value, inp, tr, inlineUnit); });
          wrap2.appendChild(minBtn); wrap2.appendChild(inp); wrap2.appendChild(plusBtn);
          ctrlTd.appendChild(wrap2);
          tr.appendChild(ctrlTd);

          // Botão confirmar contagem (apenas nas unidades, quando showConfirm=true)
          if (showConfirm && unitName) {
            const confTd = el('td', {style:'width:38px;padding:4px 8px 4px 2px;text-align:center'});
            const confBtn = el('button', {
              cls: 'confirm-btn' + (confirmed ? ' confirmed-' + confirmState : ''),
              title: confirmed ? 'Confirmado — clique para desfazer' : 'Confirmar contagem deste item'
            });
            confBtn.innerHTML = '\u2713';
            confBtn.addEventListener('click', () => {
              const nowConfirmed = isConfirmed(unitName, item.id);
              const newState = !nowConfirmed;
              setConfirmed(unitName, item.id, newState);
              pruneCountedMap();
              if (newState) {
                const curQty = parseFloat(inp.value.replace(',','.')) || 0;
                const curUMin = 0; // 27/07: estoque mínimo por item desativado para unidades
                const st = curQty === 0 ? 'danger' : (curUMin > 0 && curQty < curUMin ? 'warn' : 'ok');
                confBtn.className = 'confirm-btn confirmed-' + st;
                tr.className = 'count-' + st;
                tr.style.background = '';
              } else {
                confBtn.className = 'confirm-btn';
                tr.className = '';
                tr.style.background = '';
              }
            });
            confTd.appendChild(confBtn);
            tr.appendChild(confTd);
          }
        } else {
          // Read-only: show qty with status colour + min as small text
          const qtyColor = isZero ? 'var(--danger)' : isLow ? '#E8A020' : 'var(--success)';
          const qtyTd = el('td', {style:`text-align:right;font-weight:700;color:${qtyColor}`});
          qtyTd.setAttribute('data-qty-cell', item.id);
          qtyTd.textContent = String(qty);
          if (min > 0) {
            const minLabel = el('div', {style:'font-size:10px;color:var(--text-3);font-weight:400'}, `m\u00EDn: ${min}`);
            qtyTd.appendChild(minLabel);
          }
          tr.appendChild(qtyTd);
          if (hasEnviarCol) {
            // A Enviar = max(0, Mínimo do Dia de Entrega − Estoque Atual)
            // Prioridade: unitForDisplay (aba de unidade) > pdfLabel > unitName
            const _unitDisp = opts.unitForDisplay || opts.pdfLabel || opts.unitName || '';
            const _day = nextEnviarDay();
            const _contado = itemFoiContado(_unitDisp, item.id, qty);
            const aEnviar = _contado ? calcAEnviar(_unitDisp, item.key, qty, _day) : 0;
            const envTd = el('td', {style:'text-align:right;font-weight:700;color:' + (!_contado ? '#E8A020' : (aEnviar > 0 ? 'var(--accent-dark,#1A5229)' : 'var(--text-3)'))});
            envTd.setAttribute('data-aenviar-cell', item.id);
            envTd.textContent = !_contado ? 'NC' : (aEnviar > 0 ? String(aEnviar) : '\u2014');
            // item.key é fixo (não muda com rename), então a busca aqui é
            // direta — sem precisar normalizar nome nenhum.
            const _minMap = getMinPerDay(_unitDisp);
            const _minEntry = _minMap[item.key];
            const _minDia = _minEntry ? (_minEntry[_day] || 0) : 0;
            envTd.title = !_contado
              ? 'Item ainda n\u00E3o contado nesta janela \u2014 contagem necess\u00E1ria antes de calcular o quanto enviar.'
              : ('M\u00EDn (' + _day + '): ' + _minDia + ' | Estoque: ' + qty + ' | A Enviar: ' + aEnviar);
            tr.appendChild(envTd);
          }
          tr.appendChild(el('td', {cls:'muted col-unit'}, item.unit));
          tr.appendChild(el('td', {}));
        }
        tbody.appendChild(tr);
      });
      rowCache[cat] = true; // marcar como montado no primeiro render
    });
  }

  renderRows('');
  searchInp.addEventListener('input', e => renderRows(e.target.value));
  return wrap;
}

// Modal de seleção de categorias antes de gerar o PDF de contagem (CPD ou
// unidade). Permite escolher só as categorias que devem entrar no PDF.
function openPdfCategoriesModal(pdfLabel, stockObj, categories) {
  const overlay = el('div', {cls:'confirm-modal-overlay'});
  const box = el('div', {cls:'confirm-modal-box'});

  const hdr = el('div', {cls:'confirm-modal-hdr'});
  hdr.appendChild(el('div', {cls:'confirm-modal-title'}, 'Gerar PDF de Contagem'));
  hdr.appendChild(el('div', {cls:'confirm-modal-sub'}, 'Selecione as categorias que devem entrar no PDF.'));
  box.appendChild(hdr);

  const body = el('div', {cls:'confirm-modal-body'});
  const selectRow = el('div', {style:'display:flex;gap:8px;margin-bottom:10px'});
  const selAllBtn  = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:11px;padding:4px 10px'}, 'Selecionar todas');
  const selNoneBtn = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:11px;padding:4px 10px'}, 'Nenhuma');
  selectRow.appendChild(selAllBtn);
  selectRow.appendChild(selNoneBtn);
  body.appendChild(selectRow);

  const listWrap = el('div', {style:'display:flex;flex-direction:column;gap:8px'});
  const checks = [];
  (categories || []).forEach(cat => {
    const label = el('label', {style:'display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer'});
    const cb = el('input', {type:'checkbox'});
    cb.checked = true;
    label.appendChild(cb);
    label.appendChild(document.createTextNode(cat));
    listWrap.appendChild(label);
    checks.push({ cat, cb });
  });
  body.appendChild(listWrap);
  box.appendChild(body);

  selAllBtn.addEventListener('click', () => checks.forEach(c => { c.cb.checked = true; }));
  selNoneBtn.addEventListener('click', () => checks.forEach(c => { c.cb.checked = false; }));

  const ftr = el('div', {cls:'confirm-modal-ftr'});
  const cancelBtn = el('button', {cls:'btn btn-outline btn-sm'}, 'Cancelar');
  cancelBtn.addEventListener('click', () => overlay.remove());
  const okBtn = el('button', {cls:'btn btn-sm', style:'background:var(--accent,#1A5229);color:#fff'}, 'Gerar PDF');
  okBtn.addEventListener('click', () => {
    const selected = checks.filter(c => c.cb.checked).map(c => c.cat);
    if (selected.length === 0) { toast('Selecione ao menos uma categoria.'); return; }
    overlay.remove();
    printStockPdf(pdfLabel, stockObj, selected);
  });
  ftr.appendChild(cancelBtn);
  ftr.appendChild(okBtn);
  box.appendChild(ftr);

  overlay.appendChild(box);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// Baixa um PDF já montado como string "binária-segura" (cada caractere =
// 1 byte, valores 0-255 — é assim que todo o texto do PDF é construído
// nas funções geradoras, via pdfStr()/String.fromCharCode) usando um
// data: URI em base64, em vez de blob: + URL.createObjectURL.
// Motivo: quando o app é aberto direto do arquivo (file://) ou dentro de
// um navegador/webview mais restrito, o download via blob: às vezes não
// dispara e não mostra erro nenhum — só "não acontece nada". data: URI é
// bem mais confiável nesses casos e não precisa de nenhuma API extra.
function _baixarPdfString(pdfBinaryStr, fname) {
  let base64;
  try {
    base64 = btoa(pdfBinaryStr);
  } catch (e) {
    // Caractere fora do intervalo 0-255 escapou de algum ponto do gerador —
    // não deveria acontecer, mas evita quebrar o download por causa disso.
    console.warn('[PDF] Caractere inválido no conteúdo, substituindo por "?":', e);
    base64 = btoa(pdfBinaryStr.replace(/[^\x00-\xFF]/g, '?'));
  }
  const dataUri = 'data:application/pdf;base64,' + base64;

  // Safari no iPhone/iPad não respeita o atributo "download" de um <a>, e
  // testamos que abrir o data: URI direto numa aba nova (window.open) também
  // não funciona de forma confiável — fica tela preta. O jeito mais robusto
  // conhecido pro Safari é montar um Blob real (não base64 puro) e abrir a
  // URL de objeto gerada a partir dele — funciona melhor com arquivos
  // maiores e é o padrão mais usado pra isso no Safari.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS se identifica como Mac
  if (isIOS) {
    try {
      const bytes = new Uint8Array(pdfBinaryStr.length);
      for (let i = 0; i < pdfBinaryStr.length; i++) bytes[i] = pdfBinaryStr.charCodeAt(i) & 0xFF;
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const blobUrl = URL.createObjectURL(blob);
      const win = window.open(blobUrl, '_blank');
      if (!win) {
        if (typeof toast === 'function') toast('Permita pop-ups para ver o PDF, ou tente novamente.');
        window.location.href = blobUrl;
      }
      // Não revoga o blobUrl logo em seguida de propósito — a aba nova
      // ainda precisa carregar o conteúdo; o navegador libera a memória
      // sozinho quando a aba/documento que a usa é fechado.
    } catch (e) {
      console.warn('[PDF] Falha ao gerar Blob no iOS, tentando data URI como último recurso:', e);
      const win = window.open(dataUri, '_blank');
      if (!win) window.location.href = dataUri;
    }
    return;
  }

  const a = document.createElement('a');
  a.href = dataUri;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function printStockPdf(unitLabel, stockObj, onlyCategory) {
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'});
  const timeStr = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const user = session?.name || '';

  // Sempre buscar o estoque mais atual de unitStock[] na hora de gerar, em vez
  // de confiar só no `stockObj` recebido por parâmetro. Motivo: os botões de
  // PDF capturam `ustock` no momento do render(); se os dados do Firebase
  // ainda não tinham chegado nesse momento, esse objeto fica "congelado"
  // vazio — e como updates seguintes só repintam a tabela na tela
  // (patchStockValues), sem recriar o botão, o PDF podia sair zerado mesmo
  // com a tela mostrando os números certos. Buscando de novo aqui garante
  // que o PDF sempre reflete o estado mais recente em memória.
  if (unitLabel !== 'CPD' && typeof unitStock !== 'undefined' && unitStock[unitLabel]) {
    stockObj = unitStock[unitLabel];
  }

  // Group items by category — TODOS os itens, inclusive zerados e sem mínimo
  // PDF: usar catálogo específico da unidade
  const _unitInfo  = (unitLabel !== 'CPD') ? getUnitCatalog(unitLabel) : null;
  const pdfCatSrc  = (unitLabel === 'CPD') ? catalog   : _unitInfo.catalog;
  const pdfCats    = (unitLabel === 'CPD') ? CATEGORIES : _unitInfo.categories;
  // onlyCategory pode ser uma string (uma categoria) ou um array (várias
  // categorias selecionadas no modal de seleção) — normaliza para array.
  const _catFilter = onlyCategory
    ? (Array.isArray(onlyCategory) ? onlyCategory : [onlyCategory])
    : null;
  const byCategory = {};
  pdfCats.forEach(cat => { byCategory[cat] = []; });
  pdfCatSrc.forEach(item => {
    if (_catFilter && !_catFilter.includes(item.category)) return;
    const qty = stockObj[item.id] || 0;
    const min = minimums[item.id] || 0;
    if (!byCategory[item.category]) byCategory[item.category] = [];
    byCategory[item.category].push({name: item.name, key: item.key, unit: item.unit, qty, min});
  });
  // Remove categorias sem nenhum item cadastrado (ou fora do filtro)
  pdfCats.forEach(cat => { if (byCategory[cat].length === 0) delete byCategory[cat]; });

  // Build PDF rows
  const W = 595, ML = 40, MR = 40, TW = W - ML - MR;
  const showMinCol = unitLabel === 'CPD';

  // Coluna "A Enviar": calcular para unidades a partir do plano de envios
  // Detectar o próximo dia de entrega (SEG=1, QUA=3, SEX=5 em getDay())
  const _hoje = new Date();
  const _diaSemana = _hoje.getDay(); // 0=dom,...,6=sab
  const _diaMap = {1:'SEG', 3:'QUA', 5:'SEX'};
  // Encontrar o próximo dia de entrega (hoje se for dia de entrega, senão o próximo)
  let _enviarDay = null;
  for (let d = 0; d <= 6; d++) {
    const dd = (_diaSemana + d) % 7;
    if (_diaMap[dd]) { _enviarDay = _diaMap[dd]; break; }
  }
  // Construir mapa nome_normalizado → quantidade a enviar para esta unidade
  const _norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const _enviarMap = {};
  if (!showMinCol && _enviarDay && typeof envios === 'object' && envios) {
    Object.values(envios).forEach(catData => {
      if (!catData.items) return;
      catData.items.forEach(planItem => {
        const q = planItem.qty && planItem.qty[unitLabel] && planItem.qty[unitLabel][_enviarDay];
        if (q > 0) _enviarMap[_norm(planItem.name)] = q;
      });
    });
  }
  // Mostrar coluna A Enviar se há mínimos definidos para a unidade e dia
  const _minPDFMap = typeof getMinPerDay === 'function' ? getMinPerDay(unitLabel) : {};
  const showEnviarCol = !showMinCol && _enviarDay && Object.keys(_minPDFMap).length > 0;

  // Larguras de coluna dinâmicas
  const colW = showMinCol
    ? [TW*0.55, TW*0.15, TW*0.15, TW*0.15]          // ITEM | UN | MIN | QTD
    : showEnviarCol
      ? [TW*0.52, TW*0.12, TW*0.18, TW*0.18]         // ITEM | UN | QTD | A ENVIAR
      : [TW*0.64, TW*0.18, TW*0.18];                  // ITEM | UN | QTD
  const colX = showMinCol
    ? [ML, ML+colW[0], ML+colW[0]+colW[1], ML+colW[0]+colW[1]+colW[2]]
    : showEnviarCol
      ? [ML, ML+colW[0], ML+colW[0]+colW[1], ML+colW[0]+colW[1]+colW[2]]
      : [ML, ML+colW[0], ML+colW[0]+colW[1]];
  let y = 0;
  const ops = [];
  const pages = [];
  // --- Bloco de assinaturas ---
  function addSignatureBlock() {
    if (y < 120) { if (ops.length) pages.push(ops.splice(0)); y = 760; }
    y -= 20;
    ops.push(ML + ' ' + y + ' m ' + (W-MR) + ' ' + y + ' l 0.6 0.6 0.6 RG S 0 0 0 RG');
    y -= 16;
    ops.push('BT /F1 9 Tf ' + ML + ' ' + y + ' Td (Assinaturas) Tj ET');
    y -= 30;
    var lw = (TW - 40) / 2;
    var x1 = ML, x2 = ML + lw + 40;
    ops.push(x1 + ' ' + y + ' m ' + (x1+lw) + ' ' + y + ' l S');
    ops.push(x2 + ' ' + y + ' m ' + (x2+lw) + ' ' + y + ' l S');
    y -= 14;
    ops.push('BT /F2 8 Tf ' + x1 + ' ' + y + ' Td (Estoquista) Tj ET');
    ops.push('BT /F2 8 Tf ' + x2 + ' ' + y + ' Td (Gerente da Unidade) Tj ET');
    y -= 6;
    ops.push('BT /F2 7 Tf ' + x1 + ' ' + y + ' Td (Nome e assinatura) Tj ET');
    ops.push('BT /F2 7 Tf ' + x2 + ' ' + y + ' Td (Nome e assinatura) Tj ET');
  }


  function newPage() {
    if (ops.length) pages.push(ops.splice(0));
    y = 780;
    // Header
    ops.push(`BT /F1 16 Tf ${ML} ${y} Td ${pdfStr("Sesconetto's - Contagem de Estoque" + (_catFilter ? ' - ' + _catFilter.join(', ') : ''))} Tj ET`);
    y -= 20;
    ops.push(`BT /F2 10 Tf ${ML} ${y} Td ${pdfStr(unitLabel + '  |  ' + dateStr + ' as ' + timeStr + '  |  ' + user)} Tj ET`);
    y -= 8;
    ops.push(`${ML} ${y} m ${W-MR} ${y} l S`);
    y -= 14;
    // Col headers com cores distintas por coluna
    ops.push(`0 0 0 rg`); // preto para ITEM e UN
    ops.push(`BT /F1 9 Tf ${colX[0]} ${y} Td (ITEM) Tj ET`);
    ops.push(`BT /F1 9 Tf ${colX[1]} ${y} Td (UN.) Tj ET`);
    if (showMinCol) {
      ops.push(`0.5 0.3 0 rg`); // marrom para MIN
      ops.push(`BT /F1 9 Tf ${colX[2]} ${y} Td (MIN.) Tj ET`);
      ops.push(`0.1 0.45 0.2 rg`); // verde escuro para QTD
      ops.push(`BT /F1 9 Tf ${colX[3]} ${y} Td (QTD) Tj ET`);
      ops.push(`0 0 0 rg`);
    } else if (showEnviarCol) {
      ops.push(`0.1 0.45 0.2 rg`); // verde para QTD
      ops.push(`BT /F1 9 Tf ${colX[2]} ${y} Td (QTD) Tj ET`);
      ops.push(`0.1 0.25 0.65 rg`); // azul para A ENVIAR
      ops.push(`BT /F1 9 Tf ${colX[3]} ${y} Td (A ENVIAR - ${_enviarDay}) Tj ET`);
      ops.push(`0 0 0 rg`);
    } else {
      ops.push(`0.1 0.45 0.2 rg`);
      ops.push(`BT /F1 9 Tf ${colX[2]} ${y} Td (QTD) Tj ET`);
      ops.push(`0 0 0 rg`);
    }
    y -= 6;
    ops.push(`${ML} ${y} m ${W-MR} ${y} l S`);
    y -= 12;
  }

  function pdfStr(s) {
    // WinAnsiEncoding: latin-1 chars (0x00-0xFF) são suportados pelo Helvetica
    // Chars acima de 0xFF são substituídos pelo equivalente mais próximo
    const latin1Map = {
      '\u0100':'A','\u0101':'a','\u0102':'A','\u0103':'a','\u0104':'A','\u0105':'a',
      '\u0106':'C','\u0107':'c','\u010C':'C','\u010D':'c',
      '\u0110':'D','\u0111':'d','\u011A':'E','\u011B':'e',
      '\u0118':'E','\u0119':'e','\u011E':'G','\u011F':'g',
      '\u0130':'I','\u0131':'i','\u0141':'L','\u0142':'l',
      '\u0143':'N','\u0144':'n','\u0147':'N','\u0148':'n',
      '\u0150':'O','\u0151':'o','\u0152':'OE','\u0153':'oe',
      '\u0158':'R','\u0159':'r','\u015A':'S','\u015B':'s',
      '\u015E':'S','\u015F':'s','\u0160':'S','\u0161':'s',
      '\u0164':'T','\u0165':'t','\u016E':'U','\u016F':'u',
      '\u0170':'U','\u0171':'u','\u0178':'Y','\u0179':'Z',
      '\u017A':'z','\u017B':'Z','\u017C':'z','\u017D':'Z','\u017E':'z',
    };
    let o = '(';
    for (const ch of String(s)) {
      const c = ch.charCodeAt(0);
      if (ch === '(') o += '\\(';
      else if (ch === ')') o += '\\)';
      else if (ch === '\\') o += '\\\\';
      else if (c < 128) o += ch;
      else if (c <= 0xFF) {
        // Latin-1: emite como octal escape — WinAnsiEncoding mapeia direto
        o += '\\' + c.toString(8).padStart(3, '0');
      } else if (latin1Map[ch]) {
        o += latin1Map[ch];
      } else {
        // Tenta normalizar para NFD e pegar só a base ASCII
        const norm = ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        o += norm.length > 0 && norm.charCodeAt(0) < 128 ? norm : '_';
      }
    }
    return o + ')';
  }

  // Mostrar SEMPRE todas as categorias que têm item cadastrado, contadas ou
  // não, confirmadas ou não. Achado em 26/07: existia uma regra antiga aqui
  // que restringia o PDF geral da unidade só às categorias já CONFIRMADAS —
  // isso fazia o PDF sair praticamente vazio (só cabeçalho + assinatura)
  // sempre que a unidade gerava o PDF antes de confirmar qualquer categoria.
  // O modal de seleção de categorias mascarava isso (sempre manda uma lista,
  // contornando a regra sem querer) — só ficou visível ao testar o botão
  // direto, sem o modal. Confirmação é controle de processo (fechamento do
  // dia), nunca deve decidir o que aparece impresso no PDF.
  const _catsToPrint = Object.keys(byCategory);

  newPage();
  _catsToPrint.forEach(cat => {
    if (!byCategory[cat] || byCategory[cat].length === 0) return;
    if (y < 80) newPage();
    // Category header
    ops.push(`0.85 0.93 0.87 rg ${ML} ${y-2} ${TW} 14 re f 0 0 0 rg`);
    ops.push(`BT /F1 9 Tf ${ML+3} ${y+2} Td ${pdfStr(cat.toUpperCase())} Tj ET`);
    // Nome do confirmador da categoria (apenas unidades)
    if (unitLabel !== 'CPD') {
      const _pSlug = typeof unitSlug === 'function' ? unitSlug(unitLabel) : '';
      const _pConf = catConfirmations[_pSlug] && catConfirmations[_pSlug][cat];
      if (_pConf) {
        const _pTs = new Date(_pConf.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        const _pStr = '\u2713 ' + _pConf.name + '  ' + _pTs;
        ops.push(`BT /F2 7 Tf 0.2 0.5 0.3 rg ${ML+TW-100} ${y+3} Td ${pdfStr(_pStr)} Tj ET 0 0 0 rg`);
      }
    }
    y -= 16;
    byCategory[cat].forEach(item => {
      if (y < 60) newPage();
      const isLow = showMinCol && item.min > 0 && item.qty < item.min;
      const isZero = showMinCol && item.qty === 0 && item.min > 0;
      if (isZero) ops.push(`1 0.9 0.9 rg ${ML} ${y-2} ${TW} 13 re f 0 0 0 rg`);
      else if (isLow) ops.push(`1 0.97 0.87 rg ${ML} ${y-2} ${TW} 13 re f 0 0 0 rg`);
      // Verificar se item foi confirmado na janela atual
      // Verificar confirmação: unidades usam unitCatalog (não catalog do CPD)
      // "Não contado" = qty === 0 E não confirmado via botão ✓
      // qty > 0 = foi contado mesmo sem clicar no botão de confirmação
      let itemConfirmed = true;
      if (!showMinCol && unitLabel !== 'CPD') {
        if (item.qty > 0) {
          itemConfirmed = true;
        } else {
          const catalogItem = unitCatalog.find(i => i.name === item.name);
          itemConfirmed = catalogItem ? isConfirmed(unitLabel, catalogItem.id) : false;
        }
      }
      const itemName = itemConfirmed ? item.name : ('! nao contado ! ' + item.name);
      // ITEM (vermelho se não contado, preto se contado)
      ops.push(itemConfirmed ? `0 0 0 rg` : `0.7 0.1 0.1 rg`);
      ops.push(`BT /F2 8 Tf ${colX[0]+3} ${y+1} Td ${pdfStr(itemName)} Tj ET`);
      ops.push(`0 0 0 rg`);
      ops.push(`BT /F2 8 Tf ${colX[1]+3} ${y+1} Td ${pdfStr(item.unit)} Tj ET`);
      if (showMinCol) {
        ops.push(`0.5 0.3 0 rg`);
        ops.push(`BT /F2 8 Tf ${colX[2]+3} ${y+1} Td (${item.min > 0 ? item.min : '-'}) Tj ET`);
        ops.push(`0.1 0.45 0.2 rg`);
        ops.push(`BT /F1 9 Tf ${colX[3]+3} ${y+1} Td (${item.qty}) Tj ET`);
        ops.push(`0 0 0 rg`);
      } else if (showEnviarCol) {
        // QTD em verde
        ops.push(`0.1 0.45 0.2 rg`);
        ops.push(`BT /F1 9 Tf ${colX[2]+3} ${y+1} Td (${item.qty !== undefined ? item.qty : '-'}) Tj ET`);
        // A ENVIAR: max(0, Mínimo do Dia de Entrega − Estoque Atual)
        // Se o item não foi contado nesta janela, não calculamos "a enviar" a
        // partir de um zero falso — mostramos "NC" (não contado) em vez de número.
        const _estoqueAtual = item.qty || 0;
        const _aEnviar = itemConfirmed ? calcAEnviar(unitLabel, item.key, _estoqueAtual, _enviarDay) : 0;
        ops.push(itemConfirmed ? `0.1 0.25 0.65 rg` : `0.7 0.45 0.05 rg`);
        ops.push(`BT /F1 9 Tf ${colX[3]+3} ${y+1} Td ${itemConfirmed ? ('(' + (_aEnviar > 0 ? _aEnviar : '-') + ')') : '(NC)'} Tj ET`);
        // Fundo azul claro na célula A ENVIAR se tiver valor
        if (itemConfirmed && _aEnviar > 0) {
          const envX = colX[3]; const colWEnv = colW[3];
          ops.splice(ops.length - 1, 0,
            `0.88 0.93 0.98 rg ${envX} ${y-2} ${colWEnv} 13 re f 0 0 0 rg`,
            `0.1 0.25 0.65 rg`
          );
        }
        ops.push(`0 0 0 rg`);
      } else {
        ops.push(`0.1 0.45 0.2 rg`);
        ops.push(`BT /F1 9 Tf ${colX[2]+3} ${y+1} Td (${item.qty !== undefined ? item.qty : '-'}) Tj ET`);
        ops.push(`0 0 0 rg`);
      }
      ops.push(`${ML} ${y-3} m ${W-MR} ${y-3} l 0.9 0.9 0.9 RG S 0 0 0 RG`);
      y -= 14;
    });
    y -= 4;
  });
  addSignatureBlock();
  if (ops.length) pages.push(ops.splice(0));

  // Build PDF
  const font1 = '<<\n/Type /Font\n/Subtype /Type1\n/BaseFont /Helvetica-Bold\n/Encoding /WinAnsiEncoding\n>>';
  const font2 = '<<\n/Type /Font\n/Subtype /Type1\n/BaseFont /Helvetica\n/Encoding /WinAnsiEncoding\n>>';
  let pdf = '%PDF-1.4\n';
  const offsets = [];
  let offset = pdf.length;

  function addObj(n, content) {
    offsets[n] = offset;
    const obj = `${n} 0 obj\n${content}\nendobj\n`;
    pdf += obj; offset += obj.length;
  }

  addObj(1, font1);
  addObj(2, font2);
  addObj(3, `<<\n/Type /Resources\n/Font <<\n/F1 1 0 R\n/F2 2 0 R\n>>\n>>`);

  const pageIds = [];
  const baseObj = 4;
  pages.forEach((pageOps, pi) => {
    const NL = String.fromCharCode(10);
  const stream = pageOps.join(String.fromCharCode(10));
    const lenObj = baseObj + pi*2;
    const pageObj = baseObj + pi*2 + 1;
    addObj(lenObj, `<<\n/Length ${stream.length}\n>>\nstream\n${stream}\nendstream`);
    addObj(pageObj, `<<\n/Type /Page\n/Parent ${baseObj + pages.length*2} 0 R\n/MediaBox [0 0 ${W} 842]\n/Contents ${lenObj} 0 R\n/Resources 3 0 R\n>>`);
    pageIds.push(pageObj);
  });

  const pagesObj = baseObj + pages.length*2;
  addObj(pagesObj, `<<\n/Type /Pages\n/Kids [${pageIds.map(i=>`${i} 0 R`).join(' ')}]\n/Count ${pages.length}\n>>`);
  const catObj = pagesObj + 1;
  addObj(catObj, `<<\n/Type /Catalog\n/Pages ${pagesObj} 0 R\n>>`);

  const xrefOffset = offset;
  const total = catObj + 1;
  let xref = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) xref += `${String(offsets[i]||0).padStart(10,'0')} 00000 n \n`;
  pdf += xref + `trailer\n<<\n/Size ${total}\n/Root ${catObj} 0 R\n>>\nstartxref\n${xrefOffset}\n%%EOF`;

  // _catFilter j\u00e1 normaliza onlyCategory pra array (string \u00fanica ou v\u00e1rias
  // categorias do modal de sele\u00e7\u00e3o) \u2014 usa ele aqui em vez do onlyCategory
  // cru, que quebrava (.toLowerCase n\u00e3o existe em array) quando vinha mais
  // de uma categoria selecionada.
  const catSlug = _catFilter
    ? '-' + (_catFilter.length === 1 ? _catFilter[0] : _catFilter.length + '-categorias')
        .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-')
    : '';
  const fname = `contagem-${unitLabel.toLowerCase().replace(/\s+/g,'-')}${catSlug}-${now.toISOString().slice(0,10)}.pdf`;
  _baixarPdfString(pdf, fname);
  // Sem esse aviso, o download acontece silenciosamente — principalmente no
  // celular, onde não aparece nenhuma notificação visível — e dá a impressão
  // de que "não aconteceu nada" mesmo quando o PDF foi gerado com sucesso.
  if (typeof toast === 'function') toast('✓ PDF gerado! Confira nos downloads do seu aparelho.');
}

let pushTimer = null;
function showPushNotif(title, body, actions=[]) {
  const el_ = document.getElementById('push-toast');
  document.getElementById('push-toast-title').textContent = title;
  document.getElementById('push-toast-body').textContent = body;
  const actDiv = document.getElementById('push-toast-actions');
  actDiv.innerHTML = '';
  actions.forEach(({label, fn}) => {
    const b = el('button', {cls:'btn btn-outline btn-sm', onclick:()=>{ hidePush(); fn(); }}, label);
    actDiv.appendChild(b);
  });
  const closeBtn = el('button', {cls:'btn btn-outline btn-sm', onclick: hidePush}, '\u2715');
  actDiv.appendChild(closeBtn);
  el_.style.display = 'flex';
  clearTimeout(pushTimer);
  pushTimer = setTimeout(hidePush, 8000);
}
function hidePush() {
  document.getElementById('push-toast').style.display = 'none';
  clearTimeout(pushTimer);
}

  const inStock = catalog.filter(i => (cpd[i.id]||0) > 0).length;
  const zeroStock = catalog.length - inStock;

  const metrics = el('div', {cls:'metrics-grid'});
  const makeMetric = (label, value, cls='') => {

  pdfBtn.innerHTML = '\uD83D\uDCC4 PDF Contagem';
  th.appendChild(pdfBtn);
  tableBlock.appendChild(th);
  const inner = el('div', {style:'padding:14px 18px 18px'});

    cpd[itemId] = qty;

    saveItemAtomic(itemId, qty);
  }, { useMin: true, pdfLabel: 'CPD' }));
  tableBlock.appendChild(inner);
  frag.appendChild(tableBlock);


  return frag;
}

  const pdfWrapUnit    = el('div', {style:'display:flex;gap:8px;align-items:center;margin-left:auto'});

      genInfo.textContent = '\u2713 Geral: ' + generalState.name + ' ' + new Date(generalState.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      pdfWrapUnit.appendChild(genInfo);

      progInfo.textContent = _reqDone_u + '/' + _reqCats_u.length + ' obrigatórias confirmadas ('

      'background:var(--accent-bg,#EAF6EF);border:2px solid var(--accent,#1A5229);' +
      'border-radius:var(--radius);padding:16px 20px;margin:0 0 14px'
    });
    const finishText = el('div', {});
    const finishTitle = el('div', {style:'font-weight:700;font-size:15px;color:var(--accent-dark,#1A5229)'},
      '\u2705 Refrigerados e Estoque Seco confirmados');
    const finishSub = el('div', {style:'font-size:13px;color:var(--text-2,#555);margin-top:2px'},

    genBtn.addEventListener('click', () => {

          toast('\u2713 Contagem geral confirmada por ' + name);

  const pdfUnitBtn = el('button', {cls:'btn btn-outline btn-sm'});
