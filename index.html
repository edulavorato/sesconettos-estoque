  // ── Renderizar lotes ───────────────────────────────────────────────────────
  function renderValidBody() {
    bodyEl.innerHTML = '';
    const slug3 = unitSlug(activeValidUnit);
    bodyEl.appendChild(el('div', {cls:'valid-empty'}, '\u23F3 Carregando...'));

    db.ref('dados/validity_control/' + slug3).once('value').then(snap => {
      bodyEl.innerHTML = '';
      const val    = snap.val() || {};
      const lotes  = Object.entries(val).map(([id, d]) => ({ _id: id, ...d }));
      const today2 = new Date(); today2.setHours(0,0,0,0);

      lotes.forEach(l => {
        const dt = new Date(l.data_validade + 'T00:00:00');
        l._diffDays = Math.round((dt - today2) / 86400000);
        l._status   = l._diffDays <= 0 ? 'expired' : l._diffDays <= 7 ? 'alert' : 'ok';
      });

      const _norm2 = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
      const lotesByItem = {};
      lotes.forEach(l => {
        const k = _norm2(l.item_name);
        if (!lotesByItem[k]) lotesByItem[k] = [];
        lotesByItem[k].push(l);
      });

      const ucat  = getUnitCatalog(activeValidUnit).catalog;
      const ucats = getUnitCatalog(activeValidUnit).categories;

      // Resumo de alertas
      const nExp   = lotes.filter(l => l._status === 'expired').length;
      const nAlert = lotes.filter(l => l._status === 'alert').length;
      if (nExp > 0 || nAlert > 0) {
        const resumo = el('div', {style:'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px'});
        if (nExp > 0) {
          const c = el('div', {style:'padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(160,58,58,.1);border:1.5px solid rgba(160,58,58,.3);color:#A03A3A'});
          c.textContent = '\uD83D\uDD34 ' + nExp + ' vencido' + (nExp > 1 ? 's' : '');
          resumo.appendChild(c);
        }
        if (nAlert > 0) {
          const c = el('div', {style:'padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(214,158,46,.1);border:1.5px solid rgba(214,158,46,.3);color:#C07A00'});
          c.textContent = '\uD83D\uDFE1 ' + nAlert + ' alerta' + (nAlert > 1 ? 's' : '');
          resumo.appendChild(c);
        }
        bodyEl.appendChild(resumo);
      }

      // Tabela com TODOS os itens do catálogo
      const tableWrap = el('div', {cls:'table-wrap', style:'padding:0'});
      const table = el('table', {cls:'valid-table', style:'table-layout:fixed'});

      // Larguras das colunas
      const colgroup = document.createElement('colgroup');
      [null, '60px', null, '36px'].forEach((w, i) => {
        const col = document.createElement('col');
        if (w) col.style.width = w;
        colgroup.appendChild(col);
      });
      table.appendChild(colgroup);

      const thead = el('thead');
      const thrHead = el('tr');
      [['Item','left'],['UN','left'],['Lotes cadastrados','right'],['+','center']].forEach(([h, align]) => {
        const th = el('th', {style:'text-align:'+align});
        th.textContent = h;
        thrHead.appendChild(th);
      });
      thead.appendChild(thrHead);
      table.appendChild(thead);

      const tbody = el('tbody');

      // Estado de abertura por categoria — categorias com vencido/alerta já abrem
      // automaticamente (urgência primeiro), as demais começam fechadas
      const openCatsValid = {};

      function toggleValidCat(cat, catTr) {
        openCatsValid[cat] = !openCatsValid[cat];
        const chevron = catTr.querySelector('.vcat-chevron');
        if (chevron) chevron.style.transform = openCatsValid[cat] ? 'rotate(180deg)' : '';
        tbody.querySelectorAll('tr[data-vcat="' + CSS.escape(cat) + '"]').forEach(tr => {
          tr.style.display = openCatsValid[cat] ? '' : 'none';
        });
      }

      ucats.forEach(cat => {
        const catItems = ucat.filter(i => i.category === cat);
        if (!catItems.length) return;

        // Contar alertas nesta categoria
        const catLotesAll = catItems.flatMap(i => lotesByItem[_norm2(i.name)] || []);
        const nExpCat   = catLotesAll.filter(l => l._status === 'expired').length;
        const nAlertCat = catLotesAll.filter(l => l._status === 'alert').length;
        const nLotesCat = catLotesAll.length;
        if (nExpCat > 0 || nAlertCat > 0) openCatsValid[cat] = true;

        const catTr = el('tr', {cls:'valid-cat-row', style:'cursor:pointer;user-select:none'});
        const catTd = el('td');
        catTd.setAttribute('colspan', '4');
        catTd.style.cssText = 'padding:7px 10px';

        const catLeft = el('span', {style:'display:inline-flex;align-items:center;gap:8px'});
        const chevron = el('span', {cls:'vcat-chevron', style:'font-size:10px;transition:transform .2s;display:inline-block' + (openCatsValid[cat] ? ';transform:rotate(180deg)' : '')}, '▼');
        catLeft.appendChild(chevron);
        catLeft.appendChild(el('span', {}, cat));

        // Badges de alerta inline no cabeçalho
        const catRight = el('span', {style:'display:inline-flex;align-items:center;gap:6px;float:right'});
        if (nExpCat > 0) {
          const b = el('span', {style:'font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:rgba(160,58,58,.18);color:#A03A3A'});
          b.textContent = nExpCat + ' vencido' + (nExpCat > 1 ? 's' : '');
          catRight.appendChild(b);
        } else if (nAlertCat > 0) {
          const b = el('span', {style:'font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:rgba(214,158,46,.18);color:#C07A00'});
          b.textContent = nAlertCat + ' alerta' + (nAlertCat > 1 ? 's' : '');
          catRight.appendChild(b);
        }
        const countBadge = el('span', {style:'font-size:10px;color:var(--text-3)'});
        countBadge.textContent = catItems.length + ' itens' + (nLotesCat > 0 ? ' · ' + nLotesCat + ' lote' + (nLotesCat > 1 ? 's' : '') : '');
        catRight.appendChild(countBadge);

        catTd.appendChild(catLeft);
        catTd.appendChild(catRight);
        catTr.appendChild(catTd);
        catTr.addEventListener('click', () => toggleValidCat(cat, catTr));
        tbody.appendChild(catTr);

        const _sevRank = { expired: 0, alert: 1, '': 2 };
        const catItemsWithLotes = catItems.map(item => {
          const itemLotes = (lotesByItem[_norm2(item.name)] || [])
            .slice().sort((a,b) => a.data_validade.localeCompare(b.data_validade));
          const worstStatus = itemLotes.some(l => l._status === 'expired') ? 'expired'
            : itemLotes.some(l => l._status === 'alert') ? 'alert' : '';
          return { item, itemLotes, worstStatus };
        }).sort((a, b) => _sevRank[a.worstStatus] - _sevRank[b.worstStatus]);

        catItemsWithLotes.forEach(({ item, itemLotes, worstStatus }) => {
          const rowBg = worstStatus === 'expired' ? 'var(--danger-bg)' : worstStatus === 'alert' ? 'var(--warning-bg)' : '';
          const tr = el('tr', {style: rowBg ? `background:${rowBg}` : ''});
          tr.setAttribute('data-vcat', cat);
          tr.style.display = openCatsValid[cat] ? '' : 'none';

          // Nome
          const tdName = el('td', {style:'padding-top:10px;padding-bottom:10px'});
          const nameSpan = el('span', {
            style: worstStatus === 'expired' ? 'color:#A03A3A;font-weight:600'
                 : worstStatus === 'alert'   ? 'color:#C07A00;font-weight:600' : ''
          }, item.name);
          tdName.appendChild(nameSpan);
          tr.appendChild(tdName);

          // Unidade
          tr.appendChild(el('td', {style:'color:var(--text-3);font-size:12px'}, item.unit));

          // Lotes inline
          const tdLotes = el('td', {cls:'right'});
          if (!itemLotes.length) {
            tdLotes.appendChild(el('span', {style:'color:var(--text-3);font-size:12px'}, '\u2014'));
          } else {
            const lotesWrap = el('div', {style:'display:flex;flex-direction:column;gap:4px;align-items:flex-end'});
            itemLotes.forEach(l => {
              const loteRow = el('div', {style:'display:flex;align-items:center;gap:6px'});
              const dot = el('span', {cls:'valid-dot ' + l._status});
              const dateStr = new Date(l.data_validade + 'T00:00:00').toLocaleDateString('pt-BR');
              const daysStr = l._diffDays <= 0 ? 'Vencido' : l._diffDays === 1 ? '1 dia' : l._diffDays + 'd';
              const info = el('span', {cls:'valid-date-text ' + l._status, style:'font-size:12px;white-space:nowrap'});
              info.textContent = String(l.quantidade) + ' ' + l.unidade_medida + ' \u00B7 ' + dateStr + ' (' + daysStr + ')';
              const cBtn = el('button', {cls:'valid-lote-consume', style:'width:22px;height:22px;font-size:11px', title:'Marcar consumido'}, '\u2714');
              cBtn.addEventListener('click', e => {
                e.stopPropagation();
                if (!confirm('Remover lote de "' + item.name + '"?')) return;
                db.ref('dados/validity_control/' + slug3 + '/' + l._id).remove()
                  .then(() => { toast('\u2705 Lote removido'); renderValidBody(); })
                  .catch(err => toast('Erro: ' + err.message));
              });
              loteRow.append(dot, info, cBtn);
              lotesWrap.appendChild(loteRow);
            });
            tdLotes.appendChild(lotesWrap);
          }
          tr.appendChild(tdLotes);

          // Botão +
          const tdAdd = el('td', {style:'text-align:center;width:36px;padding:4px 6px'});
          const addBtn = el('button', {cls:'valid-lote-consume', style:'font-size:16px;font-weight:700', title:'Adicionar lote'}, '+');
          addBtn.addEventListener('click', e => {
            e.stopPropagation();
            openAddLoteModal(item, slug3, renderValidBody);
          });
          tdAdd.appendChild(addBtn);
          tr.appendChild(tdAdd);
          tbody.appendChild(tr);
        });
      });

      table.appendChild(tbody);
      tableWrap.appendChild(table);
      bodyEl.appendChild(tableWrap);

    }).catch(e => {
      bodyEl.innerHTML = '';
      bodyEl.appendChild(el('div', {cls:'valid-empty'}, '\u274C Erro: ' + e.message));
    });
  }

  function openAddLoteModal(item, slug3, onSave) {
    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    const today = new Date().toISOString().slice(0,10);
    const overlay = el('div', {cls:'modal-overlay'});
    const box = el('div', {cls:'modal-box', style:'max-width:360px'});
    const hdr = el('div', {cls:'modal-header'});
    hdr.appendChild(el('div', {cls:'modal-title'}, '+ Lote: ' + item.name));
    const closeX = el('button', {cls:'modal-close'}, '\u00D7');
    closeX.addEventListener('click', () => overlay.remove());
    hdr.appendChild(closeX);
    box.appendChild(hdr);
    const body2 = el('div', {cls:'modal-body', style:'padding:16px 18px;display:flex;flex-direction:column;gap:12px'});
    const qtyWrap = el('div');
    qtyWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Quantidade (' + item.unit + ')'));
    const qtyInp = el('input', {type:'number', cls:'confirm-name-input', placeholder:'0', min:'0.01', step:'0.01', style:'width:100%'});
    qtyWrap.appendChild(qtyInp);
    body2.appendChild(qtyWrap);
    const dateWrap = el('div');
    dateWrap.appendChild(el('div', {style:'font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px'}, 'Data de Validade'));
    const dateInp = el('input', {type:'date', cls:'confirm-name-input', style:'width:100%'});
    dateInp.min = today;
    dateWrap.appendChild(dateInp);
    body2.appendChild(dateWrap);
    box.appendChild(body2);
    const errEl = el('div', {style:'padding:0 18px 8px;font-size:12px;color:var(--danger,#A03A3A);display:none'});
    box.appendChild(errEl);
    const ftr = el('div', {cls:'modal-footer'});
    const cancelBtn2 = el('button', {cls:'btn btn-outline btn-sm'}, 'Cancelar');
    cancelBtn2.addEventListener('click', () => overlay.remove());
    const saveBtn2 = el('button', {cls:'btn btn-sm', style:'background:var(--accent,#1A5229);color:#fff'}, 'Salvar');
    saveBtn2.addEventListener('click', () => {
      errEl.style.display = 'none';
      const qty = parseFloat(qtyInp.value);
      if (!qty || qty <= 0) { errEl.textContent = 'Quantidade inválida.'; errEl.style.display = 'block'; return; }
      if (!dateInp.value) { errEl.textContent = 'Informe a data de validade.'; errEl.style.display = 'block'; return; }
      const lote = { item_id: item.id, item_name: item.name, quantidade: qty,
        unidade_medida: item.unit, data_validade: dateInp.value, data_cadastro: today, status_alerta: 'pendente' };
      db.ref('dados/validity_control/' + slug3 + '/' + Date.now()).set(lote)
        .then(() => { overlay.remove(); toast('\u2705 Lote registrado!'); onSave(); })
        .catch(e => { errEl.textContent = 'Erro: ' + e.message; errEl.style.display = 'block'; });
    });
    qtyInp.addEventListener('keydown', e => { if (e.key === 'Enter') dateInp.focus(); });
    dateInp.addEventListener('keydown', e => { if (e.key === 'Enter') saveBtn2.click(); });
    ftr.appendChild(cancelBtn2); ftr.appendChild(saveBtn2);
    box.appendChild(ftr);
    overlay.appendChild(box);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    setTimeout(() => qtyInp.focus(), 100);
  }
  renderValidBody();
  return frag;
}

// ═══ QUADRO DE PRODUÇÃO ════════════════════════════════════════════════════════
const QP_DIAS  = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const QP_AREAS = ['Madalena','Larissa','Maria Laura','Masseiro'];

function viewQuadroProducao() {
  const frag = document.createDocumentFragment();

  // ── Header ────────────────────────────────────────────────────────────────
  const hdrWrap = el('div', {style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px'});
  hdrWrap.appendChild(el('h2', {cls:'table-title'}, 'Quadro de Produção'));
  const pdfBtn = el('button', {cls:'btn btn-outline btn-sm', style:'font-size:12px;margin-left:auto'});
  pdfBtn.textContent = '🖨️ Ordem de Produção';
  pdfBtn.addEventListener('click', () => qpGerarPDF());
  hdrWrap.appendChild(pdfBtn);
  frag.appendChild(hdrWrap);

  // ── Tabs de dia da semana ─────────────────────────────────────────────────
  const todayDow = new Date().getDay(); // 0=Dom
  const todayIdx = (todayDow + 6) % 7; // 0=Seg
  let activeDay = qpGet('activeDay', todayIdx);

  const tabsEl = el('div', {cls:'qp-day-tabs'});
  const bodyEl = el('div', {});
  frag.appendChild(tabsEl);
  frag.appendChild(bodyEl);

  QP_DIAS.forEach((dia, dIdx) => {
    const tab = document.createElement('button');
    tab.className = 'qp-day-tab' + (dIdx === activeDay ? ' active' : '') + (dIdx === todayIdx ? ' today' : '');
    tab.textContent = dia;
    tab.addEventListener('click', () => {
      activeDay = dIdx;
      qpSet('activeDay', dIdx);
      tabsEl.querySelectorAll('.qp-day-tab').forEach((b, i) => {
        b.classList.toggle('active', i === dIdx);
        b.classList.toggle('today', i === todayIdx);
      });
      // Fechar todas as áreas ao trocar de dia
      Object.keys(openAreas).forEach(k => delete openAreas[k]);
      renderQPBody(dIdx);
    });
    tabsEl.appendChild(tab);
  });

  // ── Calcular necessidade de produção ──────────────────────────────────────
  // Para cada ficha técnica, calcula quantos lotes são necessários:
  // 1. Pega o total a enviar para todas as unidades no próximo dia de entrega
  //    que corresponda ao dia selecionado
  // 2. Subtrai o estoque atual do CPD
  // 3. Divide pelo rendimentoFichas (arredondando pra cima)
  // Se resultado <= 0 → item não precisa ser produzido
  function calcLotesSugeridos(ft, cobertura) {
    const _norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    // Buscar item no catálogo CPD pelo cpdId
    const cpdItem = (catalog || []).find(c => c.id === ft.cpdId);
    if (!cpdItem) return { lotes:0, aEnviarTotal:0, estCPD:0, pendente:false };
    const estCPD = cpd[cpdItem.id] || 0;
    // Somar A Enviar de todas as unidades
    let aEnviarTotal = 0;
    let pendente = false; // true se alguma unidade ainda não contou este item nesta janela
    const dayCode = qpDayCode(activeDay);
    if (!dayCode) return { lotes:0, aEnviarTotal:0, estCPD, pendente };
    UNIT_NAMES.forEach(unitName => {
      const ucat   = getUnitCatalog(unitName).catalog;
      const ustock = unitStock[unitName] || {};
      // Somar estoques de todos os IDs do mesmo item nessa unidade
      const matchItems = ucat.filter(i => i.key === cpdItem.key);
      const estUnit = matchItems.reduce((s,i) => s + (ustock[i.id] || 0), 0);
      // Se a unidade ainda não contou este item (estoque 0 sem confirmação),
      // não sabemos o valor real — não somamos ao total, só sinalizamos.
      const _repItem = matchItems[0];
      if (_repItem && !itemFoiContado(unitName, _repItem.id, estUnit)) {
        pendente = true;
        return;
      }
      const aEnv = calcAEnviar(unitName, cpdItem.key, estUnit, dayCode);
      aEnviarTotal += aEnv;
    });
    // Multiplicar pela cobertura (número de entregas a cobrir)
    const necessidade = aEnviarTotal * cobertura;
    const deficit = Math.max(0, necessidade - estCPD);
    const lotes = deficit > 0 ? Math.ceil(deficit / ft.rendFichas) : 0;
    return { lotes, aEnviarTotal, estCPD, pendente };
  }

  // Dia de entrega correspondente ao dia selecionado
  function qpDayCode(dayIdx) {
    // 0=Seg→SEG, 2=Qua→QUA, 4=Sex→SEX; outros dias pegam o próximo dia de entrega
    const MAP = {0:'SEG', 2:'QUA', 4:'SEX'};
    return MAP[dayIdx] || null;
  }

  // ── Verificar alertas de validade para insumos de uma ficha ───────────────
  function getValidadeAlerta(ft) {
    const _norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    const today = new Date(); today.setHours(0,0,0,0);
    const in7   = new Date(today); in7.setDate(in7.getDate() + 7);
    // Verificar se alguma unidade tem lote vencendo de algum insumo desta ficha
    // (simplificado: verificar no validity_control carregado em memória se disponível)
    return false; // placeholder — requer leitura async do Firebase
  }

  // ── Render do body ─────────────────────────────────────────────────────────
  // Estado de abertura por área — persiste entre re-renders do mesmo dia
  const openAreas = {};

  function renderQPBody(dayIdx) {
    bodyEl.innerHTML = '';

    const dayCode = qpDayCode(dayIdx);

    if (!dayCode) {
      const _ew = el('div', {style:'padding:10px 14px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:14px;display:flex;gap:10px;align-items:center'});
      const _etxt = el('div');
      _etxt.appendChild(el('div', {style:'font-size:13px;font-weight:600;color:var(--text-2)'}, 'Dia sem entrega às unidades'));
      _etxt.appendChild(el('div', {style:'font-size:11px;color:var(--text-3);margin-top:2px'}, 'Sem cálculo automático — defina as quantidades manualmente se houver produção avulsa.'));
      _ew.appendChild(_etxt);
      bodyEl.appendChild(_ew);
    }

    // Agrupar fichas por área e calcular necessidade
    const ftPorArea = {};
    QP_AREAS.forEach(a => { ftPorArea[a] = []; });
    let totalLotes = 0, totalLiberados = 0;

    FT_LIBRARY.forEach(ft => {
      const cobertura = parseInt(qpGet(`cob_${ft.id}`, ft.coberturaDefault)) || 1;
      const { lotes, aEnviarTotal, estCPD, pendente } = calcLotesSugeridos(ft, cobertura);
      // Quantidade SEMPRE zero — responsavel decide aceitar a sugestao
      const lotesManuais = qpGet(`qty_${dayIdx}_${ft.id}`, 0);
      const lotesEfetivos = lotesManuais;
      const liberado = qpGet(`lib_${dayIdx}_${ft.id}`, false);
      ftPorArea[ft.area].push({ ft, lotes, aEnviarTotal, estCPD, cobertura, lotesEfetivos, liberado, pendente });
      if (lotesEfetivos > 0) totalLotes++;
      if (liberado) totalLiberados++;
    });

    // Renderizar por área
    QP_AREAS.forEach(area => {
      const items = ftPorArea[area] || [];
      const comNecessidade = items.filter(i => i.lotes > 0);
      const liberadosArea  = items.filter(i => i.liberado && i.lotesEfetivos > 0).length;
      const totalArea      = items.filter(i => i.lotesEfetivos > 0).length;

      const areaWrap = el('div', {style:'margin-bottom:20px'});

      const areaHdr = el('div', {cls:'qp-area-hdr', style:'cursor:pointer;user-select:none'});
      const areaLeft = el('div', {cls:'qp-area-name'});
      const chevron = document.createElement('span');
      chevron.className = 'qp-chevron';
      chevron.style.cssText = 'font-size:10px;transition:transform .2s;display:inline-block;margin-right:6px';
      chevron.textContent = '▼';
      areaLeft.appendChild(chevron);
      const _areaLabel = document.createElement('span');
      _areaLabel.textContent = area;
      areaLeft.appendChild(_areaLabel);
      if (dayCode && comNecessidade.length > 0)
        areaLeft.appendChild(el('span', {cls:'qp-area-badge'}, comNecessidade.length + ' a produzir'));
      else if (dayCode)
        areaLeft.appendChild(el('span', {cls:'qp-area-badge',
          style:'background:rgba(42,145,72,.08);color:var(--text-3)'}, 'tudo OK'));
      areaHdr.appendChild(areaLeft);

      const areaRight = el('div', {style:'display:flex;gap:8px;align-items:center'});
      if (totalArea > 0) {
        areaRight.appendChild(el('span', {cls:'qp-footer-info'},
          liberadosArea + '/' + totalArea + ' liberados'));
        if (liberadosArea < totalArea) {
          const libAllBtn = el('button', {cls:'qp-liberar-all'}, '✓ Liberar tudo');
          libAllBtn.addEventListener('click', e => {
            e.stopPropagation();
            items.forEach(i => {
              if (i.lotesEfetivos > 0 && !i.liberado) qpSet('lib_' + dayIdx + '_' + i.ft.id, true);
            });
            qpSalvarHistorico(dayIdx);
            renderQPBody(dayIdx);
          });
          areaRight.appendChild(libAllBtn);
        }
      }
      areaHdr.appendChild(areaRight);
      areaWrap.appendChild(areaHdr);

      // Tabela de itens
      const tableWrap = el('div', {cls:'table-wrap', style:'padding:0;border-top:none;border-radius:0'});
      const table = el('table', {cls:'qp-table'});

      const thead = el('thead');
      const hrHead = el('tr');
      ['Item / Rendimento','Cobertura','Sugestão','Lotes','Insumos','Obs','Status'].forEach((h,i) => {
        const th = el('th', {cls: i >= 2 && i <= 4 ? 'center' : ''});
        th.textContent = h;
        hrHead.appendChild(th);
      });
      thead.appendChild(hrHead);
      table.appendChild(thead);

      const tbody = el('tbody');

      // Área Masseiro — layout especial
      if (area === 'Masseiro') {
        const massGrid = el('div', {cls:'qp-masseiro-grid'});

        // Card Previsão
        const cardPrev = el('div', {cls:'qp-masseiro-card'});
        cardPrev.appendChild(el('div', {cls:'qp-masseiro-title'}, '📋 Produção prevista'));

        items.forEach(({ft, lotes, lotesEfetivos}) => {
          const row = el('div', {cls:'qp-masseiro-row'});
          row.appendChild(el('span', {style:'color:var(--text-2)'}, ft.nome));
          const inp = el('input', {cls:'qp-masseiro-input', type:'number', min:'0'});
          inp.value = String(lotesEfetivos);
          inp.placeholder = String(lotes);
          inp.title = lotes > 0 ? `Sugestão: ${lotes} lotes` : 'Sem necessidade calculada';
          inp.setAttribute('data-ft-id', ft.id);
          inp.addEventListener('change', () => {
            const v = Math.max(0, parseInt(inp.value) || 0);
            qpSet('qty_' + dayIdx + '_' + ft.id, v);
            // Atualizar cálculo de farinha/fermento inline (sem re-render)
            if (ft.id === 'massa_pizza') {
              const cd = cardPrev.querySelector('.qp-masseiro-calc');
              if (cd) cd.innerHTML = 'Farinha total: <b>' + (v * 10) + 'kg</b> · Fermento: <b>' + (v * 40) + 'g</b>';
            }
          });
          row.appendChild(inp);
          cardPrev.appendChild(row);
        });

        // Cálculo farinha/fermento
        const massaFt = FT_BY_ID['massa_pizza'];
        const massaLotes = parseInt(qpGet(`qty_${dayIdx}_massa_pizza`, calcLotesSugeridos(massaFt, 1).lotes)) || 0;
        const farinhaTotal = massaLotes * 10;
        const fermentoTotal = massaLotes * 40;
        const calcDiv = el('div', {cls:'qp-masseiro-calc'});
        calcDiv.innerHTML = `Farinha total: <b>${farinhaTotal}kg</b> · Fermento: <b>${fermentoTotal}g</b>`;
        cardPrev.appendChild(calcDiv);
        massGrid.appendChild(cardPrev);

        // Card Produzido
        const cardProd = el('div', {cls:'qp-masseiro-card'});
        cardProd.appendChild(el('div', {cls:'qp-masseiro-title'}, '✅ Produzido (preencher ao final)'));
        ['Muçarela','Biga','Massa'].forEach(tipo => {
          const row = el('div', {cls:'qp-masseiro-row'});
          row.appendChild(el('span', {style:'color:var(--text-2)'}, tipo));
          const inp = el('input', {cls:'qp-masseiro-input', type:'number', min:'0',
            style:'border-color:var(--accent)'});
          inp.value = String(qpGet(`prod_${dayIdx}_${tipo}`, ''));
          inp.placeholder = '0';
          inp.addEventListener('change', () => {
            qpSet('prod_' + dayIdx + '_' + tipo, parseInt(inp.value) || 0);
            qpSalvarHistorico(dayIdx);
            // Sem re-render — só salva
          });
          row.appendChild(inp);
          cardProd.appendChild(row);
        });
        massGrid.appendChild(cardProd);
        massGrid.style.display = 'none';
        areaWrap.appendChild(massGrid);

        const massFooter = el('div', {cls:'qp-section-footer'});
        massFooter.style.display = 'none';
        massFooter.appendChild(el('span', {cls:'qp-footer-info'}, 'Ficha: 10kg farinha + 40g fermento por lote de Biga · 10kg farinha por lote de Massa'));
        areaWrap.appendChild(massFooter);

        areaHdr.addEventListener('click', e => {
          if (e.target.closest('button,input,select,textarea')) return;
          openAreas[area] = !openAreas[area];
          const chev = areaHdr.querySelector('.qp-chevron');
          if (chev) chev.style.transform = openAreas[area] ? 'rotate(180deg)' : '';
          massGrid.style.display   = openAreas[area] ? '' : 'none';
          massFooter.style.display = openAreas[area] ? '' : 'none';
        });

        bodyEl.appendChild(areaWrap);
        return;
      }

      items.forEach(({ ft, lotes, aEnviarTotal, estCPD, cobertura, lotesEfetivos, liberado, pendente }) => {
        const tr = el('tr', {cls: (lotes > 0 && dayCode) ? 'qp-precisa' : ''});

        // Nome + rendimento
        const tdNome = el('td');
        const nameSpan = el('div', {cls:'qp-item-name'});
        nameSpan.textContent = ft.nome;
        if (lotes === 0 && dayCode) {
          nameSpan.appendChild(el('span', {cls:'qp-sem-necessidade'}, '✓ Estoque OK'));
        }
        if (pendente && dayCode) {
          nameSpan.appendChild(el('span', {
            style:'display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:#B8740D;background:rgba(232,160,32,.12);padding:1px 6px;border-radius:8px',
            title:'Alguma unidade ainda não contou este item nesta janela — a sugestão abaixo pode estar subestimada.'
          }, '⚠ NÃO CONTADO EM ALGUMA UNIDADE'));
        }
        tdNome.appendChild(nameSpan);
        tdNome.appendChild(el('div', {cls:'qp-rendimento'}, ft.rendimento));
        tr.appendChild(tdNome);

        // Cobertura (select)
        const tdCob = el('td', {style:'text-align:center'});
        const cobSel = el('select', {cls:'qp-cobertura-sel'});
        [1,2,3].forEach(n => {
          const opt = document.createElement('option');
          opt.value = String(n);
          opt.textContent = n + (n === 1 ? ' entrega' : ' entregas');
          if (n === cobertura) opt.selected = true;
          cobSel.appendChild(opt);
        });
        cobSel.addEventListener('change', () => {
          const newCob = parseInt(cobSel.value);
          qpSet(`cob_${ft.id}`, newCob);
          // Recalcular sugestão sem re-renderizar o DOM inteiro
          const { lotes: newLotes } = calcLotesSugeridos(ft, newCob);
          const thisTr = cobSel.closest('tr');
          if (thisTr) {
            const sugEl = thisTr.querySelector('[data-role="sug"]');
            if (sugEl) {
              sugEl.textContent = newLotes > 0 ? '↑ ' + newLotes + ' lotes' : '—';
              sugEl.className = 'qp-sugestao' + (newLotes === 0 ? ' zero' : '');
              sugEl.onclick = newLotes > 0 ? () => {
                qpSet('qty_' + dayIdx + '_' + ft.id, newLotes);
                const qi = thisTr.querySelector('.qp-qty-input');
                if (qi) qi.value = String(newLotes);
              } : null;
            }
          }
        });
        tdCob.appendChild(cobSel);
        if (dayCode) {
          const cobInfo = el('div', {style:'font-size:10px;color:var(--text-3);margin-top:3px'});
          cobInfo.textContent = 'A enviar: ' + aEnviarTotal + ' · CPD: ' + estCPD;
          tdCob.appendChild(cobInfo);
        }
        tr.appendChild(tdCob);

        // Sugestão automática
        const tdSug = el('td', {style:'text-align:center'});
        if (dayCode) {
          const sugSpan = document.createElement('span');
          sugSpan.className = 'qp-sugestao' + (lotes === 0 ? ' zero' : '');
          sugSpan.setAttribute('data-role', 'sug');
          sugSpan.title = lotes > 0 ? 'Clique para usar esta sugestão' : 'Sem necessidade de produção';
          sugSpan.textContent = lotes > 0 ? '↑ ' + lotes + ' lotes' : '—';
          if (lotes > 0) {
            sugSpan.addEventListener('click', () => {
              qpSet('qty_' + dayIdx + '_' + ft.id, lotes);
              const qi = tr.querySelector('.qp-qty-input');
              if (qi) qi.value = String(lotes);
            });
          }
          tdSug.appendChild(sugSpan);
        } else {
          tdSug.appendChild(el('span', {style:'color:var(--text-3);font-size:11px'}, 'manual'));
        }
        tr.appendChild(tdSug);

        // Quantidade de lotes (manual)
        const tdQty = el('td', {style:'text-align:center'});
        const qtyCell = el('div', {cls:'qp-lotes-cell'});
        const minusBtn = el('button', {cls:'qp-qty-btn'}, '−');
        const qtyInp = el('input', {cls:'qp-qty-input', type:'number', min:'0'});
        qtyInp.value = String(lotesEfetivos);
        const plusBtn = el('button', {cls:'qp-qty-btn'}, '+');
        // Atualizar insumos inline sem re-renderizar
        function _updateInsumos(v) {
          qpSet('qty_' + dayIdx + '_' + ft.id, v);
          // Atualizar insDiv na mesma linha
          const thisTr2 = qtyInp.closest('tr');
          if (!thisTr2) return;
          const insDiv2 = thisTr2.querySelector('.qp-insumos');
          if (insDiv2) {
            insDiv2.innerHTML = '';
            if (v > 0) {
              ft.mp.forEach(i => {
                const line = document.createElement('div');
                line.innerHTML = i.n + ': <b>' + +(i.q * v).toFixed(2) + ' ' + i.u + '</b>';
                insDiv2.appendChild(line);
              });
              if (ft.emb && ft.emb.length) {
                ft.emb.forEach(i => {
                  const line = document.createElement('div');
                  line.className = 'qp-insumos emb';
                  line.innerHTML = '[emb] ' + i.n + ': <b>' + +(i.q * v).toFixed(2) + ' ' + i.u + '</b>';
                  insDiv2.appendChild(line);
                });
              }
            } else {
              const dash = document.createElement('span');
              dash.style.cssText = 'color:var(--text-3);font-size:11px';
              dash.textContent = '—';
              insDiv2.appendChild(dash);
            }
          }
          // Atualizar botão liberar
          const libBtn2 = thisTr2.querySelector('.qp-status-btn');
          if (libBtn2 && !libBtn2.classList.contains('liberado')) {
            libBtn2.classList.toggle('disabled', v === 0);
          }
          // Se liberado e zerou, des-liberar
          if (v === 0 && qpGet('lib_' + dayIdx + '_' + ft.id, false)) {
            qpSet('lib_' + dayIdx + '_' + ft.id, false);
            if (libBtn2) {
              libBtn2.classList.remove('liberado');
              libBtn2.textContent = 'Liberar';
            }
          }
        }

        minusBtn.addEventListener('click', () => {
          const v = Math.max(0, (parseInt(qtyInp.value) || 0) - 1);
          qtyInp.value = v;
          _updateInsumos(v);
        });
        plusBtn.addEventListener('click', () => {
          const v = (parseInt(qtyInp.value) || 0) + 1;
          qtyInp.value = v;
          _updateInsumos(v);
        });
        qtyInp.addEventListener('change', () => {
          const v = Math.max(0, parseInt(qtyInp.value) || 0);
          qtyInp.value = v;
          _updateInsumos(v);
        });
        qtyCell.append(minusBtn, qtyInp, plusBtn);
        tdQty.appendChild(qtyCell);
        tr.appendChild(tdQty);

        // Insumos calculados
        const tdIns = el('td');
        const insDiv = el('div', {cls:'qp-insumos'});
        if (lotesEfetivos > 0) {
          ft.mp.forEach(i => {
            const line = el('div');
            line.innerHTML = `${i.n}: <b>${+(i.q * lotesEfetivos).toFixed(2)} ${i.u}</b>`;
            insDiv.appendChild(line);
          });
          if (ft.emb && ft.emb.length) {
            ft.emb.forEach(i => {
              const line = el('div', {cls:'emb'});
              line.innerHTML = `[emb] ${i.n}: <b>${+(i.q * lotesEfetivos).toFixed(2)} ${i.u}</b>`;
              insDiv.appendChild(line);
            });
          }
        } else {
          insDiv.appendChild(el('span', {style:'color:var(--text-3);font-size:11px'}, '—'));
        }
        tdIns.appendChild(insDiv);
        tr.appendChild(tdIns);

        // Observações
        const tdObs = el('td');
        const obsInp = el('textarea', {cls:'qp-obs-input', rows:'2',
          placeholder:'Obs...', style:'min-width:80px'});
        obsInp.value = qpGet(`obs_${dayIdx}_${ft.id}`, '');
        obsInp.addEventListener('change', () => qpSet(`obs_${dayIdx}_${ft.id}`, obsInp.value));
        tdObs.appendChild(obsInp);
        tr.appendChild(tdObs);

        // Status / Liberar
        const tdStatus = el('td', {style:'text-align:center'});
        const libBtn = el('button', {
          cls: 'qp-status-btn' + (liberado ? ' liberado' : lotesEfetivos === 0 ? ' disabled' : ''),
        });
        libBtn.textContent = liberado ? '✓ Liberado' : 'Liberar';
        if (!liberado && lotesEfetivos > 0) {
          libBtn.addEventListener('click', () => {
            qpSet(`lib_${dayIdx}_${ft.id}`, true);
            qpSalvarHistorico(dayIdx);
            renderQPBody(dayIdx);
          });
        } else if (liberado) {
          libBtn.addEventListener('click', () => {
            qpSet(`lib_${dayIdx}_${ft.id}`, false);
            renderQPBody(dayIdx);
          });
        }
        tdStatus.appendChild(libBtn);
        tr.appendChild(tdStatus);

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      tableWrap.appendChild(table);
      tableWrap.style.display = 'none';
      areaWrap.appendChild(tableWrap);

      const footer = el('div', {cls:'qp-section-footer'});
      footer.style.display = 'none';
      footer.appendChild(el('span', {cls:'qp-footer-info'},
        items.filter(i => i.lotes > 0).length + ' com necessidade · ' + liberadosArea + '/' + totalArea + ' liberados'));
      areaWrap.appendChild(footer);

      // Toggle ao clicar no header
      areaHdr.addEventListener('click', e => {
        if (e.target.closest('button,input,select,textarea')) return;
        openAreas[area] = !openAreas[area];
        const chev = areaHdr.querySelector('.qp-chevron');
        if (chev) chev.style.transform = openAreas[area] ? 'rotate(180deg)' : '';
        tableWrap.style.display = openAreas[area] ? '' : 'none';
        footer.style.display    = openAreas[area] ? '' : 'none';
      });

      bodyEl.appendChild(areaWrap);
    });
  }

  renderQPBody(activeDay);
  return frag;
}

// ── Salvar histórico no Firebase ──────────────────────────────────────────────
function qpSalvarHistorico(dayIdx) {
  if (!window._fb || !window._fb.ready || typeof db === 'undefined') return;
  const today = new Date();
  const diff  = dayIdx - ((new Date().getDay() + 6) % 7);
  const d     = new Date(today); d.setDate(d.getDate() + diff);
  const isoDate = d.toISOString().slice(0,10);
  const snapshot = { date: isoDate, day: QP_DIAS[dayIdx], areas: {} };
  QP_AREAS.forEach(area => {
    const items = FT_LIBRARY.filter(f => f.area === area);
    snapshot.areas[area] = items.map(ft => ({
      id: ft.id, nome: ft.nome,
      lotes: qpGet(`qty_${dayIdx}_${ft.id}`, 0),
      liberado: qpGet(`lib_${dayIdx}_${ft.id}`, false),
      obs: qpGet(`obs_${dayIdx}_${ft.id}`, ''),
    })).filter(i => i.lotes > 0 || i.liberado);
  });
  snapshot.masseiro = {
    mucarela: qpGet(`prod_${dayIdx}_Muçarela`, 0),
    biga:     qpGet(`prod_${dayIdx}_Biga`, 0),
    massa:    qpGet(`prod_${dayIdx}_Massa`, 0),
  };
  db.ref('dados/pizza_production_log/' + isoDate).set(snapshot)
    .catch(e => console.warn('[Quadro] Erro ao salvar histórico:', e));
}

// ── PDF Ordem de Produção ─────────────────────────────────────────────────────
function qpGerarPDF() {
  const dayIdx  = qpGet('activeDay', 0);
  const dayName = QP_DIAS[dayIdx];
  const today   = new Date();
  const diff    = dayIdx - ((new Date().getDay() + 6) % 7);
  const d       = new Date(today); d.setDate(d.getDate() + diff);
  const dateStr = d.toLocaleDateString('pt-BR', {weekday:'long',day:'2-digit',month:'long',year:'numeric'});

  let body = '';
  QP_AREAS.forEach(area => {
    const items = FT_LIBRARY.filter(f => f.area === area);
    let linhas = '';
    items.forEach(ft => {
      const lotes = qpGet(`qty_${dayIdx}_${ft.id}`, 0);
      if (!lotes) return;
      const lib = qpGet(`lib_${dayIdx}_${ft.id}`, false);
      const obs = qpGet(`obs_${dayIdx}_${ft.id}`, '');
      let ins = ft.mp.map(i => `${i.n}: <b>${+(i.q*lotes).toFixed(2)} ${i.u}</b>`).join('<br>');
      if (ft.emb && ft.emb.length) ins += '<br>' + ft.emb.map(i =>
        `<span style="color:#2a5080">[emb] ${i.n}: <b>${+(i.q*lotes).toFixed(2)} ${i.u}</b></span>`
      ).join('<br>');
      linhas += `<tr>
        <td class="nm">${lib ? '✓ ' : ''}${ft.nome}<br><span class="rend">${ft.rendimento}</span></td>
        <td class="ct">${lotes}</td>
        <td>${obs}</td>
        <td>${ins || '—'}</td>
      </tr>`;
    });
    if (!linhas) return;
    body += `<h2>${area}</h2>
      <table><thead><tr><th>Preparo</th><th>Lotes</th><th>Obs</th><th>Insumos + Embalagens</th></tr></thead>
      <tbody>${linhas}</tbody></table>`;
  });

  const win = window.open('','_blank');
  if (!win) { toast('Permita pop-ups para gerar o PDF'); return; }
  win.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
    <title>Ordem de Produção — ${dayName}</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Segoe UI',Arial,sans-serif;color:#111;padding:20px;font-size:12px}
      h1{font-size:17px;margin-bottom:2px}
      .sub{color:#555;font-size:11px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #111}
      h2{font-size:13px;margin:16px 0 5px;background:#e8f5ec;padding:5px 8px;border-left:4px solid #1A5229;color:#1a3d26}
      table{width:100%;border-collapse:collapse;margin-bottom:8px}
      th{background:#f0f0f0;border:1px solid #bbb;padding:5px 6px;text-align:left;font-size:10px;text-transform:uppercase}
      td{border:1px solid #ccc;padding:5px 6px;vertical-align:top;font-size:11px}
      td.nm{font-weight:bold;width:22%}.ct{text-align:center;width:7%}
      .rend{font-size:10px;color:#666;font-weight:normal}
      @media print{body{padding:0}h2{page-break-after:avoid}tr{page-break-inside:avoid}}
    </style></head><body>
    <h1>ORDEM DE PRODUÇÃO — CPD SESCONETTO'S</h1>
    <div class="sub">${dayName} · ${dateStr}</div>
    ${body || '<p style="color:#999;padding:20px">Nenhum item com quantidade definida para este dia.</p>'}
    </body></html>`);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 400);
  toast('PDF aberto — Salvar como PDF na impressão');
}

// ═══ HISTÓRICO DE CONTAGENS ═══════════════════════════════════════════════════
function viewHistoricoContagens() {
  const frag = document.createDocumentFragment();

  // ── Header ────────────────────────────────────────────────────────────────
  const hdrWrap = el('div', {style:'display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px'});
  hdrWrap.appendChild(el('h2', {cls:'table-title'}, 'Histórico de Contagens'));
  frag.appendChild(hdrWrap);

  // ── Tabs de unidade ────────────────────────────────────────────────────────
  let activeUnit2 = UNIT_NAMES[0];
  const tabsEl = el('div', {cls:'hist-unit-tabs'});
  const mainEl = el('div', {});
  frag.appendChild(tabsEl);
  frag.appendChild(mainEl);

  function renderHistUnit(unitName) {
    activeUnit2 = unitName;
    tabsEl.querySelectorAll('.hist-unit-tab').forEach(b =>
      b.classList.toggle('active', b.dataset.unit === unitName));
    mainEl.innerHTML = '';

    // Carregar snapshots do Firebase
    const slug = unitSlug(unitName);
    const loadingEl = el('div', {cls:'hist-empty'}, '⏳ Carregando...');
    mainEl.appendChild(loadingEl);

    db.ref('dados/pizza_history/' + slug).once('value').then(snap => {
      mainEl.innerHTML = '';
      const val = snap.val() || {};
      const entries = Object.entries(val)
        .map(([ts, data]) => ({ ts: Number(ts), ...data }))
        .sort((a, b) => b.ts - a.ts); // mais recente primeiro

      if (entries.length === 0) {
        mainEl.appendChild(el('div', {cls:'hist-empty'}, '📭 Nenhuma contagem salva ainda para ' + unitName + '.'));
        return;
      }

      // ── Lista de contagens com checkbox ────────────────────────────────────
      const selected = new Set();
      const infoEl = el('div', {style:'font-size:12px;color:var(--text-3);margin-bottom:10px'});
      infoEl.textContent = entries.length + ' contagem(s) salva(s) — selecione para comparar';
      mainEl.appendChild(infoEl);

      const actionsEl = el('div', {cls:'hist-actions'});
      const compareBtn = el('button', {cls:'btn btn-sm', style:'background:var(--accent,#1A5229);color:#fff;opacity:.5;pointer-events:none'});
      compareBtn.textContent = '📊 Comparar selecionadas';
      const clearBtn = el('button', {cls:'btn btn-outline btn-sm'}, 'Limpar seleção');
      clearBtn.style.display = 'none';
      actionsEl.appendChild(compareBtn);
      actionsEl.appendChild(clearBtn);
      mainEl.appendChild(actionsEl);

      const compareWrap = el('div', {});
      mainEl.appendChild(compareWrap);

      const listEl = el('div', {cls:'hist-list'});

      function updateActions() {
        const n = selected.size;
        if (n >= 2) {
          compareBtn.style.opacity = '1';
          compareBtn.style.pointerEvents = 'auto';
          compareBtn.textContent = '📊 Comparar ' + n + ' contagens';
        } else {
          compareBtn.style.opacity = '.5';
          compareBtn.style.pointerEvents = 'none';
          compareBtn.textContent = '📊 Comparar selecionadas';
        }
        clearBtn.style.display = n > 0 ? '' : 'none';
        if (n === 0) compareWrap.innerHTML = '';
      }

      entries.forEach(entry => {
        const dt  = new Date(entry.ts);
        const dateStr = dt.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'});
        const timeStr = dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
        const totalItems = Object.keys(entry.items || {}).length;
        const zeroItems  = Object.values(entry.items || {}).filter(v => v === 0).length;

        const entryEl = el('div', {cls:'hist-entry'});
        const checkEl = el('div', {cls:'hist-entry-check'}, '');
        const dateEl  = el('div', {cls:'hist-entry-date'}, dateStr);
        const timeEl  = el('div', {cls:'hist-entry-time'}, timeStr);
        const whoEl   = el('div', {cls:'hist-entry-who'}, '👤 ' + (entry.name || '—'));
        const cntEl   = el('div', {cls:'hist-entry-count'}, totalItems + ' itens · ' + zeroItems + ' zerados');

        entryEl.append(checkEl, dateEl, timeEl, whoEl, cntEl);
        entryEl.addEventListener('click', () => {
          const key = String(entry.ts);
          if (selected.has(key)) {
            selected.delete(key);
            entryEl.classList.remove('selected');
            checkEl.textContent = '';
          } else {
            selected.add(key);
            entryEl.classList.add('selected');
            checkEl.textContent = '✓';
          }
          updateActions();
        });
        listEl.appendChild(entryEl);
      });

      mainEl.appendChild(listEl);

      clearBtn.addEventListener('click', () => {
        selected.clear();
        listEl.querySelectorAll('.hist-entry').forEach(e => {
          e.classList.remove('selected');
          e.querySelector('.hist-entry-check').textContent = '';
        });
        updateActions();
        compareWrap.innerHTML = '';
      });

      compareBtn.addEventListener('click', () => {
        const selEntries = entries.filter(e => selected.has(String(e.ts)))
          .sort((a,b) => a.ts - b.ts); // cronológica
        renderCompare(unitName, selEntries, compareWrap);
      });

    }).catch(e => {
      mainEl.innerHTML = '';
      mainEl.appendChild(el('div', {cls:'hist-empty'}, '❌ Erro ao carregar: ' + e.message));
    });
  }

  function renderCompare(unitName, selEntries, container) {
    container.innerHTML = '';
    container.appendChild(el('h3', {style:'font-size:13px;font-weight:700;margin:16px 0 10px;color:var(--text)'}, '📊 Comparativo — ' + unitName));

    const ucat = getUnitCatalog(unitName).catalog;
    const cats = getUnitCatalog(unitName).categories;

    // Cabeçalhos das colunas: Item | Cat | data1 | data2 | ...
    const wrap  = el('div', {cls:'hist-compare-wrap'});
    const table = el('table', {cls:'hist-compare-table'});
    const thead = el('thead');
    const hrHead = el('tr');
    ['Item', 'Cat.'].forEach(h => hrHead.appendChild(el('th', {}, h)));
    selEntries.forEach(e => {
      const dt = new Date(e.ts);
      const label = dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' +
                    dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      const th = el('th', {cls:'num'}, label);
      th.title = '👤 ' + (e.name || '—');
      hrHead.appendChild(th);
    });
    thead.appendChild(hrHead);
    table.appendChild(thead);

    const tbody = el('tbody');
    let lastCat = null;

    cats.forEach(cat => {
      const catItems = ucat.filter(i => i.category === cat);
      // Verificar se algum item desta categoria tem algum valor != null em qualquer contagem
      const hasData = catItems.some(item =>
        selEntries.some(e => e.items && item.id in e.items)
      );
      if (!hasData) return;

      // Linha de categoria
      const catTr = el('tr');
      const catTd = el('td', {cls:''});
      catTd.setAttribute('colspan', String(2 + selEntries.length));
      catTd.className = '';
      catTr.appendChild(catTd);
      catTr.className = 'hist-cat-row';
      catTd.textContent = cat;
      tbody.appendChild(catTr);

      catItems.forEach(item => {
        const tr = el('tr');
        tr.appendChild(el('td', {}, item.name));
        tr.appendChild(el('td', {style:'color:var(--text-3);font-size:11px'}, item.unit));
        selEntries.forEach(e => {
          const qty = e.items ? (e.items[item.id] !== undefined ? e.items[item.id] : '—') : '—';
          const td  = el('td', {cls:'num' + (qty === 0 ? ' zero' : '')});
          td.textContent = qty === '—' ? '—' : String(qty);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    });

    table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);

    // Scroll para o comparativo
    setTimeout(() => container.scrollIntoView({behavior:'smooth', block:'nearest'}), 100);
  }

  // Montar tabs
  UNIT_NAMES.forEach(u => {
    const tab = el('button', {cls:'hist-unit-tab' + (u === activeUnit2 ? ' active' : '')});
    tab.dataset.unit = u;
    tab.textContent = u;
    tab.addEventListener('click', () => renderHistUnit(u));
    tabsEl.appendChild(tab);
  });

  renderHistUnit(activeUnit2);
  return frag;
}

function viewCatalogo() {
  const frag = document.createDocumentFragment();

  // ── Unit selector tabs (CPD only) ──────────────────────────────
  // CPD: 'cpd' = CPD catalog | unit name = that unit's catalog
  let activeTab = 'cpd'; // 'cpd' or unit name

  const tabsWrap = el('div', {style:'display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap'});

  const buildTabs = () => {
    tabsWrap.innerHTML = '';
    const tabs = isCPD() ? ['cpd', ...UNIT_NAMES] : [session.unit];
    tabs.forEach(tab => {
      const label = tab === 'cpd' ? '\uD83C\uDFED CPD' : tab;
      const btn = el('button', {
        cls: 'unit-tab' + (tab === activeTab ? ' active' : ''),
        style: 'font-size:12px;padding:6px 14px',
        onclick: () => {
          activeTab = tab;
          window._catActiveTab = tab;
          buildTabs();
          buildTable();
        }
      }, label);
      tabsWrap.appendChild(btn);
    });
  };

  if (isCPD()) {
    frag.appendChild(tabsWrap);
    buildTabs();
  }

  // ── Adicionar item: agora atrás de um botão flutuante (FAB), não mais
  // um formulário sempre visível brigando por espaço com a lista ──────────
  function openAddItemModal() {
    const overlay = el('div', {cls:'modal-overlay'});
    const box = el('div', {cls:'modal-box', style:'max-width:420px'});

    const header = el('div', {cls:'modal-header'});
    header.appendChild(el('div', {cls:'modal-title'}, 'Adicionar novo item'));
    header.appendChild(el('button', {cls:'modal-close', onclick:()=>overlay.remove()}, '\u00D7'));
    box.appendChild(header);

    const body = el('div', {cls:'modal-body'});
    const nameGrp = el('div', {cls:'form-group'});
    nameGrp.appendChild(el('label', {}, 'Nome do item'));
    const nameInp = el('input', {type:'text', placeholder:'Ex: Farinha de Trigo'});
    nameGrp.appendChild(nameInp);
    body.appendChild(nameGrp);

    const rowGrp = el('div', {cls:'form-row'});
    const catGrp = el('div', {cls:'form-group', style:'margin-bottom:0'});
    catGrp.appendChild(el('label', {}, 'Categoria'));
    const catSel = el('select', {});
    const formCats = (isCPD() && (!window._catActiveTab || window._catActiveTab === 'cpd')) ? CATEGORIES : UNIT_CATEGORIES;
    formCats.forEach(c => catSel.appendChild(el('option', {value:c}, c)));
    catGrp.appendChild(catSel);
    const unitGrp = el('div', {cls:'form-group', style:'margin-bottom:0'});
    unitGrp.appendChild(el('label', {}, 'Unidade de medida'));
    const unitSel = el('select', {});
    MEASURES.forEach(u => unitSel.appendChild(el('option', {value:u}, u)));
    unitGrp.appendChild(unitSel);
    rowGrp.appendChild(catGrp);
    rowGrp.appendChild(unitGrp);
    body.appendChild(rowGrp);
    box.appendChild(body);

    const footer = el('div', {cls:'modal-footer'});
    footer.appendChild(el('button', {cls:'btn btn-outline', onclick:()=>overlay.remove()}, 'Cancelar'));
    const saveBtn = el('button', {cls:'btn btn-primary', onclick: () => {
      const name = nameInp.value.trim();
      if (!name) { alert('Informe o nome do item.'); return; }
      const isCpdForm = !window._catActiveTab || window._catActiveTab === 'cpd';
      // 28/07: usar sempre o cat\u00E1logo da ABA ativa (n\u00E3o o `unitCatalog` global,
      // que \u00E9 o da unidade logada \u2014 CPD pode estar com outra aba aberta) e
      // gravar unidade via saveUnitCatalog(), que sincroniza com Firebase de
      // verdade. Antes, o item era salvo via save('pizza_unit_catalog/<slug>', \u2026),
      // uma chave que n\u00E3o est\u00E1 em FIREBASE_SYNC_KEYS \u2014 ent\u00E3o itens novos
      // cadastrados numa unidade ficavam s\u00F3 no localStorage do aparelho,
      // nunca chegavam no banco.
      const targetCat2 = isCpdForm ? catalog : getUnitCatalog(window._catActiveTab || 'Asa Sul').catalog;
      if (targetCat2.find(i => i.name.toLowerCase() === name.toLowerCase())) { alert('J\u00E1 existe um item com esse nome.'); return; }
      const _keyNorm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
      const item = {id: Date.now().toString(), name, key: _keyNorm(name), category: catSel.value, unit: unitSel.value};
      targetCat2.push(item);
      isCpdForm ? save('pizza_catalog', targetCat2) : saveUnitCatalog(window._catActiveTab || 'Asa Sul', targetCat2);
      toast('Item "'+name+'" adicionado ao cat\u00E1logo!');
      overlay.remove();
      render();
    }}, svgCheck(), ' Adicionar');
    footer.appendChild(saveBtn);
    box.appendChild(footer);

    overlay.appendChild(box);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    nameInp.focus();
  }

  if (isCPD()) {
    const fab = el('button', {
      cls: 'catalogo-fab', title: 'Adicionar novo item',
      onclick: openAddItemModal
    }, '+');
    frag.appendChild(fab);
  }

  // (o formCard antigo não é mais anexado — a adição de item agora vive no modal do FAB acima)

  // ── Table container (rebuilt when tab changes) ──────────────────
  const tableContainer = el('div');
  frag.appendChild(tableContainer);

  function buildTable() {
    tableContainer.innerHTML = '';

    const isCpdTab   = activeTab === 'cpd';
    const showPrices = isCpdTab && isCPD();
    const tabUnit    = isCpdTab ? null : activeTab;

    // Stock source for this tab
    const stockObj = isCpdTab ? cpd : (unitStock[activeTab] || {});

    // Minimums: per-unit minimums stored in unitMinimums[unitName]
    // For CPD tab use global minimums; for unit tabs use unit-specific minimums
    if (!window.unitMinimums) window.unitMinimums = {};
    const activeMins = isCpdTab ? minimums : (window.unitMinimums[activeTab] || {});

    // Catálogo e categorias ativos para esta aba
    const _tabUnit   = isCpdTab ? null : activeTab;
    const _tabInfo   = _tabUnit ? getUnitCatalog(_tabUnit) : null;
    const tabCatalog = isCpdTab ? catalog    : _tabInfo.catalog;
    const tabCats    = isCpdTab ? CATEGORIES : _tabInfo.categories;
    // Catalog table
    const tableBlock = el('div', {cls:'table-wrap'});
    const thead = el('div', {cls:'table-header'});
    const tabLabel = isCpdTab ? 'CPD' : activeTab;
    thead.appendChild(el('span', {cls:'table-title'}, `${tabCatalog.length} itens \u2014 ${tabLabel}`));

    if (showPrices) {
      const totalVal = tabCatalog.reduce((s, i) => s + (cpd[i.id]||0) * (prices[i.id]||0), 0);
      const withPrice = tabCatalog.filter(i => prices[i.id] > 0).length;
      if (withPrice > 0) {
        const badge = el('div', {style:'display:flex;flex-direction:column;align-items:flex-end;gap:2px'});
        badge.appendChild(el('span', {style:'font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px'}, 'Valor total CPD'));
        badge.appendChild(el('span', {style:'font-size:15px;font-weight:700;color:var(--accent-dark);font-family:"Playfair Display",serif'},
          totalVal.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})));
        thead.appendChild(badge);
      }
    }
    tableBlock.appendChild(thead);

    const searchWrap = el('div', {cls:'search-wrap', style:'padding:14px 18px 0'});
    searchWrap.appendChild(el('span', {cls:'search-icon', html:'<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'}));
    const searchInp = el('input', {type:'text', placeholder:'Buscar item...'});
    searchWrap.appendChild(searchInp);
    tableBlock.appendChild(searchWrap);

    const table = el('table', {cls:'catalog-table', style:'margin-top:8px'});

    if (showPrices) {
      table.innerHTML = '<thead><tr>' +
        '<th style="width:26%">Nome</th>' +
        '<th class="col-unit" style="width:7%">Medida</th>' +
        '<th style="width:7%;text-align:right">Qtd CPD</th>' +
        '<th class="col-min" style="width:8%;text-align:right;font-size:10px;color:var(--text-3)">M\u00CDN.</th>' +
        '<th style="width:14%;text-align:right">Pre\u00E7o unit.</th>' +
        '<th style="width:14%;text-align:right">Valor total</th>' +
        '<th style="width:24%;text-align:right" colspan="2">A\u00E7\u00F5es</th>' +
        '</tr></thead>';
    } else if (isCpdTab) {
      table.innerHTML = '<thead><tr>' +
        '<th style="width:38%">Nome</th>' +
        '<th class="col-unit" style="width:9%">Medida</th>' +
        '<th style="width:9%;text-align:right">Qtd CPD</th>' +
        '<th class="col-min" style="width:9%;text-align:right;font-size:10px;color:var(--text-3)">M\u00CDN.</th>' +
        '<th style="width:35%;text-align:right" colspan="2">A\u00E7\u00F5es</th>' +
        '</tr></thead>';
    } else {
      // Unit tab — show unit stock + unit-specific minimum (editable by CPD)
      table.innerHTML = '<thead><tr>' +
        `<th style="width:38%">Nome \u2014 ${activeTab}</th>` +
        '<th class="col-unit" style="width:9%">Medida</th>' +
        `<th style="width:9%;text-align:right">Qtd</th>` +
        '<th class="col-min" style="width:9%;text-align:right;font-size:10px;color:var(--text-3)">M\u00CDN.</th>' +
        '<th style="width:35%;text-align:right" colspan="2">A\u00E7\u00F5es</th>' +
        '</tr></thead>';
    }

    const tbody = el('tbody', {});
    // openCats persiste entre renders usando um mapa global keyed por tableId
  // Assim categorias abertas não fecham quando o Firebase atualiza dados
  // _tableId = searchInp.id para garantir consistência com o setAttribute acima
  const _tableId = searchInp.id;
  if (!window._openCatsMap) window._openCatsMap = {};
  if (!window._openCatsMap[_tableId]) {
    window._openCatsMap[_tableId] = {};
  }
  const openCats = window._openCatsMap[_tableId];

  // Cache de linhas DOM por categoria — evita recriar elementos já montados
  if (!window._rowCache) window._rowCache = {};
  if (!window._rowCache[_tableId]) window._rowCache[_tableId] = {};
  const rowCache = window._rowCache[_tableId];

    const renderRows = (search) => {
      tbody.innerHTML = '';
      const q = search.toLowerCase().trim();
      const filtered = tabCatalog.filter(i => !q || i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));
      if (!filtered.length) {
        tbody.appendChild(el('tr', {}, el('td', {colspan:'6', cls:'empty'}, 'Nenhum item encontrado')));
        return;
      }
      // Derivar categorias do catálogo ativo da aba (CPD ou Unidades)
      const allCatsInSource = [...new Set(tabCatalog.map(i => i.category))];
      const catOrder = (isCpdTab ? CATEGORIES : UNIT_CATEGORIES).filter(c => allCatsInSource.includes(c));
      const extraCats = allCatsInSource.filter(c => !catOrder.includes(c));
      const usedCats = [...catOrder, ...extraCats].filter(cat => filtered.some(i => i.category === cat));
      usedCats.forEach(cat => {
        const catItems = filtered.filter(i => i.category === cat);
        const isOpen = openCats[cat] === true; // fechado por padrão

        const catTr = el('tr', {cls:'cat-row'});
        const catTd = document.createElement('td');
        catTd.setAttribute('colspan', showPrices ? '7' : '6');
        catTd.style.cssText = 'padding:0;width:100%;';
        const togBtn = el('button', {cls:'cat-toggle' + (isOpen ? ' open' : '')});
        const alertCount = isCpdTab ? catItems.filter(i => (stockObj[i.id]||0) === 0 && (activeMins[i.id]||0) > 0).length : 0;
        // Nome da categoria vem do cat\u00E1logo (edit\u00E1vel por admin) \u2014 usa textContent
        // via el() em vez de innerHTML para n\u00E3o interpretar o texto como HTML.
        const catCountText = `${catItems.length} itens${alertCount > 0 ? ` \u00B7 \u26A0 ${alertCount}` : ''}`;
        togBtn.appendChild(el('span', {cls:'cat-name'}, cat));
        togBtn.appendChild(el('span', {cls:'cat-count'}, catCountText));
        togBtn.appendChild(el('span', {cls:'cat-chevron'}, '\u25B2'));
        togBtn.addEventListener('click', () => {
          openCats[cat] = !openCats[cat];
          togBtn.classList.toggle('open', openCats[cat]);
          rows.forEach(r => { r.style.display = openCats[cat] ? '' : 'none'; });
        });
        catTd.appendChild(togBtn); catTr.appendChild(catTd); tbody.appendChild(catTr);

        const rows = [];
        catItems.forEach(item => {
          const qty   = stockObj[item.id] || 0;
          // 27/07: estoque mínimo por item desativado para abas de unidade —
          // só continua ativo na aba CPD. Unidades usam mínimo apenas dentro
          // da lógica de Envios do Dia (MIN_PER_DAY_*).
          const min   = isCpdTab ? (activeMins[item.id] || 0) : 0;
          const isZero = qty === 0 && min > 0;
          const isLow  = min > 0 && qty < min && !isZero;

          const tr = el('tr', {style: isZero ? 'background:var(--danger-bg)' : isLow ? 'background:var(--warning-bg)' : ''});
          if (!isOpen) tr.style.display = 'none';

          // Name cell
          const nameTd = el('td', {cls:'item-name'});
          const nameLabel = el('span', {}, item.name);
          const nameInp   = el('input', {type:'text', value:item.name, style:'display:none;width:100%;padding:3px 6px;border:1.5px solid var(--accent);border-radius:4px;font-size:13px;outline:none'});
          const catInline = el('span', {cls:'item-unit-inline', style: (isZero||isLow)?`color:${isZero?'var(--danger)':'#E8A020'};font-weight:600`:''}, item.unit);
          const saveNameFn = () => {
            const v = nameInp.value.trim() || item.name;
            // Renomear só troca o nome exibido. item.key (usado pelo cálculo
            // de A Enviar e pelo MIN_PER_DAY) fica fixo — renomear não quebra
            // mais o item de Envios do Dia nem exige nenhum ajuste manual.
            item.name = v; nameLabel.textContent = v;
            isCpdTab ? save('pizza_catalog', tabCatalog) : saveUnitCatalog(activeTab, tabCatalog);
            nameInp.style.display='none'; nameLabel.style.display='';
          };
          nameLabel.addEventListener('click', () => { nameLabel.style.display='none'; nameInp.style.display=''; nameInp.focus(); nameInp.select(); });
          nameInp.addEventListener('blur', saveNameFn);
          nameInp.addEventListener('keydown', e => { if(e.key==='Enter') saveNameFn(); if(e.key==='Escape'){nameInp.style.display='none';nameLabel.style.display='';} });
          nameTd.appendChild(nameLabel); nameTd.appendChild(nameInp); nameTd.appendChild(catInline);
          tr.appendChild(nameTd);

          // Medida cell (editable)
          const unitTd = el('td', {cls:'muted col-unit', style:'cursor:pointer;white-space:nowrap'});
          const unitSpan = el('span', {style:'font-size:12px;color:var(--text-2);border-bottom:1px dashed var(--border)'}, item.unit);
          const unitInp  = el('input', {type:'text', value:item.unit, style:'display:none;width:70px;padding:2px 5px;border:1.5px solid var(--accent);border-radius:4px;font-size:12px;outline:none'});
          unitSpan.addEventListener('click', () => { unitSpan.style.display='none'; unitInp.style.display=''; unitInp.focus(); unitInp.select(); });
          const saveUnitFn = () => {
            const v = unitInp.value.trim() || item.unit;
            item.unit = v; unitSpan.textContent = v; catInline.textContent = v;
            isCpdTab ? save('pizza_catalog', tabCatalog) : saveUnitCatalog(activeTab, tabCatalog);
            unitInp.style.display='none'; unitSpan.style.display='';
          };
          unitInp.addEventListener('blur', saveUnitFn);
          unitInp.addEventListener('keydown', e => { if(e.key==='Enter') saveUnitFn(); if(e.key==='Escape'){unitInp.style.display='none';unitSpan.style.display='';} });
          unitTd.appendChild(unitSpan); unitTd.appendChild(unitInp);
          tr.appendChild(unitTd);

          // Qty cell (read-only in catalog)
          tr.appendChild(el('td', {cls: qty===0&&min>0?'danger':qty>0&&isLow?'warn':'', style:'text-align:right;font-weight:700'}, String(qty)));

          // Min cell — editável só na aba CPD. Nas abas de unidade, o
          // estoque mínimo por item foi desativado (27/07) — mínimo de
          // unidade agora só existe na lógica de Envios do Dia — mostramos
          // um rótulo neutro em vez de um número editável.
          const minTd = el('td', {cls:'col-min', style:'text-align:right;padding-right:8px'});
          if (isCpdTab) {
            minTd.style.cursor = 'pointer';
            const minSpan = el('span', {style:'font-size:12px;color:var(--text-3);border-bottom:1px dashed var(--border)'}, min > 0 ? String(min) : '\u2014');
            const minInp  = el('input', {type:'number', inputmode:'decimal', value: min > 0 ? String(min) : '0',
              style:'display:none;width:54px;padding:3px 6px;border:1.5px solid #B8922A;border-radius:4px;font-size:12px;text-align:right;outline:none'});
            minSpan.addEventListener('click', () => { minSpan.style.display='none'; minInp.style.display=''; minInp.focus(); minInp.select(); });
            const saveMinFn = () => {
              const v = Math.max(0, parseFloat(minInp.value)||0);
              minimums[item.id] = v;
              save('pizza_minimums', minimums);
              minSpan.textContent = v > 0 ? String(v) : '\u2014';
              catInline.style.color = '';
              catInline.style.fontWeight = '';
              minInp.style.display='none'; minSpan.style.display='';
            };
            minInp.addEventListener('blur', saveMinFn);
            minInp.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();saveMinFn();} if(e.key==='Escape'){minInp.style.display='none';minSpan.style.display='';} });
            minTd.appendChild(minSpan); minTd.appendChild(minInp);
          } else {
            minTd.appendChild(el('span', {style:'font-size:10.5px;color:var(--text-3);font-style:italic'}, 'Envios do Dia'));
            minTd.title = 'Mínimo por item desativado para unidades — gerenciado pela lógica de Envios do Dia (SEG/QUA/SEX).';
          }
          tr.appendChild(minTd);

          // Price cell (CPD only)
          if (showPrices) {
            const price = prices[item.id] || 0;
            const priceTd = el('td', {style:'text-align:right;cursor:pointer'});
            const priceSpan = el('span', {style:'font-size:12px;color:var(--text-2);border-bottom:1px dashed var(--border)'},
              price > 0 ? price.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) : '\u2014');
            const priceInp = el('input', {type:'number', inputmode:'decimal', value: price > 0 ? String(price) : '',
              style:'display:none;width:80px;padding:2px 5px;border:1.5px solid var(--accent);border-radius:4px;font-size:12px;text-align:right;outline:none'});
            priceSpan.addEventListener('click', () => { priceSpan.style.display='none'; priceInp.style.display=''; priceInp.focus(); priceInp.select(); });
            const savePriceFn = () => {
              const v = parseFloat(priceInp.value)||0;
              prices[item.id] = v; save('pizza_prices', prices);
              priceSpan.textContent = v > 0 ? v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) : '\u2014';
              priceInp.style.display='none'; priceSpan.style.display='';
            };
            priceInp.addEventListener('blur', savePriceFn);
            priceInp.addEventListener('keydown', e => { if(e.key==='Enter') savePriceFn(); if(e.key==='Escape'){priceInp.style.display='none';priceSpan.style.display='';} });
            priceTd.appendChild(priceSpan); priceTd.appendChild(priceInp);
            tr.appendChild(priceTd);
            const totalVal2 = qty * (prices[item.id]||0);
            tr.appendChild(el('td', {style:'text-align:right;font-size:12px;color:var(--text-2)'},
              totalVal2 > 0 ? totalVal2.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) : '\u2014'));
          }

          // Actions
          const actionsTd = el('td', {style:'text-align:right;white-space:nowrap;gap:4px;display:flex;align-items:center;justify-content:flex-end'});

          // ── Mover categoria (apenas unidades, apenas CPD logado) ──────────
          if (!isCpdTab && isCPD()) {
            const moveCatBtn = el('button', {
              cls:'btn btn-outline btn-sm',
              style:'font-size:11px;padding:2px 7px',
              title:'Mover para outra categoria'
            }, '\uD83D\uDCC2 Categoria');
            moveCatBtn.addEventListener('click', () => {
              // Modal inline para escolha de categoria
              const modal = el('div', {style:'position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center'});
              const box   = el('div', {style:'background:var(--surface);border-radius:var(--radius);padding:24px;min-width:280px;max-width:340px;box-shadow:var(--shadow-lg,0 8px 32px rgba(0,0,0,.25))'});
              box.appendChild(el('div', {style:'font-weight:700;font-size:15px;margin-bottom:4px'}, 'Mover categoria'));
              box.appendChild(el('div', {style:'font-size:12px;color:var(--text-3);margin-bottom:16px'}, item.name));
              tabCats.forEach(c => {
                const btn = el('button', {
                  style:'display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:6px;border-radius:6px;border:1.5px solid ' + (c === item.category ? 'var(--accent)' : 'var(--border)') + ';background:' + (c === item.category ? 'var(--accent-light,#e6f4ec)' : 'var(--surface)') + ';font-size:13px;cursor:pointer;font-weight:' + (c === item.category ? '700' : '400')
                }, (c === item.category ? '\u2713 ' : '') + c);
                if (c !== item.category) {
                  btn.addEventListener('click', () => {
                    item.category = c;
                    isCpdTab ? save('pizza_catalog', tabCatalog) : saveUnitCatalog(activeTab, tabCatalog);
                    document.body.removeChild(modal);
                    buildTable();
                    toast('Item movido para ' + c);
                  });
                }
                box.appendChild(btn);
              });
              const cancelBtn = el('button', {cls:'btn btn-outline btn-sm', style:'width:100%;margin-top:4px'}, 'Cancelar');
              cancelBtn.addEventListener('click', () => document.body.removeChild(modal));
              box.appendChild(cancelBtn);
              modal.appendChild(box);
              modal.addEventListener('click', e => { if (e.target === modal) document.body.removeChild(modal); });
              document.body.appendChild(modal);
            });
            actionsTd.appendChild(moveCatBtn);
          }

          // ── Reordenar ↑ ↓ (apenas unidades, apenas CPD logado) ───────────
          if (!isCpdTab && isCPD()) {
            const moveUp = el('button', {
              cls:'btn btn-outline btn-sm',
              style:'font-size:12px;padding:2px 7px',
              title:'Mover para cima'
            }, '\u2191');
            const moveDn = el('button', {
              cls:'btn btn-outline btn-sm',
              style:'font-size:12px;padding:2px 7px',
              title:'Mover para baixo'
            }, '\u2193');
            const moveItem = (delta) => {
              // Itens da mesma categoria
              const catItems = tabCatalog.filter(i => i.category === item.category);
              const globalIdx = tabCatalog.indexOf(item);
              const catIdx    = catItems.indexOf(item);
              const targetCatIdx = catIdx + delta;
              if (targetCatIdx < 0 || targetCatIdx >= catItems.length) return;
              // Achar posição global do vizinho
              const neighbor   = catItems[targetCatIdx];
              const neighborGi = tabCatalog.indexOf(neighbor);
              // Trocar no array global
              tabCatalog[globalIdx]    = neighbor;
              tabCatalog[neighborGi]   = item;
              isCpdTab ? save('pizza_catalog', tabCatalog) : saveUnitCatalog(activeTab, tabCatalog);
              buildTable();
            };
            moveUp.addEventListener('click', () => moveItem(-1));
            moveDn.addEventListener('click', () => moveItem(+1));
            actionsTd.appendChild(moveUp);
            actionsTd.appendChild(moveDn);
          }

          // ── Remover ───────────────────────────────────────────────────────
          const removeBtn = el('button', {cls:'btn btn-outline btn-sm', style:'color:var(--danger);border-color:var(--danger);font-size:11px', onclick:()=>{
            if (!confirm(`Remover "${item.name}" do cat\u00E1logo?`)) return;
            const idx = tabCatalog.indexOf(item);
            if (idx >= 0) tabCatalog.splice(idx, 1);
            isCpdTab ? save('pizza_catalog', tabCatalog) : saveUnitCatalog(activeTab, tabCatalog);
            tr.remove();
            toast('Item removido');
          }}, 'Remover');
          actionsTd.appendChild(removeBtn);
          tr.appendChild(actionsTd);

          rows.push(tr);
          tbody.appendChild(tr);
        });
      });
    };

    searchInp.addEventListener('input', () => renderRows(searchInp.value));
    renderRows('');
    table.appendChild(tbody);
    tableBlock.appendChild(table);
    tableContainer.appendChild(tableBlock);
  }

  buildTable();
  return frag;
}

// ═══ PATCH CIRÚRGICO DE VALORES ══════════════════════════════════════════════
// Atualiza apenas os números no DOM já existente quando o Firebase sincroniza.
// Preserva: foco do teclado, categorias abertas, estado de digitação.
// Usado pelo listener Firebase em vez de render() completo.
function patchStockValues(stockObj, useMin, unitMins) {
  useMin  = useMin  || false;
  unitMins = unitMins || {};

  // Elemento com foco atual — não tocar nele
  const focused = document.activeElement;
  const focusedItemId = focused ? focused.getAttribute('data-qty-input') : null;

  // Percorrer todos os <tr> marcados com data-item-id
  const rows = document.querySelectorAll('tr[data-item-id]');
  rows.forEach(tr => {
    const itemId = tr.getAttribute('data-item-id');
    if (!itemId) return;

    const newQty = stockObj[itemId] || 0;
    const inp = tr.querySelector('[data-qty-input]');

    // Atualizar input apenas se: não está com foco E valor mudou
    if (inp && inp.getAttribute('data-qty-input') !== focusedItemId) {
      const curVal = parseFloat(inp.value.replace(',','.')) || 0;
      if (curVal !== newQty) {
        inp.value = String(newQty);
        // Atualizar classe visual do input
        const uMin = useMin ? (unitMins[itemId] || 0) : 0;
        if (newQty === 0 && uMin > 0) inp.className = 'qty-inp-sm has-error';
        else if (newQty > 0)         inp.className = 'qty-inp-sm has-val';
        else                          inp.className = 'qty-inp-sm';
      }
    }

    // Atualizar classe da linha (cor de fundo) sem recriar
    const uMin = useMin ? (unitMins[itemId] || 0) : 0;
    const newQtyN = stockObj[itemId] || 0;
    const isZero = newQtyN === 0;
    const isLow  = uMin > 0 && newQtyN < uMin && !isZero;

    // Só mudar se a classe realmente mudou (evita reflow desnecessário)
    const wantClass = isZero ? 'count-danger' : isLow ? 'count-warn' : '';
    const curClass  = tr.className || '';
    if (wantClass && !curClass.includes(wantClass)) {
      tr.className = wantClass;
      tr.style.background = '';
    } else if (!wantClass && (curClass.includes('count-'))) {
      tr.className = '';
      if (!useMin) tr.style.background = '';
    }
  });
}

// Versão especializada para o painel de unidades (read-only, coluna A Enviar)
function patchUnitReadValues(unitStockObj, unitName) {
  const focused = document.activeElement;
  const rows = document.querySelectorAll('tr[data-item-id]');
  // 27/07: "A Enviar" agora sempre segue a lógica de Envios do Dia
  // (MIN_PER_DAY_*, por dia da semana) — igual ao render inicial. Antes
  // este patch usava window.unitMinimums (mínimo fixo por item), diferente
  // do valor mostrado no primeiro carregamento — uma atualização ao vivo
  // podia sobrescrever o número certo pelo errado.
  const day = nextEnviarDay();

  rows.forEach(tr => {
    const itemId = tr.getAttribute('data-item-id');
    if (!itemId) return;
    const itemKey = tr.getAttribute('data-item-key');
    const qty = unitStockObj[itemId] || 0;

    // Célula de quantidade (read-only: td com font-weight:700, não input)
    const qtyTd = tr.querySelector('td[data-qty-cell]');
    if (qtyTd) qtyTd.textContent = String(qty);

    // Célula A Enviar
    const envTd = tr.querySelector('td[data-aenviar-cell]');
    if (envTd && itemKey) {
      const contado = itemFoiContado(unitName, itemId, qty);
      const aEnviar = contado ? calcAEnviar(unitName, itemKey, qty, day) : 0;
      envTd.textContent = !contado ? 'NC' : (aEnviar > 0 ? String(aEnviar) : '\u2014');
      envTd.style.color = !contado ? '#E8A020' : (aEnviar > 0 ? 'var(--accent-dark,#1A5229)' : 'var(--text-3)');
    }
  });
}

  const prevScrollY = window.scrollY || document.documentElement.scrollTop;

  contentEl.innerHTML = '';
  // Limpar cache de linhas DOM — foram destruídas pelo innerHTML=''
  // _openCatsMap é preservado (mantém categorias abertas/fechadas)
  window._rowCache = {};
  let node;
  if (currentView === 'cpd')         node = viewCpd();
  else if (currentView === 'units')      node = viewUnits();
  else if (currentView === 'catalogo')   node = viewCatalogo();
  else if (currentView === 'envios-dia') node = viewEnviosDia();
  else if (currentView === 'historico-contagens') node = viewHistoricoContagens();
  else if (currentView === 'producao') node = viewQuadroProducao();
  else if (currentView === 'validade') node = viewValidadeControl();
  if (node) contentEl.appendChild(node);

  // Restaurar scroll após render (evita que a tela "pule" para o topo)
  if (prevScrollY > 0) {
    requestAnimationFrame(() => window.scrollTo(0, prevScrollY));
  }

  // Notificações de recebimento pendentes

  // Aviso de contagem em aberto (rascunho que não morre sozinho — só finaliza ou descarta)
  renderOpenCountBanner();
}

// FERRAMENTA DE MIGRA\u00C7\u00C3O \u2014 use no console do browser (F12)
// para enviar dados do localStorage para o Firebase
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
window.migrarParaFirebase = function() {
  const chaves = [
    'pizza_cpd', 'pizza_units', 'pizza_minimums',
    'pizza_orders', 'pizza_movements', 'pizza_catalog',
    'pizza_prices', 'pizza_templates'
  ];
  let migrados = 0;
  chaves.forEach(chave => {
    const dados = localStorage.getItem(chave);
    if (dados) {
      try {
        const parsed = JSON.parse(dados);
        db.ref('dados/' + chave).set(parsed)
          .then(() => {
            migrados++;
            console.log('[Migracao] OK:', chave);
            if (migrados === chaves.filter(c => localStorage.getItem(c)).length) {
              console.log('[Migracao] COMPLETA! Todos os dados foram enviados ao Firebase.');
              alert('Migracao concluida! ' + migrados + ' chaves enviadas ao Firebase.');
            }
          })
          .catch(e => console.error('[Migracao] ERRO:', chave, e));
      } catch(e) {
        console.error('[Migracao] Erro ao parsear:', chave);
      }
    }
  });
  console.log('[Migracao] Iniciada para', chaves.filter(c => localStorage.getItem(c)).length, 'chaves...');
};

window.verificarFirebase = function() {
  db.ref('dados').once('value').then(snap => {
    const data = snap.val();
    if (!data) { console.log('[Firebase] Banco vazio'); return; }
    Object.keys(data).forEach(k => {
      const val = data[k];
      const size = JSON.stringify(val).length;
      console.log('[Firebase]', k, '-', Array.isArray(val) ? val.length + ' itens' : size + ' bytes');
    });
  });
};
console.log('[Sesconetto] Firebase pronto. Comandos disponiveis:');
console.log('  migrarParaFirebase() - envia dados locais ao Firebase');
console.log('  verificarFirebase()  - lista o que esta no banco');
</script>
